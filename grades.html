<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grade Check — RealityCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --paper: #f6f2ea; --card: #fffdf8; --ink: #1f1d1a; --muted: #6f6a61; --line: #e4ddd0; --line-strong: #cfc6b6;
    --accent: #e0603a; --accent-soft: #fbe3d9; --sage: #5d8a6a; --sage-soft: #e3eee5; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "DM Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: "DM Mono", ui-monospace, monospace; }
  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; margin: 0; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .back { color: var(--ink); font-weight: 600; text-decoration: none; border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 12px; background: var(--card); }
  .layout { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card h2 { font-family: "Fraunces", serif; font-size: 19px; font-weight: 500; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
  input[type=text], input[type=number], select {
    background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0;
  }
  input:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  .btn:hover { opacity: .9; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }
  .warn { color: var(--accent); }
  .linkbtn { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; align-self: flex-start; }
  .x { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
  .empty { font-size: 14px; color: var(--muted); margin: 0; }

  /* Class tabs */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab .pip { width: 8px; height: 8px; border-radius: 50%; }

  /* Category editor */
  .cat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
  .cat-top { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 8px; align-items: center; }
  .cat-top input { font-weight: 600; }
  .weight { position: relative; }
  .weight input { padding-right: 26px; }
  .weight span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) 62px 10px 62px auto; gap: 6px; align-items: center; font-size: 14px; }
  .item input { padding: 6px 8px; font-size: 14px; }
  .item .slash { color: var(--muted); text-align: center; }
  .item.pending input.score { background: var(--paper); border-style: dashed; }
  .cat-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  /* The verdict */
  .verdict { --tone: var(--sage); --tone-soft: var(--sage-soft); border-top: 6px solid var(--tone); }
  .verdict.c3 { --tone: #c9932b; --tone-soft: #fdf0d6; }
  .verdict.c4 { --tone: var(--accent); --tone-soft: var(--accent-soft); }
  .verdict.c5 { --tone: #a3261b; --tone-soft: #f6d9d4; }
  .v-label { font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tone); font-weight: 500; }
  .v-head { font-family: "Fraunces", serif; font-size: 30px; line-height: 1.15; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .v-head b { color: var(--tone); }
  .v-sub { color: var(--muted); margin: 0; }
  .v-call { background: var(--tone-soft); border-radius: 10px; padding: 10px 12px; margin: 14px 0 0; font-weight: 600; color: var(--ink); }
  .cooked-dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
  .cooked-dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--tone); }
  .cooked-dots i.on { background: var(--tone); }

  .meter { position: relative; height: 16px; border-radius: 8px; background: var(--paper); margin: 34px 0 26px; }
  .meter .banked { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 8px 0 0 8px; opacity: .85; }
  .meter .left { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--line-strong) 0 4px, transparent 4px 8px); }
  .meter .mark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--tone); }
  .meter .mark span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: "DM Mono", monospace; font-size: 11px; color: var(--tone); }
  .meter .tick { position: absolute; bottom: -20px; transform: translateX(-50%); font-family: "DM Mono", monospace; font-size: 11px; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .rung { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 11px; cursor: pointer; text-align: left; }
  .rung[aria-pressed="true"] { border: 2px solid var(--ink); padding: 8px 10px; }
  .rung .l { font-family: "Fraunces", serif; font-size: 22px; font-weight: 700; line-height: 1; }
  .rung .n { font-family: "DM Mono", monospace; font-size: 13px; margin-top: 4px; }
  .rung .h { font-size: 11.5px; color: var(--muted); }
  .rung.gone { opacity: .55; }
  .rung.gone .n { text-decoration: line-through; }
  .rung.safe .n { color: var(--sage); }

  .whatif { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .whatif input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
  .whatif .out { font-family: "Fraunces", serif; font-size: 22px; font-weight: 700; }

  .cat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
  .cat-row .bar { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--paper); }
  .cat-row .bar i { display: block; height: 100%; }
  .cat-row .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

  .cram-tie { background: #fff4e0; border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
  .cram-tie .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Shared engine: gradeSummary() lives next to the scheduler and Cram mode -->
<script src="engine.js"></script>
<script src="rail.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const GRADES_DEFAULT = { classes: [], selected: null };
const TONE = ["var(--sage)", "var(--sage)", "#c9932b", "var(--accent)", "#a3261b"];
const pct = (x, d = 0) => `${x.toFixed(d)}%`;

const item = (name, score, outOf) => ({ id: newId(), name, score, outOf });
const cat = (name, weight, items = []) => ({ id: newId(), name, weight, items });
const newClass = (name = "") => ({
  id: newId(), name, target: "B", scale: DEFAULT_SCALE.map((x) => x.slice()),
  categories: [cat("Homework", 20), cat("Quizzes", 15), cat("Midterms", 35), cat("Final", 30)],
});
const exampleClass = () => ({
  id: newId(), name: "MA 261", target: "B", scale: DEFAULT_SCALE.map((x) => x.slice()),
  categories: [
    cat("Homework", 20, [item("HW 1", 18, 20), item("HW 2", 15, 20), item("HW 3", 14, 20), item("HW 4", "", 20), item("HW 5", "", 20)]),
    cat("Quizzes", 10, [item("Quiz 1", 7, 10), item("Quiz 2", 6, 10)]),
    cat("Midterms", 40, [item("Midterm 1", 64, 100), item("Midterm 2", "", 100)]),
    cat("Final", 30),
  ],
});

/* Same storage hook as the other pages, so data stays in sync across tabs. */
function useStoredState(key, fallback) {
  const [value, setValue] = useState(() => {
    try { const v = JSON.parse(localStorage.getItem(key)); if (v && typeof v === "object") return { ...fallback, ...v }; } catch (e) {}
    return fallback;
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }, [key, value]);
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== key || e.newValue == null) return;
      try { setValue({ ...fallback, ...JSON.parse(e.newValue) }); } catch (err) {}
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [key]);
  return [value, setValue];
}

const numOrBlank = (v) => (v === "" ? "" : Number(v));

function CategoryEditor({ c, onChange, onRemove }) {
  const set = (patch) => onChange({ ...c, ...patch });
  const setItem = (id, patch) => set({ items: c.items.map((i) => (i.id === id ? { ...i, ...patch } : i)) });
  const graded = c.items.filter((i) => hasScore(i) && Number(i.outOf) > 0);
  const got = graded.reduce((s, i) => s + Number(i.score), 0), of = graded.reduce((s, i) => s + Number(i.outOf), 0);
  const pendingN = c.items.filter((i) => !hasScore(i)).length;
  const lastOutOf = c.items.length ? c.items[c.items.length - 1].outOf : 100;
  return (
    <div className="cat">
      <div className="cat-top">
        <input type="text" value={c.name} placeholder="Category" aria-label="Category name" onChange={(e) => set({ name: e.target.value })} />
        <div className="weight">
          <input type="number" min="0" max="100" value={c.weight} aria-label={`${c.name || "Category"} weight`}
            onChange={(e) => set({ weight: numOrBlank(e.target.value) })} />
          <span>%</span>
        </div>
        <button className="x" aria-label={`Remove ${c.name || "category"}`} onClick={onRemove}>×</button>
      </div>
      {c.items.map((i) => (
        <div key={i.id} className={"item" + (hasScore(i) ? "" : " pending")}>
          <input type="text" value={i.name} placeholder="Name" aria-label="Item name" onChange={(e) => setItem(i.id, { name: e.target.value })} />
          <input className="score" type="number" min="0" value={i.score} placeholder="—" aria-label={`${i.name || "Item"} score`}
            onChange={(e) => setItem(i.id, { score: numOrBlank(e.target.value) })} />
          <span className="slash">/</span>
          <input type="number" min="1" value={i.outOf} aria-label={`${i.name || "Item"} out of`}
            onChange={(e) => setItem(i.id, { outOf: numOrBlank(e.target.value) })} />
          <button className="x" aria-label={`Remove ${i.name || "item"}`} onClick={() => set({ items: c.items.filter((x) => x.id !== i.id) })}>×</button>
        </div>
      ))}
      <div className="cat-meta">
        <span>
          {c.items.length === 0 ? "Nothing listed, so all of it counts as still to come."
            : `${of ? `${pct((got / of) * 100, 1)} so far` : "Nothing graded yet"}${pendingN ? ` · ${pendingN} still to come` : ""}`}
        </span>
        <button className="linkbtn" type="button"
          onClick={() => set({ items: [...c.items, item(`${(c.name || "Item").replace(/s$/, "")} ${c.items.length + 1}`, "", lastOutOf || 100)] })}>+ Add item</button>
      </div>
    </div>
  );
}

function Meter({ s }) {
  const need = s.targetNeed;
  // Where the target lands on the whole-class scale, and what you'd end with at your current pace
  const targetX = clamp(s.targetCut, 0, 100);
  const paceX = s.current == null ? null : clamp(s.banked + (s.pending * s.current) / 100, 0, 100);
  return (
    <>
      <div className="meter" role="img"
        aria-label={`Banked ${pct(s.banked, 1)} of the final grade, ${pct(s.pending, 1)} still to come, target ${s.targetCut}%`}>
        <div className="banked" style={{ width: `${s.banked}%` }} />
        <div className="left" style={{ left: `${s.banked}%`, width: `${s.pending}%` }} />
        <div className="mark" style={{ left: `${targetX}%` }}><span>{letterFor(s.targetCut, s.scale)} line · {s.targetCut}%</span></div>
        {paceX != null && <div className="mark" style={{ left: `${paceX}%`, background: "var(--ink)", top: 0, bottom: 0 }} title="Where you end up at your current pace" />}
        {[0, 50, 100].map((t) => <span key={t} className="tick" style={{ left: `${t}%` }}>{t}</span>)}
      </div>
      <div className="legend">
        <span><i style={{ background: "var(--ink)" }} />banked: {pct(s.banked, 1)}</span>
        <span><i style={{ background: "repeating-linear-gradient(135deg, #cfc6b6 0 2px, transparent 2px 4px)" }} />still to come: {pct(s.pending, 1)}</span>
        {paceX != null && <span>| at your pace you finish around <b>{pct(paceX, 1)} ({letterFor(paceX, s.scale)})</b></span>}
      </div>
    </>
  );
}

function App() {
  const [g, setG] = useStoredState(GRADES_KEY, GRADES_DEFAULT);
  const [cram, setCram] = useStoredState(CRAM_KEY, CRAM_DEFAULT);
  const [showScale, setShowScale] = useState(false);
  const [whatIf, setWhatIf] = useState(null);
  const cls = g.classes.find((c) => c.id === g.selected) || g.classes[0] || null;
  useEffect(() => setWhatIf(null), [cls && cls.id]);

  const updateClass = (patch) => setG((x) => ({ ...x, classes: x.classes.map((c) => (c.id === cls.id ? { ...c, ...patch } : c)) }));
  const addClass = (c) => setG((x) => ({ ...x, classes: [...x.classes, c], selected: c.id }));
  const removeClass = () => setG((x) => {
    const rest = x.classes.filter((c) => c.id !== cls.id);
    return { ...x, classes: rest, selected: rest[0] ? rest[0].id : null };
  });

  const s = cls ? gradeSummary(cls) : null;
  const weightSum = cls ? cls.categories.reduce((a, c) => a + (Number(c.weight) || 0), 0) : 0;
  const sorted = s ? s.scale.slice().sort((a, b) => b[1] - a[1]) : [];
  const wi = whatIf ?? Math.round(clamp(s && s.current != null ? s.current : 80, 0, 100));
  const projected = s ? s.banked + (s.pending * wi) / 100 : 0;
  // Best letter still reachable, for when the target is gone
  const bestLeft = s ? sorted.find(([l]) => s.need[l] <= 100) : null;
  const exams = cls ? (cram.exams || []).filter((e) => classForExam([cls], e.name)) : [];

  const setCooked = (examId, cooked) => setCram((c) => ({ ...c, exams: c.exams.map((e) => (e.id === examId ? { ...e, cooked } : e)) }));
  const addCramExam = () => {
    setCram((c) => ({ ...c, exams: [...(c.exams || []), { id: newId(), name: `${cls.name.trim()} exam`, when: "", length: 90, cooked: s.cooked, days: null, color: (c.exams || []).length % COLORS.length }] }));
    location.href = "cram.html";
  };

  let headline = null;
  if (s) {
    const n = s.targetNeed;
    headline = s.pending < 0.01
      ? <>Everything's graded. You finished with <b>{pct(s.banked, 1)}</b>.</>
      : n <= 0 ? <>The {cls.target} is <b>locked</b>. Even zeros won't drop you below it.</>
      : n > 100 ? <>You'd need <b>{pct(n)}</b> on everything left. A {cls.target} is off the table.</>
      : <>You need <b>{pct(n)}</b> on everything left to get a {cls.target}.</>;
  }
  const compare = s && s.current != null && s.targetNeed > 0 && s.targetNeed <= 100 && s.pending >= 0.01
    ? (s.targetNeed > s.current
      ? `That's ${(s.targetNeed - s.current).toFixed(1)} points above your ${pct(s.current, 1)} average so far, on the ${pct(s.pending)} of the grade that's left.`
      : `Your average so far is ${pct(s.current, 1)}, so you have ${(s.current - s.targetNeed).toFixed(1)} points of slack on the ${pct(s.pending)} that's left.`)
    : s && s.current == null ? `Nothing graded yet. ${pct(s.pending)} of the grade is still up for grabs.` : null;

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <h1>Grade <span>Check</span></h1>
          <p>What do you actually need on the rest of the semester? Sometimes the answer is "lock in."</p>
        </div>
        <nav className="nav">
          <a className="back" href="cram.html">Cram mode</a>
          <a className="back" href="index.html">← Back to calendar</a>
        </nav>
      </header>

      <div className="layout">
        <aside className="stack">
          <div className="card" id="f-grades">
            <h2>Your classes</h2>
            <p className="sub">Add your graded work from the syllabus. Leave a score blank for anything not graded yet.</p>
            <div className="tabs">
              {g.classes.map((c) => {
                const cs = gradeSummary(c);
                return (
                  <button key={c.id} type="button" className="tab" aria-pressed={cls && c.id === cls.id}
                    onClick={() => setG((x) => ({ ...x, selected: c.id }))}>
                    {cs && <span className="pip" style={{ background: TONE[cs.cooked - 1] }} />}
                    {c.name || "Untitled"}
                  </button>
                );
              })}
              <button type="button" className="tab" onClick={() => addClass(newClass())}>+ Class</button>
            </div>
            {g.classes.length === 0 && (
              <div className="stack" style={{ gap: 8, marginTop: 14 }}>
                <p className="empty">No classes yet.</p>
                <button className="linkbtn" type="button" onClick={() => addClass(exampleClass())}>Load an example (it's not looking great)</button>
              </div>
            )}
          </div>

          {cls && (
            <div className="card">
              <div className="stack" style={{ gap: 12 }}>
                <div className="row">
                  <label className="field">Class
                    <input type="text" value={cls.name} placeholder="e.g. MA 261" onChange={(e) => updateClass({ name: e.target.value })} />
                  </label>
                  <label className="field">Aiming for
                    <select value={cls.target} onChange={(e) => updateClass({ target: e.target.value })}>
                      {sorted.map(([l, cut]) => <option key={l} value={l}>{l} ({cut}%+)</option>)}
                    </select>
                  </label>
                </div>
                <button className="linkbtn" type="button" onClick={() => setShowScale((v) => !v)}>{showScale ? "Hide grade cutoffs" : "Edit grade cutoffs"}</button>
                {showScale && (
                  <div className="ladder">
                    {cls.scale.map(([l, cut], i) => (
                      <label key={i} className="field">{l} at
                        <input type="number" min="0" max="100" value={cut}
                          onChange={(e) => updateClass({ scale: cls.scale.map((x, j) => (j === i ? [x[0], numOrBlank(e.target.value)] : x)) })} />
                      </label>
                    ))}
                  </div>
                )}
                {cls.categories.map((c) => (
                  <CategoryEditor key={c.id} c={c}
                    onChange={(next) => updateClass({ categories: cls.categories.map((x) => (x.id === c.id ? next : x)) })}
                    onRemove={() => updateClass({ categories: cls.categories.filter((x) => x.id !== c.id) })} />
                ))}
                <button className="btn ghost" type="button" onClick={() => updateClass({ categories: [...cls.categories, cat("", 10)] })}>+ Add category</button>
                <p className={"note" + (Math.abs(weightSum - 100) > 0.01 ? " warn" : "")}>
                  Weights add up to {weightSum}%{Math.abs(weightSum - 100) > 0.01 ? ". They'll be treated as proportions, but double-check the syllabus." : "."}
                </p>
                <button className="linkbtn" type="button" onClick={removeClass}>Delete this class</button>
              </div>
            </div>
          )}
        </aside>

        <section className="stack">
          {!cls || !s ? (
            <div className="card"><p className="empty">{cls ? "Give at least one category a weight." : "Add a class to see where you stand."}</p></div>
          ) : (
            <>
              <div className={`card verdict c${s.cooked}`}>
                <div className="v-label">
                  {cls.name || "This class"} · {s.current != null ? `${pct(s.current, 1)} so far (${letterFor(s.current, s.scale)})` : "nothing graded yet"}
                </div>
                <p className="v-head">{headline}</p>
                {compare && <p className="v-sub">{compare}</p>}
                {s.targetNeed > 100 && bestLeft && (
                  <p className="v-sub">Best still possible: a <b>{bestLeft[0]}</b>, which needs {pct(Math.max(0, s.need[bestLeft[0]]))} on the rest.</p>
                )}
                {s.pending >= 0.01 && (
                  <p className="v-call">
                    {s.verdict}
                    <span className="cooked-dots" aria-label={`Cooked level ${s.cooked} of 5`}>
                      {[1, 2, 3, 4, 5].map((i) => <i key={i} className={i <= s.cooked ? "on" : ""} />)}
                    </span>
                    <span className="mono" style={{ fontWeight: 500, fontSize: 12, marginLeft: 6 }}>{s.cooked}/5 · {COOKED_LABELS[s.cooked - 1]}</span>
                  </p>
                )}
                <Meter s={s} />
              </div>

              {s.pending >= 0.01 && (
                <div className="card">
                  <h2>What each grade takes</h2>
                  <p className="sub">Average you need on everything that's left. Click one to aim for it.</p>
                  <div className="ladder">
                    {sorted.map(([l]) => {
                      const n = s.need[l];
                      const gone = n > 100, safe = n <= 0;
                      return (
                        <button key={l} type="button" className={"rung" + (gone ? " gone" : safe ? " safe" : "")}
                          aria-pressed={cls.target === l} onClick={() => updateClass({ target: l })}>
                          <div className="l">{l}</div>
                          <div className="n">{safe ? "locked in" : pct(n)}</div>
                          <div className="h">{gone ? "not possible" : safe ? "can't lose it" : n > 90 ? "near perfect" : s.current != null && n > s.current ? "above your pace" : "at your pace"}</div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {s.pending >= 0.01 && (
                <div className="card">
                  <h2>What if</h2>
                  <div className="whatif">
                    <span>If you average <b className="mono">{wi}%</b> on the rest</span>
                    <span className="out">{pct(projected, 1)} · {letterFor(projected, s.scale)}</span>
                    <input type="range" min="0" max="100" value={wi} aria-label="Average on remaining work" onChange={(e) => setWhatIf(Number(e.target.value))} />
                  </div>
                  <p className="note" style={{ marginTop: 8 }}>
                    Range: {pct(s.floor, 1)} if you get zeros, {pct(s.ceiling, 1)} if you ace everything.
                  </p>
                </div>
              )}

              <div className="card">
                <h2>Where the points are</h2>
                <p className="sub">Big striped chunks are where the grade will be decided.</p>
                <div className="stack" style={{ gap: 12 }}>
                  {s.cats.map((c) => (
                    <div key={c.id} className="cat-row">
                      <b>{c.name || "Untitled"}</b>
                      <span className="mono">{pct(c.weight)}</span>
                      <div className="bar">
                        <i style={{ width: `${(c.done / Math.max(c.weight, 0.01)) * 100}%`, background: c.avg == null ? "var(--line-strong)" : TONE[c.avg >= s.targetNeed ? 1 : c.avg >= s.targetNeed - 10 ? 2 : 3] }} />
                        <i style={{ width: `${(c.pending / Math.max(c.weight, 0.01)) * 100}%`, background: "repeating-linear-gradient(135deg, #cfc6b6 0 3px, transparent 3px 6px)" }} />
                      </div>
                      <div className="meta">
                        {c.avg != null ? `${pct(c.avg, 1)} so far` : "nothing graded"}
                        {c.pending > 0.01 ? ` · ${pct(c.pending, 1)} of your final grade still to come` : " · done"}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {s.pending >= 0.01 && (
                <div className="card">
                  <h2>Turn it into a plan</h2>
                  <p className="sub">Cram mode decides how much study time each exam gets from how cooked you are. These numbers say {s.cooked}/5.</p>
                  <div className="cram-tie">
                    {exams.length === 0 ? (
                      <div className="line">
                        <span>No {cls.name || "class"} exam in Cram mode yet.</span>
                        <button className="btn small" type="button" disabled={!cls.name.trim()} onClick={addCramExam}>Add one at {s.cooked}/5 →</button>
                      </div>
                    ) : exams.map((e) => (
                      <div key={e.id} className="line">
                        <span><b>{e.name}</b>: set to {e.cooked}/5 ({COOKED_LABELS[e.cooked - 1]})</span>
                        {e.cooked === s.cooked
                          ? <span className="mono" style={{ color: "var(--sage)" }}>matches ✓</span>
                          : <button className="btn small" type="button" onClick={() => setCooked(e.id, s.cooked)}>Make it {s.cooked}/5</button>}
                      </div>
                    ))}
                    {exams.length > 0 && <a href="cram.html" style={{ color: "var(--ink)", fontWeight: 600 }}>Open Cram mode →</a>}
                  </div>
                </div>
              )}
            </>
          )}
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!-- ENGINE:START: pure estimation engine (plain JS so it can be tested outside the browser) -->
<script>
/**
 * estimate({ guess, energy, distraction, dread }) -> { total, phases }
 *   guess:       optimistic estimate in minutes (> 0)
 *   energy:      1 (running on fumes) .. 5 (fully charged)
 *   distraction: 1 (phone in another room) .. 5 (group chat is popping)
 *   dread:       1 (kind of fun) .. 5 (I'd rather do laundry)
 * Phases are rounded to whole minutes; total is the sum of the rounded phases,
 * so the bars always add up to the headline number.
 */
function estimate({ guess, energy, distraction, dread }) {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Number(v)));
  const g = Number(guess);
  if (!Number.isFinite(g) || g <= 0) throw new Error("guess must be a positive number of minutes");
  const e = clamp(energy, 1, 5), d = clamp(distraction, 1, 5), r = clamp(dread, 1, 5);

  const setup = 5 + r * 3;                        // setup friction
  const fatigue = 1 + (5 - e) * 0.10;             // fatigue multiplier
  const deep = g * fatigue;                       // deep work
  const distractionTax = deep * (d - 1) * 0.08;   // distraction tax
  const buffer = Math.max(5, 0.10 * (setup + deep + distractionTax));

  const phases = [
    { key: "setup", label: "Setup", minutes: Math.round(setup),
      why: `5m to get going + ${r * 3}m of stalling because dread is ${r}/5.` },
    { key: "deep", label: "Deep Work", minutes: Math.round(deep + distractionTax),
      why: `Your ${g}m × ${fatigue.toFixed(1)} for energy ${e}/5 = ${Math.round(deep)}m, plus ${Math.round(distractionTax)}m lost to distraction (${d}/5).`,
      parts: { guess: g, fatigue: Math.round(deep) - g, distraction: Math.round(deep + distractionTax) - Math.round(deep) } },
    { key: "buffer", label: "Buffer", minutes: Math.round(buffer),
      why: "10% slack for wrap-up and surprises (never less than 5m)." },
  ];
  const total = phases.reduce((s, p) => s + p.minutes, 0);
  return { total, phases };
}
/* ---------- Scheduler for flexible (non-fixed) tasks ----------
 * A task is { setup, deep, buffer } minutes (from estimate()). Rules that keep a day reasonable:
 *  - 10 min of breathing room around every fixed event and every placed task
 *  - deep work runs in sessions of at most 50 min, with a 10 min break between sessions
 *  - nothing is placed before `from` (now) or after `to` (wind-down time)
 *  - prefer one contiguous block; if none fits, split across gaps (no deep piece under 25 min)
 */
const SCHED = { breather: 10, maxChunk: 50, breakLen: 10, minChunk: 25 };

function mergeIntervals(list) {
  const sorted = list.filter(([a, b]) => b > a).map(([a, b]) => [a, b]).sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const [a, b] of sorted) {
    const last = out[out.length - 1];
    if (last && a <= last[1]) last[1] = Math.max(last[1], b); else out.push([a, b]);
  }
  return out;
}

/* Free [start, end] gaps inside [from, to], treating each busy interval as padded by `pad` minutes */
function freeGaps(busy, from, to, pad) {
  const merged = mergeIntervals(busy.map(([a, b]) => [a - (pad || 0), b + (pad || 0)]));
  const gaps = [];
  let c = from;
  for (const [a, b] of merged) {
    if (b <= c) continue;
    if (a >= to) break;
    if (a > c) gaps.push([c, Math.min(a, to)]);
    c = Math.max(c, b);
  }
  if (c < to) gaps.push([c, to]);
  return gaps;
}

const splitEven = (total, n) => Array.from({ length: n }, (_, i) => Math.floor(total / n) + (i < total % n ? 1 : 0));

/* Place one task into the free time left by `busy` ([[start, end], ...]). Returns { fits, split, segments }. */
function placeTask(t, busy, from, to, opt) {
  opt = Object.assign({}, SCHED, opt);
  const gaps = freeGaps(busy, from, to, opt.breather);
  const n = Math.max(1, Math.ceil(t.deep / opt.maxChunk));
  const runLen = t.setup + t.deep + (n - 1) * opt.breakLen + t.buffer;

  // 1) First gap that holds the whole padded task in one go.
  const whole = gaps.find(([s, e]) => e - s >= runLen);
  if (whole) {
    const segments = []; let c = whole[0];
    const push = (kind, len) => { segments.push({ kind, start: c, end: c + len }); c += len; };
    push("setup", t.setup);
    splitEven(t.deep, n).forEach((len, i) => { if (i) push("break", opt.breakLen); push("deep", len); });
    push("buffer", t.buffer);
    return { fits: true, split: false, segments };
  }

  // 2) Otherwise split deep work across gaps, earliest first.
  const segments = [];
  let setupDone = false, deepLeft = t.deep;
  for (const [gs, ge] of gaps) {
    let c = gs, lastWasDeep = false;
    const push = (kind, len) => { segments.push({ kind, start: c, end: c + len }); c += len; };
    if (!setupDone) {
      if (ge - c < t.setup + Math.min(opt.minChunk, deepLeft)) continue; // setup only makes sense right before work
      push("setup", t.setup); setupDone = true;
    }
    while (deepLeft > 0) {
      const brk = lastWasDeep ? opt.breakLen : 0;
      const chunk = Math.min(opt.maxChunk, deepLeft, ge - c - brk);
      if (chunk < Math.min(opt.minChunk, deepLeft)) break;
      if (brk) push("break", brk);
      push("deep", chunk); deepLeft -= chunk; lastWasDeep = true;
    }
    if (deepLeft === 0 && ge - c >= t.buffer) {
      push("buffer", t.buffer);
      return { fits: true, split: true, segments };
    }
  }
  return { fits: false, split: false, segments: [] };
}

/* Re-plan every flexible task around fixed events: earliest deadline first, then highest dread
 * (do the thing you're avoiding while you still have energy), then longest. */
function planDay(tasks, fixed, from, to, opt) {
  const order = [...tasks].sort((a, b) =>
    (a.deadline ?? Infinity) - (b.deadline ?? Infinity) || b.dread - a.dread || b.total - a.total);
  const busy = fixed.map((e) => [e.start, e.end]);
  const plan = {};
  for (const t of order) {
    const p = placeTask(t, busy, from, to, opt);
    plan[t.id] = p;
    p.segments.forEach((s) => busy.push([s.start, s.end]));
  }
  return plan;
}

/* Drop-dead start = deadline - total. `late` = minutes the planned finish runs past the deadline. */
function deadlineStatus(t, now) {
  if (t.deadline == null) return null;
  const dropDead = t.deadline - t.total;
  const last = t.fits && t.segments.length ? t.segments[t.segments.length - 1].end : null;
  return { dropDead, passed: now > dropDead, late: last != null && last > t.deadline ? last - t.deadline : 0 };
}

const countSessions = (segs) => segs.reduce((n, s, i) => n + (i === 0 || segs[i - 1].end !== s.start ? 1 : 0), 0);

if (typeof module !== "undefined") module.exports = { estimate, freeGaps, placeTask, planDay, deadlineStatus, countSessions };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------- Config ---------- */
const DAY_START = 9 * 60;    // 9:00 AM, in minutes from midnight
const DAY_END = 23 * 60;     // 11:00 PM
const HOUR_PX = 64;          // height of one hour on the timeline
const PX_PER_MIN = HOUR_PX / 60;
const STORAGE_KEY = "realitycheck.events.v1";

const COLORS = [
  { bg: "#e6eefb", edge: "#4a72c4" }, // blue
  { bg: "#f3e8fb", edge: "#8a5cc4" }, // purple
  { bg: "#fdf0d6", edge: "#c9932b" }, // amber
  { bg: "#e3eee5", edge: "#5d8a6a" }, // sage
  { bg: "#fbe3d9", edge: "#e0603a" }, // coral
];

const SAMPLE_EVENTS = [
  { id: "s1", title: "CS 251 Lecture", start: 10 * 60 + 30, end: 11 * 60 + 45, color: 0 },
  { id: "s2", title: "Lunch with Priya", start: 12 * 60 + 30, end: 13 * 60 + 30, color: 3 },
  { id: "s3", title: "Team standup", start: 15 * 60, end: 15 * 60 + 30, color: 1 },
  { id: "s4", title: "Gym", start: 18 * 60, end: 19 * 60, color: 2 },
];

/* ---------- Time helpers ---------- */
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const toHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
function fmt(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, "0")} ${ampm}`;
}
const fmtDur = (min) => {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
};
const yFor = (min) => (Math.min(Math.max(min, DAY_START), DAY_END) - DAY_START) * PX_PER_MIN;

/* ---------- Storage ---------- */
function useStoredEvents() {
  const [events, setEvents] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return SAMPLE_EVENTS;
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); } catch (e) {}
  }, [events]);
  return [events, setEvents];
}

const TASKS_KEY = "realitycheck.tasks.v1";
const SETTINGS_KEY = "realitycheck.settings.v1";

function useStoredState(key, fallback) {
  const [value, setValue] = useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      if (Array.isArray(fallback)) return Array.isArray(v) ? v : fallback;
      if (v && typeof v === "object") return { ...fallback, ...v };
    } catch (e) {}
    return fallback;
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }, [key, value]);
  return [value, setValue];
}

const timeOr = (hhmm, fallback) => (/^\d{2}:\d{2}$/.test(hhmm || "") ? toMin(hhmm) : fallback);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const KIND_LABEL = { setup: "Setup", deep: "Deep work", break: "Break", buffer: "Buffer" };
const clashWith = (t, events) => events.find((e) => (t.segments || []).some((s) => s.kind !== "break" && overlaps(s, e)));

function useNowMinutes() {
  const get = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const [now, setNow] = useState(get);
  useEffect(() => { const t = setInterval(() => setNow(get()), 30000); return () => clearInterval(t); }, []);
  return now;
}

/* ---------- Layout: put overlapping events side by side ---------- */
function layoutLanes(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = [];
  let cluster = [], lanes = [], clusterEnd = -1;
  const flush = () => {
    cluster.forEach((c) => (c.laneCount = lanes.length));
    out.push(...cluster);
    cluster = []; lanes = []; clusterEnd = -1;
  };
  for (const ev of sorted) {
    if (cluster.length && ev.start >= clusterEnd) flush();
    let lane = lanes.findIndex((end) => end <= ev.start);
    if (lane === -1) { lane = lanes.length; lanes.push(ev.end); } else lanes[lane] = ev.end;
    cluster.push({ ...ev, lane });
    clusterEnd = Math.max(clusterEnd, ev.end);
  }
  if (cluster.length) flush();
  return out;
}

const overlaps = (a, b) => a.start < b.end && b.start < a.end;

/* Minutes inside [from, DAY_END] covered by at least one event */
function bookedMinutes(events, from) {
  const ranges = events
    .map((e) => [Math.max(e.start, from), Math.min(e.end, DAY_END)])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  let total = 0, curS = null, curE = null;
  for (const [s, e] of ranges) {
    if (curE === null || s > curE) { if (curE !== null) total += curE - curS; curS = s; curE = e; }
    else curE = Math.max(curE, e);
  }
  if (curE !== null) total += curE - curS;
  return total;
}

/* ---------- Components ---------- */
function AddEventForm({ onAdd, draftStart }) {
  const [title, setTitle] = useState("");
  const [start, setStart] = useState("14:00");
  const [end, setEnd] = useState("15:00");
  const [color, setColor] = useState(0);
  const [error, setError] = useState("");

  // When the user clicks an empty slot on the timeline, prefill the form
  useEffect(() => {
    if (draftStart == null) return;
    setStart(toHHMM(draftStart.m));
    setEnd(toHHMM(Math.min(draftStart.m + 60, DAY_END)));
    document.getElementById("ev-title")?.focus();
  }, [draftStart]);

  const submit = (e) => {
    e.preventDefault();
    const s = toMin(start), en = toMin(end);
    if (!title.trim()) return setError("Give the event a name.");
    if (en <= s) return setError("End time has to be after the start time.");
    if (en <= DAY_START || s >= DAY_END) return setError("Today's timeline runs 9:00 AM – 11:00 PM.");
    onAdd({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title: title.trim(), start: s, end: en, color });
    setTitle(""); setError("");
  };

  return (
    <form className="card" onSubmit={submit}>
      <h2>Fixed events</h2>
      <p className="sub">Things already on your day — classes, meals, shifts. Tip: click an empty spot on the timeline.</p>
      <div className="stack" style={{ gap: 12 }}>
        <label className="field">What
          <input id="ev-title" type="text" placeholder="e.g. Office hours" value={title} onChange={(e) => setTitle(e.target.value)} />
        </label>
        <div className="row">
          <label className="field">Starts<input type="time" value={start} step="300" onChange={(e) => setStart(e.target.value)} /></label>
          <label className="field">Ends<input type="time" value={end} step="300" onChange={(e) => setEnd(e.target.value)} /></label>
        </div>
        <div className="swatches" role="group" aria-label="Color">
          {COLORS.map((c, i) => (
            <button key={i} type="button" className="swatch" aria-pressed={color === i} aria-label={`Color ${i + 1}`}
              style={{ background: c.edge }} onClick={() => setColor(i)} />
          ))}
        </div>
        {error && <p className="error">{error}</p>}
        <button className="btn" type="submit">Add to today</button>
      </div>
    </form>
  );
}

function Slider({ name, value, onChange, low, high }) {
  return (
    <div className="slider">
      <span className="name">{name}</span>
      <span className="val">{value}/5</span>
      <input type="range" min="1" max="5" step="1" value={value} onChange={(e) => onChange(Number(e.target.value))} aria-label={name} />
      <div className="ends"><span>{low}</span><span>{high}</span></div>
    </div>
  );
}

const PHASE_COLORS = { setup: "#c9932b", deep: "#4a72c4", buffer: "#cfc6b6" };

function RealityResult({ guess, result, onAdd, added }) {
  const max = Math.max(...result.phases.map((p) => p.minutes));
  const extra = result.total - guess;
  return (
    <div className="result" aria-live="polite">
      <p className="headline">
        You said <b>{fmtDur(guess)}</b> → Reality: <b className="reality">{fmtDur(result.total)}</b>
      </p>
      <p className="extra">
        {extra > 0 ? `+${fmtDur(extra)} you weren't counting (${Math.round((result.total / guess - 1) * 100)}% more).` : "Your guess holds up."}
      </p>
      <div className="phase-stack" aria-hidden="true">
        {result.phases.map((p) => <div key={p.key} style={{ flex: p.minutes, background: PHASE_COLORS[p.key] }} />)}
      </div>
      {result.phases.map((p) => (
        <div className="phase-row" key={p.key}>
          <div className="top"><span>{p.label}</span><span className="mono">{fmtDur(p.minutes)}</span></div>
          <div className="bar">
            {p.parts ? (
              <>
                <i style={{ width: `${(p.parts.guess / max) * 100}%`, background: PHASE_COLORS.deep }} title="Your guess" />
                <i style={{ width: `${(p.parts.fatigue / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.6 }} title="Fatigue" />
                <i style={{ width: `${(p.parts.distraction / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.35 }} title="Distraction tax" />
              </>
            ) : (
              <i style={{ width: `${(p.minutes / max) * 100}%`, background: PHASE_COLORS[p.key] }} />
            )}
          </div>
          <p>{p.why}</p>
        </div>
      ))}
      <button className="btn" type="button" style={{ width: "100%" }} disabled={!!added} onClick={onAdd}>
        Add the real {fmtDur(result.total)} to today's calendar
      </button>
      {added && <p className={"added" + (added.fits ? "" : " warn")}>{added.text}</p>}
    </div>
  );
}

function TaskEstimator({ onAdd }) {
  const [task, setTask] = useState({ name: "", guess: 60, energy: 3, distraction: 3, dread: 3, deadline: "" });
  const [checked, setChecked] = useState(false);
  const [added, setAdded] = useState(null);
  useEffect(() => setAdded(null), [task]); // editing the task clears the "added" note
  const set = (k) => (v) => setTask((t) => ({ ...t, [k]: v }));
  const guessOk = Number.isFinite(task.guess) && task.guess > 0 && task.guess <= 24 * 60;
  // After the first check the card stays live: moving a slider updates the estimate.
  const result = useMemo(() => (checked && guessOk ? estimate(task) : null),
    [checked, guessOk, task.guess, task.energy, task.distraction, task.dread]);
  return (
    <div className="card">
      <h2>Reality check a task</h2>
      <p className="sub">Your guess, then the honest version.</p>
      <div className="stack" style={{ gap: 14 }}>
        <label className="field">Task
          <input type="text" placeholder="e.g. Finish stats problem set" value={task.name} onChange={(e) => set("name")(e.target.value)} />
        </label>
        <div className="row">
          <label className="field">Your guess (min)
            <input type="number" min="5" step="5" value={task.guess} onChange={(e) => set("guess")(Number(e.target.value))} />
          </label>
          <label className="field">Deadline (optional)
            <input type="time" value={task.deadline} onChange={(e) => set("deadline")(e.target.value)} />
          </label>
        </div>
        <Slider name="Current energy" value={task.energy} onChange={set("energy")} low="running on fumes" high="fully charged" />
        <Slider name="Distraction level" value={task.distraction} onChange={set("distraction")} low="phone in another room" high="group chat is popping" />
        <Slider name="Task dread / friction" value={task.dread} onChange={set("dread")} low="kind of fun" high="I'd rather do laundry" />
        {!guessOk && <p className="error">Enter a guess between 1 and 1440 minutes.</p>}
        <button className="btn" type="button" disabled={!guessOk} onClick={() => setChecked(true)}>
          How long will this actually take? →
        </button>
        {result && <RealityResult guess={task.guess} result={result} added={added} onAdd={() => {
          const [setup, deep, buffer] = result.phases.map((p) => p.minutes);
          const t = onAdd({
            title: task.name.trim() || "Untitled task", guess: task.guess, energy: task.energy,
            distraction: task.distraction, dread: task.dread, deadline: timeOr(task.deadline, null),
            total: result.total, setup, deep, buffer,
          });
          const n = countSessions(t.segments);
          setAdded(t.fits
            ? { fits: true, text: `Added: ${fmt(t.segments[0].start)} – ${fmt(t.segments[t.segments.length - 1].end)}${n > 1 ? ` across ${n} sessions` : ""}.` }
            : { fits: false, text: "Doesn't fit before wind-down today. It's listed under Flexible tasks." });
        }} />}
      </div>
    </div>
  );
}

function TaskList({ tasks, events, now, settings, onSettings, onOptimize, onRemove }) {
  const unfit = tasks.filter((t) => !t.fits);
  const clashing = tasks.filter((t) => t.fits && clashWith(t, events));
  return (
    <div className="card">
      <h2>Flexible tasks</h2>
      <p className="sub">Reality-checked tasks the planner can move around your fixed events.</p>
      <div className="stack" style={{ gap: 12 }}>
        {tasks.length === 0 && <p className="empty">Nothing yet. Run a reality check, then add it to today's calendar.</p>}
        {unfit.length > 0 && (
          <p className="banner">Today is full: push {unfit.map((t) => t.title).join(", ")} to tomorrow, or move wind-down later.</p>
        )}
        {clashing.length > 0 && (
          <p className="banner">A fixed event now clashes with {clashing.map((t) => t.title).join(", ")}. Optimize to re-plan.</p>
        )}
        {tasks.length > 0 && (
          <ul className="task-list">
            {tasks.map((t) => {
              const st = deadlineStatus(t, now);
              const n = countSessions(t.segments || []);
              return (
                <li key={t.id} className={"task-item" + (t.fits ? "" : " unfit")}>
                  <div className="top">
                    <b>{t.title}</b><span className="mono">{fmtDur(t.total)}</span>
                    <button className="x" aria-label={`Remove ${t.title}`} onClick={() => onRemove(t.id)}>×</button>
                  </div>
                  <div className="meta">
                    {t.fits
                      ? `${fmt(t.segments[0].start)} – ${fmt(t.segments[t.segments.length - 1].end)}${n > 1 ? ` · ${n} sessions` : ""}`
                      : "Doesn't fit today"}
                    {` · you guessed ${fmtDur(t.guess)}`}
                  </div>
                  {st && (
                    <div className={"meta" + (st.passed || st.late ? " warn" : "")}>
                      Due {fmt(t.deadline)} · {st.passed ? `drop-dead start (${fmt(st.dropDead)}) has passed` : `start by ${fmt(st.dropDead)}`}
                      {st.late ? ` · finishes ${fmtDur(st.late)} late` : ""}
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
        )}
        <div className="row">
          <label className="field">Wind down at
            <input type="time" value={settings.windDown} onChange={(e) => onSettings({ windDown: e.target.value })} />
          </label>
          <label className="field">Plan from
            <input type="time" value={settings.planFrom} onChange={(e) => onSettings({ planFrom: e.target.value })} />
          </label>
        </div>
        {settings.planFrom
          ? <button className="linkbtn" type="button" onClick={() => onSettings({ planFrom: "" })}>Plan from now instead</button>
          : <p className="note" style={{ margin: 0 }}>Leave "Plan from" empty to plan from right now.</p>}
        <button className="btn" type="button" disabled={tasks.length === 0} onClick={onOptimize}>Optimize my day</button>
        <p className="note" style={{ margin: 0 }}>
          Earliest deadline first, then the task you're dreading most. 10 min of breathing room around everything,
          deep work in sessions of 50 min or less with 10 min breaks, nothing after wind-down.
        </p>
      </div>
    </div>
  );
}

function DayStats({ events, tasks, now }) {
  const from = Math.min(Math.max(now, DAY_START), DAY_END);
  const left = DAY_END - from;
  // Planned task time counts as booked; breaks between sessions are still yours.
  const taskBlocks = tasks.flatMap((t) => (t.segments || []).filter((s) => s.kind !== "break"));
  const booked = bookedMinutes([...events, ...taskBlocks], from);
  const free = Math.max(left - booked, 0);
  return (
    <div className="card">
      <div className="stats">
        <div className="stat"><b>{events.length}</b><span>events today</span></div>
        <div className="stat"><b>{fmtDur(booked)}</b><span>booked from now</span></div>
        <div className="stat life"><b>{fmtDur(free)}</b><span>still yours</span></div>
      </div>
    </div>
  );
}

function Timeline({ events, tasks, windDown, now, onDelete, onPickSlot }) {
  const height = (DAY_END - DAY_START) * PX_PER_MIN;
  const laid = useMemo(() => layoutLanes(events), [events]);
  const conflicts = useMemo(() => {
    const ids = new Set();
    events.forEach((a, i) => events.slice(i + 1).forEach((b) => { if (overlaps(a, b)) { ids.add(a.id); ids.add(b.id); } }));
    return ids;
  }, [events]);

  const hours = [];
  for (let m = DAY_START; m <= DAY_END; m += 30) hours.push(m);
  const slots = [];
  for (let m = DAY_START; m < DAY_END; m += 30) slots.push(m);

  const nowVisible = now >= DAY_START && now <= DAY_END;

  return (
    <div className="timeline" style={{ height }}>
      {now > DAY_START && <div className="past-shade" style={{ height: yFor(now) }} />}

      {slots.map((m) => (
        <div key={"slot" + m} className="slot-hit" style={{ top: yFor(m), height: 30 * PX_PER_MIN }}
          onClick={() => onPickSlot(m)} title={`Add an event at ${fmt(m)}`} />
      ))}

      {hours.map((m) => (
        <div key={m} className={"hour" + (m % 60 ? " half" : "")} style={{ top: yFor(m) }}>
          {m % 60 === 0 && <span className="hour-label">{fmt(m).replace(":00", "")}</span>}
        </div>
      ))}

      {events.length === 0 && <div className="empty-hint">Your day is wide open. Add a fixed event, or click a time slot.</div>}

      {laid.map((ev) => {
        const top = yFor(ev.start), bottom = yFor(ev.end);
        if (bottom - top <= 0) return null;
        const c = COLORS[ev.color] || COLORS[0];
        const widthPct = 100 / ev.laneCount;
        const short = bottom - top < 40;
        return (
          <div key={ev.id} className={"event" + (conflicts.has(ev.id) ? " conflict" : "")}
            style={{
              top: top + 1, height: bottom - top - 2,
              left: `calc(${widthPct * ev.lane}% + 2px)`, width: `calc(${widthPct}% - 4px)`,
              background: c.bg, borderLeftColor: c.edge,
            }}>
            <div className="t">
              {ev.title}
              {conflicts.has(ev.id) && <span className="conflict-badge">overlap</span>}
            </div>
            {!short && <div className="time">{fmt(ev.start)} – {fmt(ev.end)}</div>}
            <button className="del" aria-label={`Delete ${ev.title}`} onClick={() => onDelete(ev.id)}>×</button>
          </div>
        );
      })}

      {windDown < DAY_END && (
        <div className="winddown" style={{ top: yFor(windDown) }}><span>wind-down · no tasks</span></div>
      )}

      {tasks.filter((t) => t.fits).flatMap((t) => t.segments.map((s, i) => {
        const top = yFor(s.start), h = yFor(s.end) - top;
        if (h <= 0) return null;
        const sessionStart = i === 0 || t.segments[i - 1].end !== s.start;
        const clash = s.kind !== "break" && events.some((e) => overlaps(s, e));
        return (
          <div key={t.id + ":" + i} className={`tseg ${s.kind}` + (clash ? " conflict" : "")}
            style={{ top: top + 1, height: Math.max(h - 2, 3) }}
            title={`${t.title} · ${KIND_LABEL[s.kind]} · ${fmt(s.start)} – ${fmt(s.end)}`}>
            {h >= 14 && (
              <span className="tseg-label">
                {sessionStart && <b>{t.title} · </b>}
                {KIND_LABEL[s.kind]}{h >= 24 ? ` ${fmtDur(s.end - s.start)}` : ""}
              </span>
            )}
          </div>
        );
      }))}

      {tasks.map((t) => {
        const st = deadlineStatus(t, now);
        if (!st || st.dropDead < DAY_START || st.dropDead > DAY_END) return null;
        return (
          <div key={"dd" + t.id} className="deadline-line" style={{ top: yFor(st.dropDead) }}>
            <span>{st.passed ? "passed: " : ""}start {t.title} by {fmt(st.dropDead)}</span>
          </div>
        );
      })}

      {nowVisible && (
        <div className="now-line" style={{ top: yFor(now) }}><span>now · {fmt(now)}</span></div>
      )}
    </div>
  );
}

function App() {
  const [events, setEvents] = useStoredEvents();
  const [draftStart, setDraftStart] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const [tasks, setTasks] = useStoredState(TASKS_KEY, []);
  const [settings, setSettings] = useStoredState(SETTINGS_KEY, { windDown: "21:00", planFrom: "" });
  const now = useNowMinutes();

  const windDown = Math.min(timeOr(settings.windDown, 21 * 60), DAY_END);
  const planFrom = Math.max(DAY_START, timeOr(settings.planFrom, Math.ceil(now / 5) * 5));
  const updateSettings = (patch) => setSettings((s) => ({ ...s, ...patch }));

  // Place one new task in the time left over, without moving anything already planned.
  const addTask = (spec) => {
    const busy = [
      ...events.map((e) => [e.start, e.end]),
      ...tasks.flatMap((t) => (t.segments || []).map((s) => [s.start, s.end])),
    ];
    const t = { ...spec, id: newId(), ...placeTask(spec, busy, planFrom, windDown) };
    setTasks((ts) => [...ts, t]);
    return t;
  };
  // Re-plan every flexible task from scratch around the fixed events.
  const optimize = () => {
    const plan = planDay(tasks, events, planFrom, windDown);
    setTasks((ts) => ts.map((t) => (plan[t.id] ? { ...t, ...plan[t.id] } : t)));
  };

  const today = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  useEffect(() => {
    if (!confirmClear) return;
    const t = setTimeout(() => setConfirmClear(false), 3000);
    return () => clearTimeout(t);
  }, [confirmClear]);

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <h1>Reality<span>Check</span></h1>
          <p>How long will this <em>actually</em> take me — and what's left of my day?</p>
        </div>
        <div className="date-pill">{today}</div>
      </header>

      <div className="layout">
        <aside className="stack">
          <DayStats events={events} tasks={tasks} now={now} />
          <AddEventForm onAdd={(ev) => setEvents((es) => [...es, ev])} draftStart={draftStart} />
          <TaskEstimator onAdd={addTask} />
          <TaskList tasks={tasks} events={events} now={now} settings={settings} onSettings={updateSettings}
            onOptimize={optimize} onRemove={(id) => setTasks((ts) => ts.filter((t) => t.id !== id))} />
        </aside>

        <section className="card tl-card">
          <div className="tl-head">
            <h2 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 19 }}>Today</h2>
            <div className="legend">
              <span><i style={{ background: COLORS[0].edge }} />fixed event</span>
              <span><i style={{ background: "repeating-linear-gradient(135deg, #4a72c4 0 2px, #e6eefb 2px 4px)" }} />planned task</span>
              <span><i style={{ background: "var(--accent)" }} />now</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn ghost small" onClick={() => setEvents(SAMPLE_EVENTS)}>Load sample day</button>
              <button className="btn ghost small" onClick={() => (confirmClear ? (setEvents([]), setTasks([]), setConfirmClear(false)) : setConfirmClear(true))}>
                {confirmClear ? "Click again to clear" : "Clear all"}
              </button>
            </div>
          </div>
          <div className="tl-scroll">
            <Timeline events={events} tasks={tasks} windDown={windDown} now={now}
              onDelete={(id) => setEvents((es) => es.filter((e) => e.id !== id))}
              onPickSlot={(m) => setDraftStart({ m, at: Date.now() /* new object so clicking the same slot re-fills */ })} />
          </div>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RealityCheck — How long will this actually take me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --paper: #f6f2ea;
    --card: #fffdf8;
    --ink: #1f1d1a;
    --muted: #6f6a61;
    --line: #e4ddd0;
    --line-strong: #cfc6b6;
    --accent: #e0603a;      /* warnings / now line */
    --accent-soft: #fbe3d9;
    --sage: #5d8a6a;        /* free time / "your life" */
    --sage-soft: #e3eee5;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "DM Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: "DM Mono", ui-monospace, monospace; }

  .app { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; margin: 0; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .date-pill { font-family: "DM Mono", monospace; font-size: 13px; background: var(--card); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }

  .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card h2 { font-family: "Fraunces", serif; font-size: 19px; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .tag { font-family: "DM Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }

  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
  input[type=text], input[type=time], input[type=number], input[type=date], input[type=datetime-local] {
    background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0;
  }
  input:focus-visible, button:focus-visible, [role=button]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }

  .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .error { color: var(--accent); font-size: 13px; margin: 0; }

  .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .slider .name { font-size: 13px; font-weight: 500; }
  .slider .val { font-family: "DM Mono", monospace; font-size: 13px; background: var(--paper); border-radius: 6px; padding: 1px 7px; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
  .slider .ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -2px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-family: "Fraunces", serif; font-size: 22px; font-weight: 500; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.life { background: var(--sage-soft); }
  .stat.life b { color: var(--sage); }
  .stats-day { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 500; }

  /* Calendar header */
  .tl-card { padding: 0; overflow: hidden; }
  .tl-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .cal-nav, .cal-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cal-title { font-family: "Fraunces", serif; font-size: 19px; font-weight: 500; margin: 0 4px; }
  .icon-btn { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 8px; }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  .seg-ctrl { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .seg-ctrl button { border: none; background: transparent; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .seg-ctrl button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .zoom { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .zoom input[type=range] { width: 90px; accent-color: var(--ink); }
  .jump { width: auto !important; padding: 5px 8px !important; font-size: 13px !important; }
  .tl-sub { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 18px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* Time grid (day + week) */
  .tl-scroll { position: relative; max-height: 74vh; overflow: auto; }
  .tl-scroll.expanded { max-height: none; }
  .day-heads { position: sticky; top: 0; z-index: 8; display: grid; background: var(--card); border-bottom: 1px solid var(--line); }
  .day-head { border: none; border-left: 1px solid var(--line); background: none; padding: 6px 4px 8px; text-align: center; cursor: pointer; font-size: 12px; color: var(--muted); }
  .day-head:hover { background: var(--paper); }
  .day-head b { display: block; margin: 2px auto 0; width: 32px; height: 32px; line-height: 32px; border-radius: 999px; font-family: "Fraunces", serif; font-size: 18px; font-weight: 500; color: var(--ink); }
  .day-head.today { color: var(--accent); font-weight: 600; }
  .day-head.today b { background: var(--accent); color: #fff; }
  .grid-body { display: grid; margin: 12px 0 16px; }
  .gutter { position: relative; }
  .hour-label { position: absolute; left: 0; width: 56px; top: -8px; text-align: right; font-family: "DM Mono", monospace; font-size: 12px; color: var(--muted); }
  .col { position: relative; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: copy;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(#f1ece2 1px, transparent 1px); }
  .col.today { background-color: #fffaf3; }

  .event { position: absolute; border-radius: 10px; padding: 6px 10px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); border-left-width: 4px; cursor: default; transition: box-shadow .15s; z-index: 2; }
  .event:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); z-index: 5; }
  .event .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event .time { font-family: "DM Mono", monospace; font-size: 11.5px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact .event { padding: 3px 6px; border-radius: 7px; border-left-width: 3px; }
  .compact .event .t { font-size: 12.5px; }
  .compact .event .time { font-size: 10.5px; }
  .event .del { position: absolute; top: 4px; right: 4px; border: none; background: rgba(255,255,255,.85); border-radius: 6px; width: 22px; height: 22px; cursor: pointer; opacity: 0; font-size: 14px; line-height: 1; }
  .event:hover .del, .event .del:focus-visible { opacity: 1; }
  .event.conflict { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .event.exam { border: 2px solid var(--accent); border-left-width: 5px; box-shadow: 0 2px 10px rgba(224, 96, 58, .18); }
  .exam-badge { display: inline-block; font-family: "DM Mono", monospace; font-size: 9.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    background: var(--accent); color: #fff; border-radius: 4px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }
  .chip.exam { font-weight: 600; outline: 1.5px solid var(--accent); }
  .conflict-badge { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 5px; margin-left: 4px; }

  .now-line { position: absolute; left: -4px; right: 0; height: 0; border-top: 2px solid var(--accent); z-index: 6; pointer-events: none; }
  .now-line::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .now-line span { position: absolute; right: 0; top: -20px; font-family: "DM Mono", monospace; font-size: 11px; color: var(--accent); background: var(--card); padding: 0 4px; white-space: nowrap; }
  .past-shade { position: absolute; left: 0; right: 0; top: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(31,29,26,.035) 6px 12px); pointer-events: none; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .empty-hint { position: absolute; left: 0; right: 0; top: 40px; text-align: center; color: var(--muted); font-size: 14px; pointer-events: none; padding: 0 8px; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  /* Reality check result */
  .result { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 2px; }
  .result .headline { font-size: 15px; margin: 0; }
  .result .headline b { font-family: "Fraunces", serif; font-weight: 700; font-size: 24px; }
  .result .headline .reality { color: var(--accent); }
  .result .extra { font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
  .phase-stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin-bottom: 14px; }
  .phase-row { margin-bottom: 12px; }
  .phase-row .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .phase-row .top .mono { font-weight: 500; }
  .phase-row .bar { height: 8px; border-radius: 4px; margin: 5px 0 4px; background: var(--paper); overflow: hidden; display: flex; }
  .phase-row .bar i { display: block; height: 100%; }
  .phase-row p { margin: 0; font-size: 12px; color: var(--muted); }
  .added { font-size: 13px; margin: 8px 0 0; color: var(--sage); font-weight: 500; }
  .added.warn { color: var(--accent); }

  /* Flexible tasks */
  .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task-item { background: var(--paper); border-radius: 10px; padding: 9px 11px; border-left: 4px solid #4a72c4; }
  .task-item.unfit { border-left-color: var(--accent); }
  .task-item.done { opacity: .6; }
  .task-item .top { display: flex; gap: 8px; align-items: baseline; }
  .task-item .ti-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; text-align: left; border: none; background: none; padding: 0; cursor: pointer; }
  .task-item .ti-title:hover { text-decoration: underline; }
  .task-item .meta { font-size: 12px; color: var(--muted); }
  .task-item .meta.warn { color: var(--accent); font-weight: 500; }
  .x { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 2px; }
  .banner { background: var(--accent-soft); color: #8a3a22; border-radius: 10px; padding: 9px 11px; font-size: 13px; margin: 0; }
  .linkbtn { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; align-self: flex-start; }
  .empty { font-size: 13px; color: var(--muted); margin: 0; }

  /* Planned task blocks: striped + dashed so they read as movable */
  .tseg { position: absolute; left: 2px; right: 2px; border-radius: 8px; border: 1.5px dashed; padding: 1px 8px; overflow: hidden; font-size: 11.5px; z-index: 3; }
  .compact .tseg { padding: 0 5px; border-radius: 6px; font-size: 11px; }
  .tseg.setup  { border-color: #c9932b; background: repeating-linear-gradient(135deg, #fdf0d6 0 6px, #fffaf0 6px 12px); }
  .tseg.deep   { border-color: #4a72c4; background: repeating-linear-gradient(135deg, #e6eefb 0 6px, #f4f7fd 6px 12px); }
  .tseg.break  { border-color: #5d8a6a; border-style: dotted; background: #f2f7f3; color: var(--sage); }
  .tseg.buffer { border-color: #a79e8d; background: repeating-linear-gradient(135deg, #efebe3 0 6px, #f8f5ef 6px 12px); }
  .tseg.conflict { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tseg-label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
  .deadline-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--accent); z-index: 4; pointer-events: none; }
  .deadline-line span { position: absolute; left: 4px; right: 4px; top: -18px; font-family: "DM Mono", monospace; font-size: 11px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deadline-line span b { font-weight: 500; background: var(--card); padding: 0 4px; }
  .winddown { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--sage); pointer-events: none;
    background: repeating-linear-gradient(45deg, transparent 0 8px, rgba(93,138,106,.08) 8px 16px); }
  .winddown span { position: absolute; right: 6px; top: 4px; font-family: "DM Mono", monospace; font-size: 11px; color: var(--sage); white-space: nowrap; }

  /* Month */
  .month { padding: 12px 14px 16px; overflow-x: auto; }
  .month-inner { min-width: 560px; }
  .month-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 6px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(104px, auto); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .mcell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mcell:hover { background: #fbf8f2; }
  .mcell.other { background: #faf7f1; color: var(--muted); }
  .mcell .num { font-size: 12px; font-weight: 600; align-self: flex-start; padding: 1px 7px; border-radius: 999px; }
  .mcell.today .num { background: var(--accent); color: #fff; }
  .chip { font-size: 11.5px; border-radius: 5px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; }
  .chip.task { border: 1px dashed #4a72c4; background: #f4f7fd; }
  .chip .mono { font-size: 10.5px; opacity: .7; margin-right: 4px; }
  .more { font-size: 11px; color: var(--muted); padding-left: 4px; }
  /* Pomodoro */
  .pomo { --pomo: var(--accent); display: flex; flex-direction: column; gap: 12px; }
  .pomo.short { --pomo: var(--sage); }
  .pomo.long { --pomo: #4a72c4; }
  .pomo h2 { margin: 0; }
  .pomo-modes { align-self: flex-start; }
  .pomo-body { position: relative; width: 168px; height: 168px; align-self: center; }
  .pomo-ring { width: 100%; height: 100%; }
  .pomo-ring circle { fill: none; stroke-width: 8; }
  .pomo-ring .track { stroke: var(--paper); }
  .pomo-ring .fill { stroke: var(--pomo); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .pomo-time { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; }
  .pomo-dots { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .pomo-dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--pomo); }
  .pomo-dots i.on { background: var(--pomo); }
  .pomo-dots span { margin-left: 6px; }
  .pomo-actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .pomo-actions .btn:first-child { background: var(--pomo); border-color: var(--pomo); }
  .pomo-now { margin: 0; font-size: 13px; background: var(--paper); border-radius: 10px; padding: 8px 11px; }
  .pomo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pomo-settings { gap: 10px; }
  .pomo-settings .btn[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); z-index: 50;
    background: var(--ink); color: #fff; border-radius: 12px; padding: 11px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
    box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .toast > div { flex: 1; }
  .toast .x { color: #fff; opacity: .7; }
  .toast .warn { color: #ffb59c; }
  .toast a { color: #fff; font-weight: 600; }
  .toast-btn { border: 1px solid #fff; background: #fff; color: var(--ink); border-radius: 8px; padding: 3px 10px; font-weight: 600; cursor: pointer; font-size: 13px; margin-left: 4px; }
  /* Calendar expand */
  .expand-bar { display: block; width: 100%; border: none; border-top: 1px solid var(--line); background: var(--paper); color: var(--muted);
    padding: 7px; font-size: 12.5px; cursor: pointer; }
  .expand-bar:hover { color: var(--ink); background: #efe9de; }

  /* To-do */
  .todo-card { display: flex; flex-direction: column; gap: 10px; }
  .todo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .todo-head h2 { margin: 0; }
  .todo-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ai-btn { background: #4b3fa8; border-color: #4b3fa8; }
  .quick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .parse-preview { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
  .parse-preview b { color: var(--ink); font-weight: 600; }
  .chip-cls { font-family: "DM Mono", monospace; font-size: 10.5px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: 6px; color: var(--muted); font-weight: 500; vertical-align: 1px; }
  .todo-groups { display: flex; flex-direction: column; gap: 12px; }
  .todo-groups h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .todo-groups h3.warn { color: var(--accent); }
  .todo-groups h3 span { font-family: "DM Mono", monospace; font-weight: 400; margin-left: 4px; }
  .todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; background: var(--paper); border-radius: 10px; padding: 8px 10px; }
  .todo input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--sage); margin: 0; }
  .todo.done .todo-title { text-decoration: line-through; color: var(--muted); }
  .todo-title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .todo-meta { font-size: 12px; color: var(--muted); display: block; }
  .todo-meta .warn, .warn { color: var(--accent); }
  .mins input { width: 52px; padding: 1px 4px; font-size: 12px; border-radius: 6px; margin: 0 2px; }
  .linkbtn.inline { font-size: 12px; color: var(--ink); }
  .ai-panel { background: #f1effb; border: 1px solid #ddd8f3; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .ai-panel textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; font: inherit; resize: vertical; background: #fff; }
  .ai-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ai-row input { flex: 1; min-width: 160px; padding: 6px 9px; font-size: 14px; }
  .ai-msg { margin: 0; font-style: italic; }
  .dump-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  .cram-note a { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Shared estimation + scheduling + cram engine (also used by cram.html) -->
<script src="engine.js"></script>
<!-- Optional Claude features for the to-do list (loads the SDK only when used) -->
<script src="ai.js"></script>
<!-- Feature rail: jump to / highlight any feature -->
<script src="rail.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useMemo, useRef } = React;

/* ---------- Config (DAY_START, DAY_END, COLORS, storage keys + date/time helpers live in engine.js) ---------- */
const ZOOM_MIN = 32, ZOOM_MAX = 200, ZOOM_DEFAULT = 64;  // pixels per hour
const SAMPLE_DAY = [
  { title: "CS 251 Lecture", start: 10 * 60 + 30, end: 11 * 60 + 45, color: 0 },
  { title: "Lunch with Priya", start: 12 * 60 + 30, end: 13 * 60 + 30, color: 3 },
  { title: "Team standup", start: 15 * 60, end: 15 * 60 + 30, color: 1 },
  { title: "Gym", start: 18 * 60, end: 19 * 60, color: 2 },
];

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
// Cram study blocks use their exam's color instead of the default task blue.
const studyStyle = (s) => {
  if (s.color == null || s.kind === "break") return null;
  const c = COLORS[s.color] || COLORS[0];
  return { borderColor: c.edge, background: `repeating-linear-gradient(135deg, ${c.bg} 0 6px, #fffdf8 6px 12px)` };
};
const KIND_LABEL = { setup: "Setup", deep: "Deep work", break: "Break", buffer: "Buffer" };

/* ---------- Storage ---------- */
function useStoredState(key, fallback, migrate) {
  const [value, setValue] = useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      if (Array.isArray(fallback)) { if (Array.isArray(v)) return migrate ? migrate(v) : v; }
      else if (v && typeof v === "object") return { ...fallback, ...v };
    } catch (e) {}
    return fallback;
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }, [key, value]);
  // Another tab (e.g. Cram mode) changed it: pick up the new value.
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== key || e.newValue == null) return;
      try { const v = JSON.parse(e.newValue); setValue(Array.isArray(fallback) ? (migrate ? migrate(v) : v) : { ...fallback, ...v }); } catch (err) {}
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [key]);
  return [value, setValue];
}

const sampleFor = (date) => SAMPLE_DAY.map((e) => ({ ...e, id: newId(), date }));

function useNow() {
  const get = () => { const d = new Date(); return { today: dateKey(d), min: d.getHours() * 60 + d.getMinutes() }; };
  const [now, setNow] = useState(get);
  useEffect(() => { const t = setInterval(() => setNow(get()), 30000); return () => clearInterval(t); }, []);
  return now;
}

/* ---------- Layout: put overlapping events side by side ---------- */
function layoutLanes(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = [];
  let cluster = [], lanes = [], clusterEnd = -1;
  const flush = () => {
    cluster.forEach((c) => (c.laneCount = lanes.length));
    out.push(...cluster);
    cluster = []; lanes = []; clusterEnd = -1;
  };
  for (const ev of sorted) {
    if (cluster.length && ev.start >= clusterEnd) flush();
    let lane = lanes.findIndex((end) => end <= ev.start);
    if (lane === -1) { lane = lanes.length; lanes.push(ev.end); } else lanes[lane] = ev.end;
    cluster.push({ ...ev, lane });
    clusterEnd = Math.max(clusterEnd, ev.end);
  }
  if (cluster.length) flush();
  return out;
}

const clashWith = (t, absEvents) => absEvents.find((e) => (t.segments || []).some((s) => s.kind !== "break" && overlaps(s, e)));

/* Minutes inside [from, DAY_END] covered by at least one event */
function bookedMinutes(events, from) {
  const ranges = events
    .map((e) => [Math.max(e.start, from), Math.min(e.end, DAY_END)])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  let total = 0, curS = null, curE = null;
  for (const [s, e] of ranges) {
    if (curE === null || s > curE) { if (curE !== null) total += curE - curS; curS = s; curE = e; }
    else curE = Math.max(curE, e);
  }
  if (curE !== null) total += curE - curS;
  return total;
}

/* Task segments that fall on a given day, in that day's local minutes */
function segmentsOnDay(tasks, n) {
  const out = [];
  tasks.forEach((t) => {
    if (!t.fits) return;
    t.segments.forEach((s, i) => {
      if (dayOfAbs(s.start) !== n) return;
      out.push({ ...s, ls: s.start - n * DAY_MIN, le: s.end - n * DAY_MIN, taskId: t.id, title: t.title, i, color: t.study ? t.color : null,
        sessionStart: i === 0 || t.segments[i - 1].end !== s.start });
    });
  });
  return out;
}

/* ---------- Components ---------- */
function AddEventForm({ onAdd, draft, defaultDate }) {
  const [title, setTitle] = useState("");
  const [date, setDate] = useState(defaultDate);
  const [start, setStart] = useState("14:00");
  const [end, setEnd] = useState("15:00");
  const [color, setColor] = useState(0);
  const [error, setError] = useState("");

  useEffect(() => setDate(defaultDate), [defaultDate]);
  // When the user clicks an empty spot on the calendar, prefill the form
  useEffect(() => {
    if (draft == null) return;
    setDate(draft.date);
    setStart(toHHMM(draft.m));
    setEnd(toHHMM(Math.min(draft.m + 60, DAY_END)));
    document.getElementById("ev-title")?.focus();
  }, [draft]);

  const submit = (e) => {
    e.preventDefault();
    const s = toMin(start), en = toMin(end);
    if (!title.trim()) return setError("Give the event a name.");
    if (!isDateKey(date)) return setError("Pick a date.");
    if (en <= s) return setError("End time has to be after the start time.");
    if (en <= DAY_START || s >= DAY_END) return setError("The calendar runs 9:00 AM – 11:00 PM.");
    onAdd({ id: newId(), title: title.trim(), date, start: s, end: en, color });
    setTitle(""); setError("");
  };

  return (
    <form className="card" id="f-event" onSubmit={submit}>
      <h2>Fixed events</h2>
      <p className="sub">Things already on your calendar: classes, meals, shifts. Any day, as far ahead as you like. Tip: click an empty spot on the calendar.</p>
      <div className="stack" style={{ gap: 12 }}>
        <label className="field">What
          <input id="ev-title" type="text" placeholder="e.g. Office hours" value={title} onChange={(e) => setTitle(e.target.value)} />
        </label>
        <label className="field">Date
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>
        <div className="row">
          <label className="field">Starts<input type="time" value={start} step="300" onChange={(e) => setStart(e.target.value)} /></label>
          <label className="field">Ends<input type="time" value={end} step="300" onChange={(e) => setEnd(e.target.value)} /></label>
        </div>
        <div className="swatches" role="group" aria-label="Color">
          {COLORS.map((c, i) => (
            <button key={i} type="button" className="swatch" aria-pressed={color === i} aria-label={`Color ${i + 1}`}
              style={{ background: c.edge }} onClick={() => setColor(i)} />
          ))}
        </div>
        {error && <p className="error">{error}</p>}
        <button className="btn" type="submit">Add to calendar</button>
      </div>
    </form>
  );
}

function Slider({ name, value, onChange, low, high }) {
  return (
    <div className="slider">
      <span className="name">{name}</span>
      <span className="val">{value}/5</span>
      <input type="range" min="1" max="5" step="1" value={value} onChange={(e) => onChange(Number(e.target.value))} aria-label={name} />
      <div className="ends"><span>{low}</span><span>{high}</span></div>
    </div>
  );
}

const PHASE_COLORS = { setup: "#c9932b", deep: "#4a72c4", buffer: "#cfc6b6" };

function RealityResult({ guess, result, onAdd, added }) {
  const max = Math.max(...result.phases.map((p) => p.minutes));
  const extra = result.total - guess;
  return (
    <div className="result" aria-live="polite">
      <p className="headline">
        You said <b>{fmtDur(guess)}</b> → Reality: <b className="reality">{fmtDur(result.total)}</b>
      </p>
      <p className="extra">
        {extra > 0 ? `+${fmtDur(extra)} you weren't counting (${Math.round((result.total / guess - 1) * 100)}% more).` : "Your guess holds up."}
      </p>
      <div className="phase-stack" aria-hidden="true">
        {result.phases.map((p) => <div key={p.key} style={{ flex: p.minutes, background: PHASE_COLORS[p.key] }} />)}
      </div>
      {result.phases.map((p) => (
        <div className="phase-row" key={p.key}>
          <div className="top"><span>{p.label}</span><span className="mono">{fmtDur(p.minutes)}</span></div>
          <div className="bar">
            {p.parts ? (
              <>
                <i style={{ width: `${(p.parts.guess / max) * 100}%`, background: PHASE_COLORS.deep }} title="Your guess" />
                <i style={{ width: `${(p.parts.fatigue / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.6 }} title="Fatigue" />
                <i style={{ width: `${(p.parts.distraction / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.35 }} title="Distraction tax" />
              </>
            ) : (
              <i style={{ width: `${(p.minutes / max) * 100}%`, background: PHASE_COLORS[p.key] }} />
            )}
          </div>
          <p>{p.why}</p>
        </div>
      ))}
      <button className="btn" type="button" style={{ width: "100%" }} disabled={!!added} onClick={onAdd}>
        Add the real {fmtDur(result.total)} to my calendar
      </button>
      {added && <p className={"added" + (added.fits ? "" : " warn")}>{added.text}</p>}
    </div>
  );
}

function TaskEstimator({ onAdd, todayN, lookahead }) {
  const [task, setTask] = useState({ name: "", guess: 60, energy: 3, distraction: 3, dread: 3, deadline: "" });
  const [checked, setChecked] = useState(false);
  const [added, setAdded] = useState(null);
  useEffect(() => setAdded(null), [task]); // editing the task clears the "added" note
  const set = (k) => (v) => setTask((t) => ({ ...t, [k]: v }));
  const guessOk = Number.isFinite(task.guess) && task.guess > 0 && task.guess <= 24 * 60;
  // After the first check the card stays live: moving a slider updates the estimate.
  const result = useMemo(() => (checked && guessOk ? estimate(task) : null),
    [checked, guessOk, task.guess, task.energy, task.distraction, task.dread]);

  const add = () => {
    const [setup, deep, buffer] = result.phases.map((p) => p.minutes);
    const t = onAdd({
      title: task.name.trim() || "Untitled task", guess: task.guess, energy: task.energy,
      distraction: task.distraction, dread: task.dread, deadline: absFromLocal(task.deadline),
      total: result.total, setup, deep, buffer,
    });
    const n = countSessions(t.segments);
    setAdded(t.fits
      ? { fits: true, text: `Added: ${fmtWhen(t.segments[0].start, todayN)} – ${fmtWhen(t.segments[t.segments.length - 1].end, todayN)}${n > 1 ? ` across ${n} sessions` : ""}.` }
      : { fits: false, text: `No room in the next ${lookahead} days. It's listed under Flexible tasks.` });
  };

  return (
    <div className="card" id="f-check">
      <h2>Reality check a task</h2>
      <p className="sub">Your guess, then the honest version.</p>
      <div className="stack" style={{ gap: 14 }}>
        <label className="field">Task
          <input type="text" placeholder="e.g. Finish stats problem set" value={task.name} onChange={(e) => set("name")(e.target.value)} />
        </label>
        <label className="field">Your guess (min)
          <input type="number" min="5" step="5" value={task.guess} onChange={(e) => set("guess")(Number(e.target.value))} />
        </label>
        <label className="field">Deadline (optional, any day)
          <input type="datetime-local" value={task.deadline} onChange={(e) => set("deadline")(e.target.value)} />
        </label>
        <Slider name="Current energy" value={task.energy} onChange={set("energy")} low="running on fumes" high="fully charged" />
        <Slider name="Distraction level" value={task.distraction} onChange={set("distraction")} low="phone in another room" high="group chat is popping" />
        <Slider name="Task dread / friction" value={task.dread} onChange={set("dread")} low="kind of fun" high="I'd rather do laundry" />
        {!guessOk && <p className="error">Enter a guess between 1 and 1440 minutes.</p>}
        <button className="btn" type="button" disabled={!guessOk} onClick={() => setChecked(true)}>
          How long will this actually take? →
        </button>
        {result && <RealityResult guess={task.guess} result={result} added={added} onAdd={add} />}
      </div>
    </div>
  );
}

function TaskList({ tasks: allTasks, cram, absEvents, nowAbs, todayN, settings, onSettings, onOptimize, onRemove, onJump }) {
  const tasks = allTasks.filter((t) => !t.study);
  const study = allTasks.filter((t) => t.study);
  const unfit = tasks.filter((t) => !t.fits);
  const clashing = tasks.filter((t) => t.fits && clashWith(t, absEvents));
  return (
    <div className="card" id="f-tasks">
      <h2>Flexible tasks</h2>
      <p className="sub">Reality-checked tasks the planner can move around your fixed events, across days.</p>
      <div className="stack" style={{ gap: 12 }}>
        {cram.active && (
          <p className="cram-note">
            <b>Cram mode is on.</b> {study.filter((t) => t.fits).length} study sessions for {(cram.exams || []).length} exams
            {cram.effort < 1 ? `, homework trimmed to ${Math.round(cram.effort * 100)}%` : ""}
            {study.some((t) => !t.fits) ? `, ${study.filter((t) => !t.fits).length} sessions didn't fit` : ""}. <a href="cram.html">Adjust in Cram mode →</a>
          </p>
        )}
        {tasks.length === 0 && <p className="empty">Nothing yet. Run a reality check, then add it to your calendar.</p>}
        {unfit.length > 0 && (
          <p className="banner">No room in the next {settings.lookahead} days for {unfit.map((t) => t.title).join(", ")}. Look further ahead, raise the daily max, or move wind-down later.</p>
        )}
        {clashing.length > 0 && (
          <p className="banner">A fixed event now clashes with {clashing.map((t) => t.title).join(", ")}. Optimize to re-plan.</p>
        )}
        {tasks.length > 0 && (
          <ul className="task-list">
            {tasks.map((t) => {
              const st = deadlineStatus(t, nowAbs);
              const segs = t.segments || [];
              const n = countSessions(segs);
              const done = t.fits && segs[segs.length - 1].end <= nowAbs;
              return (
                <li key={t.id} className={"task-item" + (t.fits ? "" : " unfit") + (done ? " done" : "")}>
                  <div className="top">
                    <button type="button" className="ti-title" disabled={!t.fits} title={t.fits ? "Show on calendar" : undefined}
                      onClick={() => onJump(keyOf(dayOfAbs(segs[0].start)))}>{t.title}</button>
                    <span className="mono">{fmtDur(t.total)}</span>
                    <button className="x" aria-label={`Remove ${t.title}`} onClick={() => onRemove(t.id)}>×</button>
                  </div>
                  <div className="meta">
                    {t.fits
                      ? `${done ? "Done · " : ""}${fmtWhen(segs[0].start, todayN)} – ${fmtWhen(segs[segs.length - 1].end, todayN)}${n > 1 ? ` · ${n} sessions` : ""}`
                      : "Doesn't fit yet"}
                    {` · you guessed ${fmtDur(t.guess)}`}
                  </div>
                  {st && !done && (
                    <div className={"meta" + (st.passed || st.late ? " warn" : "")}>
                      Due {fmtWhen(t.deadline, todayN)} · {st.passed ? `drop-dead start (${fmtWhen(st.dropDead, todayN)}) has passed` : `start by ${fmtWhen(st.dropDead, todayN)}`}
                      {st.late ? ` · finishes ${fmtDur(st.late)} late` : ""}
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
        )}
        <div className="row">
          <label className="field">Wind down at
            <input type="time" value={settings.windDown} onChange={(e) => onSettings({ windDown: e.target.value })} />
          </label>
          <label className="field">Max task time / day (h)
            <input type="number" min="0" max="14" step="0.5" value={settings.dailyCapH}
              onChange={(e) => onSettings({ dailyCapH: e.target.value === "" ? "" : Number(e.target.value) })} />
          </label>
        </div>
        <div className="row">
          <label className="field">Look ahead (days)
            <input type="number" min="1" max="60" value={settings.lookahead}
              onChange={(e) => onSettings({ lookahead: e.target.value === "" ? "" : Number(e.target.value) })} />
          </label>
          <label className="field">Plan from
            <input type="datetime-local" value={settings.planFrom} onChange={(e) => onSettings({ planFrom: e.target.value })} />
          </label>
        </div>
        {settings.planFrom
          ? <button className="linkbtn" type="button" onClick={() => onSettings({ planFrom: "" })}>Plan from now instead</button>
          : <p className="note" style={{ margin: 0 }}>Leave "Plan from" empty to plan from right now. Max 0 = no daily limit.</p>}
        <button className="btn" type="button" disabled={allTasks.length === 0 && !cram.active} onClick={onOptimize}>Optimize my schedule</button>
        <p className="note" style={{ margin: 0 }}>
          Earliest deadline first, then the task you're dreading most. 10 min of breathing room around everything,
          deep work in sessions of 50 min or less with 10 min breaks, a daily cap on task time, nothing after wind-down.
          Finished tasks stay put.
        </p>
      </div>
    </div>
  );
}

/* ---------- "Right now" tunnel vision ---------- */
// Now as fractional absolute minutes, for a countdown that ticks every second
const preciseNow = () => { const d = new Date(); return dayNum(dateKey(d)) * DAY_MIN + d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const clock = (min) => {
  const s = Math.max(0, Math.ceil(min * 60)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}:${pad2(m)}:${pad2(r)}` : `${pad2(m)}:${pad2(r)}`;
};
const PHASE = { setup: "Getting set up", deep: "Deep work", break: "Break", buffer: "Wrapping up" };

/* Everything on the calendar as blocks: each task's back-to-back segments (breaks included) form one session. */
function timelineBlocks(tasks, events) {
  const out = [];
  tasks.filter((t) => t.fits && t.segments.length).forEach((t) => {
    let cur = null;
    t.segments.forEach((s) => {
      if (cur && cur.end === s.start) { cur.end = s.end; cur.segs.push(s); }
      else { cur = { kind: "task", task: t, title: t.title, start: s.start, end: s.end, segs: [s] }; out.push(cur); }
    });
  });
  events.forEach((e) => { const a = eventAbs(e); out.push({ kind: "event", title: e.title, start: a.start, end: a.end, exam: !!e.cramExamId }); });
  return out.sort((a, b) => a.start - b.start);
}

function RightNow({ tasks, events, windDown, todayN, onDone, onExit }) {
  const [now, setNow] = useState(preciseNow);
  useEffect(() => { const t = setInterval(() => setNow(preciseNow()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onExit(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onExit]);

  const blocks = timelineBlocks(tasks, events);
  // A fixed event beats a task block if they overlap: you're physically somewhere.
  const live = blocks.filter((b) => b.start <= now && now < b.end);
  const cur = live.find((b) => b.kind === "event") || live[0] || null;
  const next = blocks.find((b) => b !== cur && b.start >= (cur ? cur.end : now) - 0.001 && !(cur && b.kind === "task" && cur.kind === "task" && b.task.id === cur.task.id && b.start === cur.end));
  const nextAny = next || blocks.find((b) => b.start > now);
  const seg = cur && cur.kind === "task" ? cur.segs.find((s) => s.start <= now && now < s.end) : null;
  const pastWindDown = now - todayN * DAY_MIN >= windDown;

  // What the big countdown counts to, and what fraction of it has gone by
  let label, title, sub, until, from;
  if (cur && cur.kind === "task") {
    const work = cur.segs.filter((s) => s.kind === "deep"), idx = work.findIndex((s) => s === seg);
    label = seg.kind === "break" ? "Break" : PHASE[seg.kind] + (seg.kind === "deep" && work.length > 1 ? ` · ${idx + 1} of ${work.length}` : "");
    title = cur.title;
    until = seg.end; from = seg.start;
    sub = seg.kind === "break" ? `Back to it at ${fmt(Math.round(seg.end) % DAY_MIN)}` : `${PHASE[seg.kind]} until ${fmt(seg.end % DAY_MIN)}${cur.end > seg.end ? ` · this session ends ${fmt(cur.end % DAY_MIN)}` : ""}`;
  } else if (cur) {
    label = cur.exam ? "Exam" : "Fixed event"; title = cur.title; until = cur.end; from = cur.start;
    sub = `Until ${fmt(cur.end % DAY_MIN)}. Be here, not on your phone.`;
  } else if (nextAny && dayOfAbs(nextAny.start) === todayN && !pastWindDown) {
    label = "Free right now"; title = "Nothing scheduled"; until = nextAny.start; from = Math.max(now - 1, ...blocks.filter((b) => b.end <= now).map((b) => b.end));
    sub = `Rest, or get a head start. ${nextAny.title} starts at ${fmt(nextAny.start % DAY_MIN)}.`;
  } else {
    label = "Done for today"; title = pastWindDown ? "Wind down" : "Nothing else today"; until = null;
    sub = nextAny ? `First thing next: ${nextAny.title}, ${fmtWhen(nextAny.start, todayN)}.` : "Nothing planned. Enjoy it.";
  }
  const frac = until != null && until > from ? clamp((now - from) / (until - from), 0, 1) : 0;
  const t = cur && cur.kind === "task" ? cur.task : null;
  const doneMin = t ? t.segments.filter((s) => s.kind !== "break").reduce((x, s) => x + clamp(Math.min(s.end, now) - s.start, 0, s.end - s.start), 0) : 0;
  const workMin = t ? t.segments.filter((s) => s.kind !== "break").reduce((x, s) => x + s.end - s.start, 0) : 0;
  const R = 92, C = 2 * Math.PI * R;
  const tone = cur ? (cur.kind === "event" ? (cur.exam ? "exam" : "event") : seg.kind === "break" ? "rest" : "work") : "rest";

  return (
    <div className={`rightnow ${tone}`} id="f-now">
      <div className="rn-top">
        <span className="rn-label">{label}</span>
        <button className="btn ghost small" type="button" onClick={onExit} title="Back to the full calendar (Esc)">Show everything</button>
      </div>
      <h2 className="rn-title">{title}</h2>
      {until != null && (
        <div className="rn-clock">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r={R} className="track" />
            <circle cx="100" cy="100" r={R} className="fill" strokeDasharray={C} strokeDashoffset={C * frac} transform="rotate(-90 100 100)" />
          </svg>
          <div className="rn-time mono" role="timer" aria-label={`${clock(until - now)} left`}>{clock(until - now)}</div>
        </div>
      )}
      <p className="rn-sub">{sub}</p>
      {t && (
        <div className="rn-progress">
          <div className="track"><i style={{ width: `${workMin ? (doneMin / workMin) * 100 : 0}%` }} /></div>
          <span>{fmtDur(Math.round(doneMin))} of {fmtDur(workMin)} done{t.deadline != null ? ` · due ${fmtWhen(t.deadline, todayN)}` : ""}</span>
        </div>
      )}
      {t && <button className="btn rn-done" type="button" onClick={() => onDone(t)}>I'm done with this</button>}
      {next && (dayOfAbs(next.start) === todayN || !cur) && (
        <div className="rn-next">
          <span className="rn-label">Up next</span>
          <div><b>{next.exam && <span className="exam-badge">Exam</span>}{next.title}</b></div>
          <div className="rn-when">{fmtWhen(next.start, todayN)} · in {fmtDur(Math.max(1, Math.round(next.start - now)))}</div>
        </div>
      )}
    </div>
  );
}

/* ---------- Pomodoro ---------- */
const POMO_KEY = "realitycheck.pomodoro.v1";
const POMO_DEFAULT = { focusMin: 25, shortMin: 5, longMin: 15, longEvery: 4, mode: "focus", running: false, endsAt: null, leftMs: null,
  streak: 0, log: {}, sound: true, autoStart: false };
const POMO_PRESETS = [
  { label: "Classic 25 / 5", focusMin: 25, shortMin: 5, longMin: 15 },
  { label: "Planner 50 / 10", focusMin: 50, shortMin: 10, longMin: 20 }, // same rhythm the scheduler uses
];
const POMO_LABEL = { focus: "Focus", short: "Short break", long: "Long break" };
const pomoLen = (p, mode) => clamp(Number(mode === "focus" ? p.focusMin : mode === "short" ? p.shortMin : p.longMin) || 1, 1, 180) * 60000;
const mmss = (ms) => { const s = Math.ceil(ms / 1000); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; };

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 990].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.22;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.45);
    });
    setTimeout(() => ctx.close(), 1500);
  } catch (e) {}
}

/* Finish the current phase. A finished focus counts toward today and toward the long break. */
function pomoAdvance(p, { counted }) {
  let next = { ...p };
  if (p.mode === "focus") {
    if (counted) {
      const today = dateKey(new Date()), prev = p.log[today] || { n: 0, min: 0 };
      next.streak = p.streak + 1;
      next.log = { [today]: { n: prev.n + 1, min: prev.min + Math.round(pomoLen(p, "focus") / 60000) } }; // only today matters
      next.mode = next.streak % Math.max(1, Number(p.longEvery) || 4) === 0 ? "long" : "short";
    } else next.mode = "short";
  } else next.mode = "focus";
  const len = pomoLen(next, next.mode);
  return p.autoStart ? { ...next, running: true, endsAt: Date.now() + len, leftMs: null } : { ...next, running: false, endsAt: null, leftMs: null };
}

function Pomodoro({ tasks, nowAbs }) {
  const [p, setP] = useStoredState(POMO_KEY, POMO_DEFAULT);
  const [, tick] = useState(0);
  const [open, setOpen] = useState(false);
  const len = pomoLen(p, p.mode);
  const left = p.running ? Math.max(0, p.endsAt - Date.now()) : p.leftMs != null ? Math.min(p.leftMs, len) : len;
  const set = (patch) => setP((q) => ({ ...q, ...patch }));

  useEffect(() => {
    if (!p.running) return;
    const endsAt = p.endsAt;
    const id = setInterval(() => {
      if (Date.now() < endsAt) return tick((x) => x + 1);
      clearInterval(id);
      const fresh = Date.now() - endsAt < 5000; // don't chime for a timer that ran out while the page was closed
      if (fresh && p.sound) chime();
      if (fresh && "Notification" in window && Notification.permission === "granted") {
        try { new Notification(p.mode === "focus" ? "Focus done. Take a break." : "Break's over. Back to it.", { silent: true }); } catch (e) {}
      }
      setP((q) => (q.running && q.endsAt === endsAt ? pomoAdvance(q, { counted: true }) : q));
    }, 250);
    return () => clearInterval(id);
  }, [p.running, p.endsAt]);

  // Countdown in the tab title, so you can see it from another tab.
  const baseTitle = useRef(document.title);
  useEffect(() => {
    document.title = p.running ? `${mmss(left)} · ${POMO_LABEL[p.mode]} — RealityCheck` : baseTitle.current;
  });
  useEffect(() => () => { document.title = baseTitle.current; }, []);

  const start = () => {
    if ("Notification" in window && Notification.permission === "default") { try { Notification.requestPermission(); } catch (e) {} }
    set({ running: true, endsAt: Date.now() + left, leftMs: null });
  };
  const pause = () => set({ running: false, endsAt: null, leftMs: left });
  const reset = () => set({ running: false, endsAt: null, leftMs: null });
  const switchTo = (mode) => set({ mode, running: false, endsAt: null, leftMs: null });
  const skip = () => setP((q) => pomoAdvance(q, { counted: false }));

  const todayLog = p.log[dateKey(new Date())] || { n: 0, min: 0 };
  const every = Math.max(1, Number(p.longEvery) || 4);
  const doneInCycle = p.streak % every;
  // What the calendar says you should be doing right now (or next, today)
  const segs = tasks.filter((t) => t.fits).flatMap((t) => t.segments.map((s) => ({ ...s, title: t.title })));
  const cur = segs.find((s) => s.kind !== "break" && s.start <= nowAbs && nowAbs < s.end);
  const next = !cur && segs.filter((s) => s.kind !== "break" && s.start > nowAbs && dayOfAbs(s.start) === dayOfAbs(nowAbs))
    .sort((a, b) => a.start - b.start)[0];

  const R = 54, C = 2 * Math.PI * R, frac = 1 - left / len;
  return (
    <div className={"card pomo " + p.mode} id="f-pomo">
      <h2>Pomodoro <span className="tag">{POMO_LABEL[p.mode]}</span></h2>
      <div className="seg-ctrl pomo-modes" role="group" aria-label="Timer mode">
        {Object.keys(POMO_LABEL).map((m) => (
          <button key={m} type="button" aria-pressed={p.mode === m} onClick={() => switchTo(m)}>{POMO_LABEL[m]}</button>
        ))}
      </div>
      <div className="pomo-body">
        <svg className="pomo-ring" viewBox="0 0 128 128" aria-hidden="true">
          <circle cx="64" cy="64" r={R} className="track" />
          <circle cx="64" cy="64" r={R} className="fill" strokeDasharray={C} strokeDashoffset={C * (1 - frac)} transform="rotate(-90 64 64)" />
        </svg>
        <div className="pomo-time mono" role="timer" aria-label={`${POMO_LABEL[p.mode]}, ${mmss(left)} left`}>{mmss(left)}</div>
      </div>
      <div className="pomo-dots" aria-label={`${doneInCycle} of ${every} focus sessions before a long break`}>
        {Array.from({ length: every }, (_, i) => <i key={i} className={i < doneInCycle ? "on" : ""} />)}
        <span>{todayLog.n ? `${todayLog.n} done today · ${fmtDur(todayLog.min)}` : "none done today yet"}</span>
      </div>
      <div className="pomo-actions">
        {p.running
          ? <button className="btn" type="button" onClick={pause}>Pause</button>
          : <button className="btn" type="button" onClick={start}>{left < len ? "Resume" : "Start"}</button>}
        <button className="btn ghost" type="button" onClick={reset} disabled={left === len && !p.running}>Reset</button>
        <button className="btn ghost" type="button" onClick={skip} title={p.mode === "focus" ? "Skip to a break (won't count)" : "Skip the break"}>Skip</button>
      </div>
      {(cur || next) && (
        <p className="pomo-now">
          {cur ? <>On your calendar now: <b>{cur.title}</b> · {KIND_LABEL[cur.kind].toLowerCase()} until {fmt(cur.end - dayOfAbs(cur.end) * DAY_MIN)}</>
            : <>Next up: <b>{next.title}</b> at {fmt(next.start - dayOfAbs(next.start) * DAY_MIN)}</>}
        </p>
      )}
      <button className="linkbtn" type="button" aria-expanded={open} onClick={() => setOpen((o) => !o)}>{open ? "Hide settings" : "Timer settings"}</button>
      {open && (
        <div className="stack pomo-settings">
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {POMO_PRESETS.map((pr) => (
              <button key={pr.label} type="button" className="btn ghost small"
                aria-pressed={p.focusMin === pr.focusMin && p.shortMin === pr.shortMin && p.longMin === pr.longMin}
                onClick={() => set({ focusMin: pr.focusMin, shortMin: pr.shortMin, longMin: pr.longMin, leftMs: p.running ? p.leftMs : null })}>{pr.label}</button>
            ))}
          </div>
          <div className="pomo-grid">
            {[["focusMin", "Focus"], ["shortMin", "Short break"], ["longMin", "Long break"], ["longEvery", "Long break every"]].map(([k, label]) => (
              <label key={k} className="field">{label}{k === "longEvery" ? "" : " (min)"}
                <input type="number" min="1" max={k === "longEvery" ? 12 : 180} value={p[k]}
                  onChange={(e) => set({ [k]: e.target.value === "" ? "" : Number(e.target.value), ...(p.running ? {} : { leftMs: null }) })} />
              </label>
            ))}
          </div>
          <label className="check"><input type="checkbox" checked={!!p.sound} onChange={(e) => set({ sound: e.target.checked })} /> Chime when time's up</label>
          <label className="check"><input type="checkbox" checked={!!p.autoStart} onChange={(e) => set({ autoStart: e.target.checked })} /> Start the next one automatically</label>
        </div>
      )}
    </div>
  );
}

/* ---------- To-dos ---------- */
// Live calendar task for a to-do, if it still exists
const taskFor = (td, tasks) => (td.taskId ? tasks.find((t) => t.id === td.taskId) : null);
// A to-do becomes a reality-checked task (average energy/distraction, its own dread) the scheduler can place.
function todoSpec(td) {
  const guess = Number(td.minutes) > 0 ? Number(td.minutes) : 30;
  const r = estimate({ guess, energy: 3, distraction: 3, dread: td.dread || 3 });
  const [setup, deep, buffer] = r.phases.map((p) => p.minutes);
  return { title: td.title, guess, energy: 3, distraction: 3, dread: td.dread || 3, deadline: td.due ?? null,
    total: r.total, setup, deep, buffer, todoId: td.id };
}
function dueGroup(td, nowAbs, todayN) {
  if (td.done) return "done";
  if (td.due == null) return "someday";
  if (td.due < nowAbs) return "overdue";
  const d = dayOfAbs(td.due);
  return d === todayN ? "today" : d === todayN + 1 ? "tomorrow" : d < todayN + 7 ? "week" : "later";
}
const GROUPS = [["overdue", "Overdue"], ["today", "Today"], ["tomorrow", "Tomorrow"], ["week", "This week"], ["later", "Later"], ["someday", "No deadline"]];
const KIND_TAG = { todo: "to-do", study: "study → Cram mode", exam: "exam → Cram mode", event: "event → calendar" };

function AiKeyPanel({ ai, setAi, onClose }) {

      </p>
      {ai.apiKey ? (

          <button className="btn small" type="button" onClick={onClose}>Done</button>

function TodoPanel({ todos, setTodos, tasks, nowAbs, todayN, onSchedule, onUnschedule, onJump, onImport, onSetCooked, onApplyCram, cram, snapshot }) {
  const [ai, setAi] = useStoredState(AI_STORE_KEY, { apiKey: "" });
  const [text, setText] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [dumpOpen, setDumpOpen] = useState(false);
  const [dump, setDump] = useState("");
  const [dumpRes, setDumpRes] = useState(null);   // { items: [{...item, pick}], message }
  const [sugg, setSugg] = useState(null);         // { summary, suggestions: [{..., used}] }
  const [busy, setBusy] = useState("");           // "dump" | "suggest"
  const [error, setError] = useState("");
  const [showDone, setShowDone] = useState(false);
  const [planStudy, setPlanStudy] = useState(true);

  // The feature rail can ask for the brain dump panel to open.
  useEffect(() => {
    const onOpen = (e) => { if (e.detail === "dump") setDumpOpen(true); };
    window.addEventListener("rc:open", onOpen);
    return () => window.removeEventListener("rc:open", onOpen);
  }, []);
  const parsed = text.trim() ? parseQuickTodo(text, nowAbs) : null;
  const addTodo = (td) => ({ id: newId(), done: false, taskId: null, dread: 3, cls: "", minutes: null, due: null, note: "", ...td });
  const quickAdd = (e) => {
    e.preventDefault();
    if (!parsed) return;
    setTodos((ts) => [...ts, addTodo({ title: parsed.title, due: parsed.due, minutes: parsed.minutes, cls: parsed.cls })]);
    setText("");
  };
  // An exam typed into quick add (or sitting in the list) goes to Cram mode, which plans the studying for it.
  const isQuiz = (t) => /\bquiz/i.test(t);
  const asExam = (title, cls, due, hasTime) => ({ kind: "exam", title, class_name: cls || "",
    when: localFromAbs(hasTime ? due : dayOfAbs(due) * DAY_MIN + 10 * 60), minutes: isQuiz(title) ? 30 : 90, cooked: 3 });
  const quickExam = () => {
    onImport([asExam(parsed.examName, parsed.cls, parsed.due, parsed.hasTime)], { planStudy: true });
    setText("");
  };
  const todoToCram = (td) => {
    const hasTime = (td.due - dayOfAbs(td.due) * DAY_MIN) !== 23 * 60 + 59;
    const name = td.title.replace(/^(?:study(?:ing)?|review(?:ing)?|prep(?:are)?|cram(?:ming)?)\s+(?:for\s+)?(?:the\s+|my\s+)?/i, "").trim() || td.title;
    onImport([asExam(name, td.cls, td.due, hasTime)], { planStudy: true, removeTodoId: td.id });
  };
  const update = (id, patch) => setTodos((ts) => ts.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  const dropTask = (td) => { const t = taskFor(td, tasks); if (t && (!t.fits || t.segments[0].start > nowAbs)) onUnschedule(t.id); };
  const toggle = (td) => { if (!td.done) dropTask(td); update(td.id, { done: !td.done }); };
  const remove = (td) => { dropTask(td); setTodos((ts) => ts.filter((t) => t.id !== td.id)); };
  const unplanned = todos.filter((td) => !td.done && !taskFor(td, tasks));
  const planAll = () => onSchedule(unplanned);

  const needKey = () => { if (ai.apiKey) return false; setShowKey(true); return true; };
  const runDump = async () => {
    if (needKey() || !dump.trim()) return;
    setBusy("dump"); setError("");
    try {
      const r = await aiBrainDump(ai.apiKey, dump, nowAbs, { exams: (cram.exams || []).map((e) => ({ name: e.name, when: e.when })) });
      setDumpRes({ message: r.message, items: r.items.map((it) => ({ ...it, pick: true })) });
    } catch (err) { setError(err.message); }
    setBusy("");
  };
  const addPicked = () => {
    onImport(dumpRes.items.filter((it) => it.pick), { planStudy });
    setDumpRes(null); setDump(""); setDumpOpen(false);
  };
  const runSuggest = async () => {
    if (needKey()) return;
    setBusy("suggest"); setError("");
    try { setSugg(await aiSuggest(ai.apiKey, { nowAbs, snapshot: snapshot() })); } catch (err) { setError(err.message); }
    setBusy("");
  };
  const fromAi = (list) => list.map((x) => addTodo({ title: x.title, cls: x.class_name, due: absFromLocal(x.when), minutes: x.minutes > 0 ? x.minutes : null, dread: x.dread }));
  const doAction = (s, i) => {
    if (s.action === "add_todos") setTodos((ts) => [...ts, ...fromAi(s.todos)]);
    if (s.action === "split_todo") {
      const target = todos.find((t) => t.id === s.target_todo_id);
      if (target) dropTask(target);
      setTodos((ts) => [...ts.filter((t) => t.id !== s.target_todo_id), ...fromAi(s.todos)]);
    }
    if (s.action === "schedule_all") planAll();
    if (s.action === "add_exams") onImport(s.exams.map((e) => ({ kind: "exam", ...e })), { planStudy: true, removeTodoId: s.target_todo_id || undefined });
    if (s.action === "set_cooked") onSetCooked(s.exam_id, s.cooked);
    if (s.action === "apply_cram") onApplyCram();
    setSugg((x) => ({ ...x, suggestions: x.suggestions.map((y, j) => (j === i ? { ...y, used: true } : y)) }));
  };
  const actionLabel = (s) => ({
    add_todos: `Add ${s.todos.length} to-do${s.todos.length === 1 ? "" : "s"}`,
    split_todo: `Split into ${s.todos.length}`,
    schedule_all: unplanned.length ? `Plan ${unplanned.length} to-do${unplanned.length === 1 ? "" : "s"}` : null,
    add_exams: s.exams.length ? `Add to Cram + plan study` : null,
    set_cooked: (cram.exams || []).some((e) => e.id === s.exam_id) ? `Set to ${s.cooked}/5` : null,
    apply_cram: cram.active ? "Update Cram plan" : "Turn on Cram mode",
  }[s.action]);

  const groups = {};
  todos.forEach((td) => { const g = dueGroup(td, nowAbs, todayN); (groups[g] = groups[g] || []).push(td); });
  Object.values(groups).forEach((l) => l.sort((a, b) => (a.due ?? Infinity) - (b.due ?? Infinity)));

  const row = (td) => {
    const t = taskFor(td, tasks);
    const end = t && t.fits ? t.segments[t.segments.length - 1].end : null;
    const late = end != null && td.due != null && end > td.due;
    return (
      <li key={td.id} className={"todo" + (td.done ? " done" : "")}>
        <input type="checkbox" checked={td.done} aria-label={`Done: ${td.title}`} onChange={() => toggle(td)} />
        <div className="todo-main">
          <div className="todo-title">
            {td.title}
            {td.cls && <span className="chip-cls">{td.cls}</span>}
          </div>
          <div className="todo-meta">
            {td.due != null ? <span className={td.due < nowAbs && !td.done ? "warn" : ""}>due {fmtWhen(td.due, todayN)}</span> : <span>no deadline</span>}
            {" · "}
            {t ? <span>~{fmtDur(td.minutes || 30)}</span> : (
              <label className="mins">~<input type="number" min="5" step="5" value={td.minutes ?? ""} placeholder="30" aria-label={`Minutes for ${td.title}`}
                onChange={(e) => update(td.id, { minutes: e.target.value === "" ? null : Number(e.target.value) })} />m</label>
            )}
            {td.note && <span> · {td.note}</span>}
            {!td.done && t && (t.fits
              ? <> · <button className="linkbtn inline" type="button" onClick={() => onJump(keyOf(dayOfAbs(t.segments[0].start)))}>on calendar {fmtWhen(t.segments[0].start, todayN)}</button>
                  {late && <span className="warn"> · finishes {fmtDur(end - td.due)} late</span>}</>
              : <span className="warn"> · doesn't fit yet</span>)}
          </div>
        </div>
        {!td.done && td.due != null && parseQuickTodo(td.title, nowAbs).examLike
          ? <button className="btn small cram-btn" type="button" title="It's an exam: let Cram mode plan the studying" onClick={() => todoToCram(td)}>→ Cram</button>
          : null}
        {!td.done && (t
          ? <button className="btn ghost small" type="button" title="Take it off the calendar" onClick={() => onUnschedule(t.id)}>Unplan</button>
          : <button className="btn ghost small" type="button" onClick={() => onSchedule([td])}>Plan it</button>)}
        <button className="x" aria-label={`Remove ${td.title}`} onClick={() => remove(td)}>×</button>
      </li>
    );
  };

  return (
    <div className="card todo-card" id="f-todo">
      <div className="todo-head">
        <div>
          <h2>To-do</h2>
          <p className="sub" style={{ margin: 0 }}>
            {todos.filter((t) => !t.done).length} open{unplanned.length ? ` · ${unplanned.length} not on the calendar yet` : todos.some((t) => !t.done) ? " · all planned" : ""}
          </p>
        </div>
        <div className="todo-tools">
          <button className="btn ghost small" type="button" disabled={!unplanned.length} onClick={planAll}>Plan all{unplanned.length ? ` (${unplanned.length})` : ""}</button>
          <button className="btn ghost small" type="button" aria-expanded={dumpOpen} onClick={() => setDumpOpen((o) => !o)}>✦ Brain dump</button>
          <button id="f-ask" className="btn small ai-btn" type="button" disabled={busy === "suggest"} onClick={runSuggest}>{busy === "suggest" ? "Thinking…" : "✦ What should I do?"}</button>
          <button className="linkbtn" type="button" onClick={() => setShowKey((v) => !v)}>{ai.apiKey ? "AI: on" : "AI: off"}</button>
        </div>
      </div>

      {showKey && <AiKeyPanel ai={ai} setAi={setAi} onClose={() => setShowKey(false)} />}
      {error && <p className="banner" style={{ marginTop: 10 }}>{error}</p>}

      <form className="quick" onSubmit={quickAdd}>
        <input type="text" value={text} placeholder='Add a to-do: "stats pset fri 5pm 2h"' aria-label="New to-do" onChange={(e) => setText(e.target.value)} />
        <button className="btn" type="submit" disabled={!parsed}>Add</button>
      </form>
      {parsed && (parsed.due != null || parsed.minutes != null || parsed.cls) && (
        <p className="parse-preview">
          <b>{parsed.title}</b>
          {parsed.cls && <span className="chip-cls">{parsed.cls}</span>}
          {parsed.due != null && ` · due ${fmtWhen(parsed.due, todayN)}`}
          {parsed.minutes != null && ` · ~${fmtDur(parsed.minutes)}`}
        </p>
      )}
      {parsed && parsed.examLike && parsed.due != null && (
        <p className="exam-hint">
          Looks like an exam. Cram mode can plan your studying for <b>{parsed.examName}</b>
          {parsed.hasTime ? ` (${fmtWhen(parsed.due, todayN)})` : ` (${fmtDate(keyOf(dayOfAbs(parsed.due)), { weekday: "short", month: "short", day: "numeric" })}, time set to 10 AM)`}.
          <button className="btn small cram-btn" type="button" onClick={quickExam}>Add as exam + plan study</button>
        </p>
      )}

      {dumpOpen && (
        <div className="ai-panel" id="f-dump">
          <b>Brain dump</b>
          <p className="note" style={{ margin: 0 }}>Paste anything: a syllabus schedule, notes to yourself, "ugh i have a lab report thursday and a chem quiz monday and practice every day 4-6". Claude sorts it into to-dos, exams and events.</p>
          <textarea rows={4} value={dump} onChange={(e) => setDump(e.target.value)} aria-label="Brain dump" placeholder="Everything on your mind…" />
          <div className="ai-row">
            <button className="btn small ai-btn" type="button" disabled={!dump.trim() || busy === "dump"} onClick={runDump}>{busy === "dump" ? "Sorting…" : "✦ Sort it out"}</button>
            <button className="btn ghost small" type="button" onClick={() => { setDumpOpen(false); setDumpRes(null); }}>Close</button>
          </div>
          {dumpRes && (
            <div className="stack" style={{ gap: 8 }}>
              <p className="ai-msg">{dumpRes.message}</p>
              {dumpRes.items.length > 0 && (
                <>
                  <ul className="dump-list">
                    {dumpRes.items.map((it, i) => {
                      const at = absFromLocal(it.when);
                      return (
                        <li key={i}>
                          <label>
                            <input type="checkbox" checked={it.pick}
                              onChange={() => setDumpRes((r) => ({ ...r, items: r.items.map((x, j) => (j === i ? { ...x, pick: !x.pick } : x)) }))} />
                            <span>
                              <b>{it.title}</b>{it.class_name && <span className="chip-cls">{it.class_name}</span>} <span className="tag">{KIND_TAG[it.kind]}</span>
                              <span className="todo-meta">
                                {at != null ? (it.kind === "todo" ? `due ${fmtWhen(at, todayN)}` : `${fmtWhen(at, todayN)}${it.end_time ? ` – ${fmt(toMin(it.end_time))}` : ""}`) : "no date"}
                                {it.minutes > 0 && it.kind !== "event" ? ` · ~${fmtDur(it.minutes)}` : ""}{it.note ? ` · ${it.note}` : ""}
                                {it.kind === "exam" ? ` · ${it.cooked}/5 ${COOKED_LABELS[it.cooked - 1]}` : ""}
                                {it.kind === "study" ? ` · folded into ${it.exam_title || "its exam"}'s study plan` : ""}
                                {it.kind === "event" && it.repeat !== "none" ? ` · repeats ${it.repeat === "daily" ? "daily" : "weekdays"}${it.repeat_until ? ` until ${fmtDate(it.repeat_until, { month: "short", day: "numeric" })}` : " through your exams"}` : ""}
                                {(it.kind === "exam" || it.kind === "event") && at == null ? " · needs a date, will be skipped" : ""}
                              </span>

                  {dumpRes.items.some((it) => it.pick && (it.kind === "exam" || it.kind === "study")) && (cram.active
                    ? <p className="note" style={{ margin: 0 }}>Cram mode is on, so your study plan updates when you add these.</p>
                    : <label className="check"><input type="checkbox" checked={planStudy} onChange={(e) => setPlanStudy(e.target.checked)} /> Turn on Cram mode and plan study time for these exams now</label>)}
                  <button className="btn small" type="button" disabled={!dumpRes.items.some((it) => it.pick)} onClick={addPicked}>
                    Add {dumpRes.items.filter((it) => it.pick).length} selected
                  </button>
                </>
              )}
            </div>
          )}
        </div>
      )}

      {sugg && (
        <div className="ai-panel sugg">
          <div className="ai-row" style={{ justifyContent: "space-between" }}>
            <b>✦ {sugg.summary}</b>

          </div>
          <ol className="sugg-list">
            {sugg.suggestions.map((s, i) => {
              const label = actionLabel(s);
              return (
                <li key={i}>
                  <div>
                    <b>{s.headline}</b>
                    <p>{s.detail}</p>
                    {s.todos.length > 0 && <p className="todo-meta">{s.todos.map((x) => `${x.title}${x.minutes ? ` (~${fmtDur(x.minutes)})` : ""}`).join(" · ")}</p>}
                  </div>
                  {s.action === "open_cram" ? <a className="btn ghost small" href="cram.html">Cram mode →</a>
                    : s.action === "open_grades" ? <a className="btn ghost small" href="grades.html">Grade check →</a>
                    : label && (s.used ? <span className="mono done-tag">done ✓</span> : <button className="btn ghost small" type="button" onClick={() => doAction(s, i)}>{label}</button>)}
                </li>

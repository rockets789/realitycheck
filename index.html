<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RealityCheck — How long will this actually take me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>
  :root {
    --paper: #f6f2ea;
    --card: #fffdf8;
    --ink: #1f1d1a;
    --muted: #6f6a61;
    --line: #e4ddd0;
    --line-strong: #cfc6b6;
    --accent: #e0603a;      /* warnings / now line */
    --accent-soft: #fbe3d9;
    --sage: #5d8a6a;        /* free time / "your life" */
    --sage-soft: #e3eee5;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "DM Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: "DM Mono", ui-monospace, monospace; }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; margin: 0; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .date-pill { font-family: "DM Mono", monospace; font-size: 13px; background: var(--card); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }

  .layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card h2 { font-family: "Fraunces", serif; font-size: 19px; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .tag { font-family: "DM Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }

  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); }
  input[type=text], input[type=time], input[type=number] {
    background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; font-size: 15px; color: var(--ink); width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }

  .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .error { color: var(--accent); font-size: 13px; margin: 0; }

  .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .slider .name { font-size: 13px; font-weight: 500; }
  .slider .val { font-family: "DM Mono", monospace; font-size: 13px; background: var(--paper); border-radius: 6px; padding: 1px 7px; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
  .slider .ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -2px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-family: "Fraunces", serif; font-size: 22px; font-weight: 500; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.life { background: var(--sage-soft); }
  .stat.life b { color: var(--sage); }

  /* Timeline */
  .tl-card { padding: 0; overflow: hidden; }
  .tl-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .tl-head h2 { margin: 0; }
  .tl-scroll { max-height: 74vh; overflow-y: auto; }
  .timeline { position: relative; margin: 14px 18px 18px 74px; }
  .hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .hour.half { border-top: 1px dashed #efe9de; }
  .hour-label { position: absolute; left: -64px; top: -9px; width: 54px; text-align: right; font-family: "DM Mono", monospace; font-size: 12px; color: var(--muted); }
  .slot-hit { position: absolute; left: 0; right: 0; cursor: copy; }
  .slot-hit:hover { background: rgba(31,29,26,.035); }

  .event { position: absolute; border-radius: 10px; padding: 6px 10px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); border-left-width: 4px; cursor: default; transition: box-shadow .15s; }
  .event:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); z-index: 5; }
  .event .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event .time { font-family: "DM Mono", monospace; font-size: 11.5px; opacity: .75; }
  .event .del { position: absolute; top: 4px; right: 4px; border: none; background: rgba(255,255,255,.85); border-radius: 6px; width: 22px; height: 22px; cursor: pointer; opacity: 0; font-size: 14px; line-height: 1; }
  .event:hover .del, .event .del:focus-visible { opacity: 1; }
  .event.conflict { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .conflict-badge { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 5px; margin-left: 4px; }

  .now-line { position: absolute; left: -8px; right: 0; height: 0; border-top: 2px solid var(--accent); z-index: 6; pointer-events: none; }
  .now-line::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .now-line span { position: absolute; right: 0; top: -20px; font-family: "DM Mono", monospace; font-size: 11px; color: var(--accent); background: var(--card); padding: 0 4px; }
  .past-shade { position: absolute; left: 0; right: 0; top: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(31,29,26,.03) 6px 12px); pointer-events: none; }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .empty-hint { position: absolute; left: 0; right: 0; top: 40px; text-align: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  /* Reality check result */
  .result { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 2px; }
  .result .headline { font-size: 15px; margin: 0; }
  .result .headline b { font-family: "Fraunces", serif; font-weight: 700; font-size: 24px; }
  .result .headline .reality { color: var(--accent); }
  .result .extra { font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
  .phase-stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin-bottom: 14px; }
  .phase-row { margin-bottom: 12px; }
  .phase-row .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .phase-row .top .mono { font-weight: 500; }
  .phase-row .bar { height: 8px; border-radius: 4px; margin: 5px 0 4px; background: var(--paper); overflow: hidden; display: flex; }
  .phase-row .bar i { display: block; height: 100%; }
  .phase-row p { margin: 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>

<!-- ENGINE:START: pure estimation engine (plain JS so it can be tested outside the browser) -->
<script>
/**
 * estimate({ guess, energy, distraction, dread }) -> { total, phases }
 *   guess:       optimistic estimate in minutes (> 0)
 *   energy:      1 (running on fumes) .. 5 (fully charged)
 *   distraction: 1 (phone in another room) .. 5 (group chat is popping)
 *   dread:       1 (kind of fun) .. 5 (I'd rather do laundry)
 * Phases are rounded to whole minutes; total is the sum of the rounded phases,
 * so the bars always add up to the headline number.
 */
function estimate({ guess, energy, distraction, dread }) {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Number(v)));
  const g = Number(guess);
  if (!Number.isFinite(g) || g <= 0) throw new Error("guess must be a positive number of minutes");
  const e = clamp(energy, 1, 5), d = clamp(distraction, 1, 5), r = clamp(dread, 1, 5);

  const setup = 5 + r * 3;                        // setup friction
  const fatigue = 1 + (5 - e) * 0.10;             // fatigue multiplier
  const deep = g * fatigue;                       // deep work
  const distractionTax = deep * (d - 1) * 0.08;   // distraction tax
  const buffer = Math.max(5, 0.10 * (setup + deep + distractionTax));

  const phases = [
    { key: "setup", label: "Setup", minutes: Math.round(setup),
      why: `5m to get going + ${r * 3}m of stalling because dread is ${r}/5.` },
    { key: "deep", label: "Deep Work", minutes: Math.round(deep + distractionTax),
      why: `Your ${g}m × ${fatigue.toFixed(1)} for energy ${e}/5 = ${Math.round(deep)}m, plus ${Math.round(distractionTax)}m lost to distraction (${d}/5).`,
      parts: { guess: g, fatigue: Math.round(deep) - g, distraction: Math.round(deep + distractionTax) - Math.round(deep) } },
    { key: "buffer", label: "Buffer", minutes: Math.round(buffer),
      why: "10% slack for wrap-up and surprises (never less than 5m)." },
  ];
  const total = phases.reduce((s, p) => s + p.minutes, 0);
  return { total, phases };
}
if (typeof module !== "undefined") module.exports = { estimate };
</script>
<!-- ENGINE:END -->

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------- Config ---------- */
const DAY_START = 9 * 60;    // 9:00 AM, in minutes from midnight
const DAY_END = 23 * 60;     // 11:00 PM
const HOUR_PX = 64;          // height of one hour on the timeline
const PX_PER_MIN = HOUR_PX / 60;
const STORAGE_KEY = "realitycheck.events.v1";

const COLORS = [
  { bg: "#e6eefb", edge: "#4a72c4" }, // blue
  { bg: "#f3e8fb", edge: "#8a5cc4" }, // purple
  { bg: "#fdf0d6", edge: "#c9932b" }, // amber
  { bg: "#e3eee5", edge: "#5d8a6a" }, // sage
  { bg: "#fbe3d9", edge: "#e0603a" }, // coral
];

const SAMPLE_EVENTS = [
  { id: "s1", title: "CS 251 Lecture", start: 10 * 60 + 30, end: 11 * 60 + 45, color: 0 },
  { id: "s2", title: "Lunch with Priya", start: 12 * 60 + 30, end: 13 * 60 + 30, color: 3 },
  { id: "s3", title: "Team standup", start: 15 * 60, end: 15 * 60 + 30, color: 1 },
  { id: "s4", title: "Gym", start: 18 * 60, end: 19 * 60, color: 2 },
];

/* ---------- Time helpers ---------- */
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const toHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
function fmt(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, "0")} ${ampm}`;
}
const fmtDur = (min) => {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
};
const yFor = (min) => (Math.min(Math.max(min, DAY_START), DAY_END) - DAY_START) * PX_PER_MIN;

/* ---------- Storage ---------- */
function useStoredEvents() {
  const [events, setEvents] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return SAMPLE_EVENTS;
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); } catch (e) {}
  }, [events]);
  return [events, setEvents];
}

function useNowMinutes() {
  const get = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const [now, setNow] = useState(get);
  useEffect(() => { const t = setInterval(() => setNow(get()), 30000); return () => clearInterval(t); }, []);
  return now;
}

/* ---------- Layout: put overlapping events side by side ---------- */
function layoutLanes(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = [];
  let cluster = [], lanes = [], clusterEnd = -1;
  const flush = () => {
    cluster.forEach((c) => (c.laneCount = lanes.length));
    out.push(...cluster);
    cluster = []; lanes = []; clusterEnd = -1;
  };
  for (const ev of sorted) {
    if (cluster.length && ev.start >= clusterEnd) flush();
    let lane = lanes.findIndex((end) => end <= ev.start);
    if (lane === -1) { lane = lanes.length; lanes.push(ev.end); } else lanes[lane] = ev.end;
    cluster.push({ ...ev, lane });
    clusterEnd = Math.max(clusterEnd, ev.end);
  }
  if (cluster.length) flush();
  return out;
}

const overlaps = (a, b) => a.start < b.end && b.start < a.end;

/* Minutes inside [from, DAY_END] covered by at least one event */
function bookedMinutes(events, from) {
  const ranges = events
    .map((e) => [Math.max(e.start, from), Math.min(e.end, DAY_END)])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  let total = 0, curS = null, curE = null;
  for (const [s, e] of ranges) {
    if (curE === null || s > curE) { if (curE !== null) total += curE - curS; curS = s; curE = e; }
    else curE = Math.max(curE, e);
  }
  if (curE !== null) total += curE - curS;
  return total;
}

/* ---------- Components ---------- */
function AddEventForm({ onAdd, draftStart }) {
  const [title, setTitle] = useState("");
  const [start, setStart] = useState("14:00");
  const [end, setEnd] = useState("15:00");
  const [color, setColor] = useState(0);
  const [error, setError] = useState("");

  // When the user clicks an empty slot on the timeline, prefill the form
  useEffect(() => {
    if (draftStart == null) return;
    setStart(toHHMM(draftStart.m));
    setEnd(toHHMM(Math.min(draftStart.m + 60, DAY_END)));
    document.getElementById("ev-title")?.focus();
  }, [draftStart]);

  const submit = (e) => {
    e.preventDefault();
    const s = toMin(start), en = toMin(end);
    if (!title.trim()) return setError("Give the event a name.");
    if (en <= s) return setError("End time has to be after the start time.");
    if (en <= DAY_START || s >= DAY_END) return setError("Today's timeline runs 9:00 AM – 11:00 PM.");
    onAdd({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title: title.trim(), start: s, end: en, color });
    setTitle(""); setError("");
  };

  return (
    <form className="card" onSubmit={submit}>
      <h2>Fixed events</h2>
      <p className="sub">Things already on your day — classes, meals, shifts. Tip: click an empty spot on the timeline.</p>
      <div className="stack" style={{ gap: 12 }}>
        <label className="field">What
          <input id="ev-title" type="text" placeholder="e.g. Office hours" value={title} onChange={(e) => setTitle(e.target.value)} />
        </label>
        <div className="row">
          <label className="field">Starts<input type="time" value={start} step="300" onChange={(e) => setStart(e.target.value)} /></label>
          <label className="field">Ends<input type="time" value={end} step="300" onChange={(e) => setEnd(e.target.value)} /></label>
        </div>
        <div className="swatches" role="group" aria-label="Color">
          {COLORS.map((c, i) => (
            <button key={i} type="button" className="swatch" aria-pressed={color === i} aria-label={`Color ${i + 1}`}
              style={{ background: c.edge }} onClick={() => setColor(i)} />
          ))}
        </div>
        {error && <p className="error">{error}</p>}
        <button className="btn" type="submit">Add to today</button>
      </div>
    </form>
  );
}

function Slider({ name, value, onChange, low, high }) {
  return (
    <div className="slider">
      <span className="name">{name}</span>
      <span className="val">{value}/5</span>
      <input type="range" min="1" max="5" step="1" value={value} onChange={(e) => onChange(Number(e.target.value))} aria-label={name} />
      <div className="ends"><span>{low}</span><span>{high}</span></div>
    </div>
  );
}

const PHASE_COLORS = { setup: "#c9932b", deep: "#4a72c4", buffer: "#cfc6b6" };

function RealityResult({ guess, result }) {
  const max = Math.max(...result.phases.map((p) => p.minutes));
  const extra = result.total - guess;
  return (
    <div className="result" aria-live="polite">
      <p className="headline">
        You said <b>{fmtDur(guess)}</b> → Reality: <b className="reality">{fmtDur(result.total)}</b>
      </p>
      <p className="extra">
        {extra > 0 ? `+${fmtDur(extra)} you weren't counting (${Math.round((result.total / guess - 1) * 100)}% more).` : "Your guess holds up."}
      </p>
      <div className="phase-stack" aria-hidden="true">
        {result.phases.map((p) => <div key={p.key} style={{ flex: p.minutes, background: PHASE_COLORS[p.key] }} />)}
      </div>
      {result.phases.map((p) => (
        <div className="phase-row" key={p.key}>
          <div className="top"><span>{p.label}</span><span className="mono">{fmtDur(p.minutes)}</span></div>
          <div className="bar">
            {p.parts ? (
              <>
                <i style={{ width: `${(p.parts.guess / max) * 100}%`, background: PHASE_COLORS.deep }} title="Your guess" />
                <i style={{ width: `${(p.parts.fatigue / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.6 }} title="Fatigue" />
                <i style={{ width: `${(p.parts.distraction / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.35 }} title="Distraction tax" />
              </>
            ) : (
              <i style={{ width: `${(p.minutes / max) * 100}%`, background: PHASE_COLORS[p.key] }} />
            )}
          </div>
          <p>{p.why}</p>
        </div>
      ))}
    </div>
  );
}

function TaskEstimator() {
  const [task, setTask] = useState({ name: "", guess: 60, energy: 3, distraction: 3, dread: 3, deadline: "" });
  const [checked, setChecked] = useState(false);
  const set = (k) => (v) => setTask((t) => ({ ...t, [k]: v }));
  const guessOk = Number.isFinite(task.guess) && task.guess > 0 && task.guess <= 24 * 60;
  // After the first check the card stays live: moving a slider updates the estimate.
  const result = useMemo(() => (checked && guessOk ? estimate(task) : null),
    [checked, guessOk, task.guess, task.energy, task.distraction, task.dread]);
  return (
    <div className="card">
      <h2>Reality check a task</h2>
      <p className="sub">Your guess, then the honest version.</p>
      <div className="stack" style={{ gap: 14 }}>
        <label className="field">Task
          <input type="text" placeholder="e.g. Finish stats problem set" value={task.name} onChange={(e) => set("name")(e.target.value)} />
        </label>
        <div className="row">
          <label className="field">Your guess (min)
            <input type="number" min="5" step="5" value={task.guess} onChange={(e) => set("guess")(Number(e.target.value))} />
          </label>
          <label className="field">Deadline (optional)
            <input type="time" value={task.deadline} onChange={(e) => set("deadline")(e.target.value)} />
          </label>
        </div>
        <Slider name="Current energy" value={task.energy} onChange={set("energy")} low="running on fumes" high="fully charged" />
        <Slider name="Distraction level" value={task.distraction} onChange={set("distraction")} low="phone in another room" high="group chat is popping" />
        <Slider name="Task dread / friction" value={task.dread} onChange={set("dread")} low="kind of fun" high="I'd rather do laundry" />
        {!guessOk && <p className="error">Enter a guess between 1 and 1440 minutes.</p>}
        <button className="btn" type="button" disabled={!guessOk} onClick={() => setChecked(true)}>
          How long will this actually take? →
        </button>
        {result && <RealityResult guess={task.guess} result={result} />}
      </div>
    </div>
  );
}

function DayStats({ events, now }) {
  const from = Math.min(Math.max(now, DAY_START), DAY_END);
  const left = DAY_END - from;
  const booked = bookedMinutes(events, from);
  const free = Math.max(left - booked, 0);
  return (
    <div className="card">
      <div className="stats">
        <div className="stat"><b>{events.length}</b><span>events today</span></div>
        <div className="stat"><b>{fmtDur(booked)}</b><span>booked from now</span></div>
        <div className="stat life"><b>{fmtDur(free)}</b><span>still yours</span></div>
      </div>
    </div>
  );
}

function Timeline({ events, now, onDelete, onPickSlot }) {
  const height = (DAY_END - DAY_START) * PX_PER_MIN;
  const laid = useMemo(() => layoutLanes(events), [events]);
  const conflicts = useMemo(() => {
    const ids = new Set();
    events.forEach((a, i) => events.slice(i + 1).forEach((b) => { if (overlaps(a, b)) { ids.add(a.id); ids.add(b.id); } }));
    return ids;
  }, [events]);

  const hours = [];
  for (let m = DAY_START; m <= DAY_END; m += 30) hours.push(m);
  const slots = [];
  for (let m = DAY_START; m < DAY_END; m += 30) slots.push(m);

  const nowVisible = now >= DAY_START && now <= DAY_END;

  return (
    <div className="timeline" style={{ height }}>
      {now > DAY_START && <div className="past-shade" style={{ height: yFor(now) }} />}

      {slots.map((m) => (
        <div key={"slot" + m} className="slot-hit" style={{ top: yFor(m), height: 30 * PX_PER_MIN }}
          onClick={() => onPickSlot(m)} title={`Add an event at ${fmt(m)}`} />
      ))}

      {hours.map((m) => (
        <div key={m} className={"hour" + (m % 60 ? " half" : "")} style={{ top: yFor(m) }}>
          {m % 60 === 0 && <span className="hour-label">{fmt(m).replace(":00", "")}</span>}
        </div>
      ))}

      {events.length === 0 && <div className="empty-hint">Your day is wide open. Add a fixed event, or click a time slot.</div>}

      {laid.map((ev) => {
        const top = yFor(ev.start), bottom = yFor(ev.end);
        if (bottom - top <= 0) return null;
        const c = COLORS[ev.color] || COLORS[0];
        const widthPct = 100 / ev.laneCount;
        const short = bottom - top < 40;
        return (
          <div key={ev.id} className={"event" + (conflicts.has(ev.id) ? " conflict" : "")}
            style={{
              top: top + 1, height: bottom - top - 2,
              left: `calc(${widthPct * ev.lane}% + 2px)`, width: `calc(${widthPct}% - 4px)`,
              background: c.bg, borderLeftColor: c.edge,
            }}>
            <div className="t">
              {ev.title}
              {conflicts.has(ev.id) && <span className="conflict-badge">overlap</span>}
            </div>
            {!short && <div className="time">{fmt(ev.start)} – {fmt(ev.end)}</div>}
            <button className="del" aria-label={`Delete ${ev.title}`} onClick={() => onDelete(ev.id)}>×</button>
          </div>
        );
      })}

      {nowVisible && (
        <div className="now-line" style={{ top: yFor(now) }}><span>now · {fmt(now)}</span></div>
      )}
    </div>
  );
}

function App() {
  const [events, setEvents] = useStoredEvents();
  const [draftStart, setDraftStart] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const now = useNowMinutes();

  const today = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  useEffect(() => {
    if (!confirmClear) return;
    const t = setTimeout(() => setConfirmClear(false), 3000);
    return () => clearTimeout(t);
  }, [confirmClear]);

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <h1>Reality<span>Check</span></h1>
          <p>How long will this <em>actually</em> take me — and what's left of my day?</p>
        </div>
        <div className="date-pill">{today}</div>
      </header>

      <div className="layout">
        <aside className="stack">
          <DayStats events={events} now={now} />
          <AddEventForm onAdd={(ev) => setEvents((es) => [...es, ev])} draftStart={draftStart} />
          <TaskEstimator />
        </aside>

        <section className="card tl-card">
          <div className="tl-head">
            <h2 style={{ fontFamily: "Fraunces, serif", fontWeight: 500, fontSize: 19 }}>Today</h2>
            <div className="legend">
              <span><i style={{ background: COLORS[0].edge }} />fixed event</span>
              <span><i style={{ background: "var(--accent)" }} />now</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn ghost small" onClick={() => setEvents(SAMPLE_EVENTS)}>Load sample day</button>
              <button className="btn ghost small" onClick={() => (confirmClear ? (setEvents([]), setConfirmClear(false)) : setConfirmClear(true))}>
                {confirmClear ? "Click again to clear" : "Clear all"}
              </button>
            </div>
          </div>
          <div className="tl-scroll">
            <Timeline events={events} now={now}
              onDelete={(id) => setEvents((es) => es.filter((e) => e.id !== id))}
              onPickSlot={(m) => setDraftStart({ m, at: Date.now() /* new object so clicking the same slot re-fills */ })} />
          </div>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

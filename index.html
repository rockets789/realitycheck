      )}

      {todos.length === 0 ? (
        <p className="empty" style={{ marginTop: 12 }}>Nothing yet. Type one above{ai.apiKey ? ", or brain dump everything and let Claude sort it out" : ""}.</p>
      ) : (
        <div className="todo-groups">
          {GROUPS.filter(([g]) => groups[g]).map(([g, label]) => (
            <section key={g}>
              <h3 className={g === "overdue" ? "warn" : ""}>{label} <span>{groups[g].length}</span></h3>
              <ul className="todo-list">{groups[g].map(row)}</ul>
            </section>
          ))}
          {groups.done && (
            <section>
              <h3>
                <button className="linkbtn" type="button" onClick={() => setShowDone((v) => !v)}>{showDone ? "Hide" : "Show"} done ({groups.done.length})</button>
                {" "}<button className="linkbtn" type="button" onClick={() => setTodos((ts) => ts.filter((t) => !t.done))}>clear done</button>
              </h3>
              {showDone && <ul className="todo-list">{groups.done.map(row)}</ul>}
            </section>
          )}
        </div>
      )}
    </div>
  );
}

function DayStats({ events, tasks, date, now }) {
  const isToday = date === now.today;
  const from = isToday ? clamp(now.min, DAY_START, DAY_END) : date < now.today ? DAY_END : DAY_START;
  const dayEvents = events.filter((e) => e.date === date);
  // Planned task time counts as booked; breaks between sessions are still yours.
  const taskBlocks = segmentsOnDay(tasks, dayNum(date)).filter((s) => s.kind !== "break").map((s) => ({ start: s.ls, end: s.le }));
  const booked = bookedMinutes([...dayEvents, ...taskBlocks], from);
  const free = Math.max(DAY_END - from - booked, 0);
  return (
    <div className="card" id="f-today">
      <p className="stats-day">{isToday ? "Today" : fmtDate(date, { weekday: "long", month: "short", day: "numeric" })}</p>
      <div className="stats">
        <div className="stat"><b>{dayEvents.length}</b><span>events</span></div>
        <div className="stat"><b>{fmtDur(booked)}</b><span>{isToday ? "booked from now" : "booked"}</span></div>
        <div className="stat life"><b>{fmtDur(free)}</b><span>still yours</span></div>
      </div>
    </div>
  );
}

function DayColumn({ date, isToday, isPast, now, pxPerMin, windDown, events, segs, deadlines, onDelete, onPickSlot }) {
  const y = (m) => (clamp(m, DAY_START, DAY_END) - DAY_START) * pxPerMin;
  const laid = useMemo(() => layoutLanes(events), [events]);
  const conflicts = useMemo(() => {
    const ids = new Set();
    events.forEach((a, i) => events.slice(i + 1).forEach((b) => { if (overlaps(a, b)) { ids.add(a.id); ids.add(b.id); } }));
    return ids;
  }, [events]);
  const hourPx = pxPerMin * 60;

  return (
    <div className={"col" + (isToday ? " today" : "")} style={{ backgroundSize: `100% ${hourPx}px, 100% ${hourPx / 2}px` }}
      onClick={(e) => {
        if (e.target !== e.currentTarget) return; // only empty space, not events
        const m = DAY_START + Math.floor(e.nativeEvent.offsetY / pxPerMin / 30) * 30;
        if (m < DAY_END) onPickSlot(date, m);
      }}>
      {(isPast || (isToday && now.min > DAY_START)) && (
        <div className="past-shade" style={{ height: isPast ? "100%" : y(now.min) }} />
      )}

      {laid.map((ev) => {
        const top = y(ev.start), bottom = y(ev.end);
        if (bottom - top <= 0) return null;
        const c = COLORS[ev.color] || COLORS[0];
        const widthPct = 100 / ev.laneCount;
        const short = bottom - top < 40;
        return (
          <div key={ev.id} className={"event" + (ev.cramExamId ? " exam" : "") + (conflicts.has(ev.id) ? " conflict" : "")}
            title={`${ev.title} · ${fmt(ev.start)} – ${fmt(ev.end)}`}
            style={{
              top: top + 1, height: bottom - top - 2,
              left: `calc(${widthPct * ev.lane}% + 2px)`, width: `calc(${widthPct}% - 4px)`,
              background: c.bg, borderLeftColor: c.edge,
            }}>
            <div className="t">
              {ev.cramExamId && <span className="exam-badge">Exam</span>}
              {ev.title}
              {conflicts.has(ev.id) && <span className="conflict-badge">overlap</span>}
            </div>
            {!short && <div className="time">{fmt(ev.start)} – {fmt(ev.end)}</div>}
            <button className="del" aria-label={`Delete ${ev.title}`} onClick={() => onDelete(ev.id)}>×</button>
          </div>
        );
      })}

      {windDown < DAY_END && (
        <div className="winddown" style={{ top: y(windDown) }}><span>wind-down</span></div>
      )}

      {segs.map((s) => {
        const top = y(s.ls), h = y(s.le) - top;
        if (h <= 0) return null;
        const clash = s.kind !== "break" && events.some((e) => overlaps({ start: s.ls, end: s.le }, e));
        return (
          <div key={s.taskId + ":" + s.i} className={`tseg ${s.kind}` + (clash ? " conflict" : "")}
            style={{ top: top + 1, height: Math.max(h - 2, 3), ...studyStyle(s) }}
            title={`${s.title} · ${KIND_LABEL[s.kind]} · ${fmt(s.ls)} – ${fmt(s.le)}`}>
            {h >= 13 && (
              <span className="tseg-label">
                {s.sessionStart && <b>{s.title} · </b>}
                {KIND_LABEL[s.kind]}{h >= 24 ? ` ${fmtDur(s.le - s.ls)}` : ""}
              </span>
            )}
          </div>
        );
      })}

      {deadlines.map((d) => (
        <div key={"dd" + d.id} className="deadline-line" style={{ top: y(d.m) }}>
          <span><b>{d.passed ? "passed: " : ""}start {d.title} by {fmt(d.m)}</b></span>
        </div>
      ))}

      {isToday && now.min >= DAY_START && now.min <= DAY_END && (
        <div className="now-line" style={{ top: y(now.min) }}><span>now · {fmt(now.min)}</span></div>
      )}
    </div>
  );
}

function TimeGrid({ dates, now, hourPx, windDown, events, tasks, nowAbs, expanded, scrollRef, bodyRef, onDelete, onPickSlot, onOpenDay }) {
  const pxPerMin = hourPx / 60;
  const height = (DAY_END - DAY_START) * pxPerMin;
  const multi = dates.length > 1;
  const byDate = useMemo(() => {
    const m = {};
    events.forEach((e) => { (m[e.date] = m[e.date] || []).push(e); });
    return m;
  }, [events]);
  const hours = [];
  for (let m = DAY_START; m <= DAY_END; m += 60) hours.push(m);
  const cols = `56px repeat(${dates.length}, minmax(0, 1fr))`;
  const empty = !dates.some((d) => (byDate[d] || []).length) && !dates.some((d) => segmentsOnDay(tasks, dayNum(d)).length);

  return (
    <div className={"tl-scroll" + (multi ? " compact" : "") + (expanded ? " expanded" : "")} ref={scrollRef}>
      <div style={{ minWidth: multi ? 56 + dates.length * 96 : undefined, position: "relative" }}>
        <div className="day-heads" style={{ gridTemplateColumns: cols }}>
          <div />
          {dates.map((d) => (
            <button key={d} type="button" className={"day-head" + (d === now.today ? " today" : "")}
              onClick={() => onOpenDay(d)} title={multi ? "Open this day" : undefined}>
              {fmtDate(d, { weekday: "short" })}<b>{Number(d.slice(8))}</b>
            </button>
          ))}
        </div>
        <div className="grid-body" ref={bodyRef} style={{ gridTemplateColumns: cols, height }}>
          <div className="gutter">
            {hours.map((m) => (
              <span key={m} className="hour-label" style={{ top: (m - DAY_START) * pxPerMin - 8 }}>{fmt(m).replace(":00", "")}</span>
            ))}
          </div>
          {dates.map((d) => {
            const n = dayNum(d);
            const deadlines = tasks.map((t) => {
              const st = deadlineStatus(t, nowAbs);
              if (!st || dayOfAbs(st.dropDead) !== n) return null;
              const m = st.dropDead - n * DAY_MIN;
              return m >= DAY_START && m <= DAY_END ? { id: t.id, title: t.title, m, passed: st.passed } : null;
            }).filter(Boolean);
            return (
              <DayColumn key={d} date={d} isToday={d === now.today} isPast={d < now.today} now={now}
                pxPerMin={pxPerMin} windDown={windDown} events={byDate[d] || []} segs={segmentsOnDay(tasks, n)}
                deadlines={deadlines} onDelete={onDelete} onPickSlot={onPickSlot} />
            );
          })}
        </div>
        {empty && <div className="empty-hint" style={{ top: 90 }}>Nothing planned{multi ? " this week" : " this day"}. Add a fixed event, or click a time slot.</div>}
      </div>
    </div>
  );
}

function MonthGrid({ anchor, events, tasks, today, onOpenDay }) {
  const first = monthStart(anchor);
  const start = weekStart(first);
  const daysInMonth = dayNum(addMonths(first, 1)) - dayNum(first);
  const cells = Math.ceil((weekday(first) + daysInMonth) / 7) * 7;
  const byDate = useMemo(() => {
    const m = {};
    events.forEach((e) => { (m[e.date] = m[e.date] || []).push({ kind: "event", start: e.start, title: e.title, color: e.color, id: e.id, exam: !!e.cramExamId }); });
    tasks.forEach((t) => {
      if (!t.fits) return;
      const perDay = {};
      t.segments.forEach((s) => {
        if (s.kind === "break") return;
        const d = keyOf(dayOfAbs(s.start));
        perDay[d] = perDay[d] || { start: s.start - dayOfAbs(s.start) * DAY_MIN, min: 0, color: t.study ? t.color : null };
        perDay[d].min += s.end - s.start;
      });
      Object.entries(perDay).forEach(([d, v]) => { (m[d] = m[d] || []).push({ kind: "task", start: v.start, title: t.title, min: v.min, id: t.id, color: v.color }); });
    });
    Object.values(m).forEach((list) => list.sort((a, b) => a.start - b.start));
    return m;
  }, [events, tasks]);

  return (
    <div className="month">
      <div className="month-inner">
        <div className="month-dow">{[0, 1, 2, 3, 4, 5, 6].map((i) => <div key={i}>{fmtDate(addDays(start, i), { weekday: "short" })}</div>)}</div>
        <div className="month-grid">
          {Array.from({ length: cells }, (_, i) => {
            const d = addDays(start, i);
            const items = byDate[d] || [];
            const inMonth = d.slice(0, 7) === first.slice(0, 7);
            return (
              <div key={d} role="button" tabIndex={0} className={"mcell" + (inMonth ? "" : " other") + (d === today ? " today" : "")}
                onClick={() => onOpenDay(d)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpenDay(d); } }}
                aria-label={`${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })}, ${items.length} items`}>
                <span className="num">{Number(d.slice(8))}</span>
                {items.slice(0, 3).map((it) => it.kind === "event" ? (
                  <div key={it.id} className={"chip" + (it.exam ? " exam" : "")} style={{ background: (COLORS[it.color] || COLORS[0]).bg, borderLeftColor: (COLORS[it.color] || COLORS[0]).edge }}>
                    {it.exam && <span className="exam-badge">Exam</span>}
                    <span className="mono">{fmt(it.start).replace(":00", "").replace(" ", "").toLowerCase()}</span>{it.title}
                  </div>
                ) : (
                  <div key={it.id} className="chip task" style={it.color != null ? { borderColor: (COLORS[it.color] || COLORS[0]).edge, background: (COLORS[it.color] || COLORS[0]).bg } : null}><span className="mono">{fmtDur(it.min)}</span>{it.title}</div>
                ))}
                {items.length > 3 && <span className="more">+{items.length - 3} more</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [events, setEvents] = useStoredState(STORAGE_KEY, sampleFor(dateKey(new Date())), migrateEvents);
  const [tasks, setTasks] = useStoredState(TASKS_KEY, [], migrateTasks);
  const [settings, setSettings] = useStoredState(SETTINGS_KEY,
    { windDown: "21:00", planFrom: "", lookahead: 7, dailyCapH: 4, hourPx: ZOOM_DEFAULT, view: "week" });
  const [cram, setCram] = useStoredState(CRAM_KEY, CRAM_DEFAULT);
  const [cramMsg, setCramMsg] = useState(null);
  const [todos, setTodos] = useStoredState(TODOS_KEY, []);
  const [grades] = useStoredState(GRADES_KEY, { classes: [] });
  const [draft, setDraft] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const now = useNow();
  const [anchor, setAnchor] = useState(now.today);
  const updateSettings = (patch) => setSettings((s) => ({ ...s, ...patch }));

  const view = ["day", "week", "month"].includes(settings.view) ? settings.view : "week";
  const hourPx = clamp(Number(settings.hourPx) || ZOOM_DEFAULT, ZOOM_MIN, ZOOM_MAX);
  const todayN = dayNum(now.today);
  const nowAbs = todayN * DAY_MIN + now.min;
  const windDown = Math.min(timeOr(settings.windDown, 21 * 60), DAY_END);
  const lookahead = clamp(Math.round(Number(settings.lookahead) || 7), 1, 60);
  const dailyCap = Number(settings.dailyCapH) > 0 ? Number(settings.dailyCapH) * 60 : Infinity;
  const planFromAbs = absFromLocal(settings.planFrom) ?? Math.ceil(nowAbs / 5) * 5;

  const absEvents = useMemo(() => events.map(eventAbs), [events]);
  const fixedBusy = absEvents.map((e) => [e.start, e.end]);
  // Look far enough ahead to cover every study session Cram mode pinned to a day.
  const lastPinned = Math.max(0, ...tasks.filter((t) => t.latest != null).map((t) => dayOfAbs(t.latest - 1)));
  const windows = planningWindows(planFromAbs, Math.max(lookahead, lastPinned - dayOfAbs(planFromAbs) + 1), DAY_START, windDown);
  const cramOpt = cram.active ? { hwCapByDay: cram.hwCapByDay || {}, effort: Number(cram.effort) || 1 } : null;
  const hwCap = cramOpt ? (d) => (d in cramOpt.hwCapByDay ? cramOpt.hwCapByDay[d] : dailyCap) : dailyCap;
  const isDone = (t) => t.fits && t.segments.length && t.segments[t.segments.length - 1].end <= nowAbs;

  // Place new tasks in the time left over (earliest deadline first), without moving anything already planned.
  const addTasks = (specs) => {
    const all = tasks.slice(), added = [];
    specs.slice().sort((a, b) => (a.deadline ?? Infinity) - (b.deadline ?? Infinity)).forEach((spec) => {
      const segs = all.flatMap((t) => t.segments || []);
      const hwSegs = all.filter((t) => !t.study).flatMap((t) => t.segments || []);
      const p = placeTask(trimForCram(spec, cramOpt), [...fixedBusy, ...segs.map((s) => [s.start, s.end])], windows,
        { dailyCap: hwCap, capLeft: capLeftFrom(hwSegs, hwCap) });
      const t = { ...spec, id: newId(), ...p };
      all.push(t); added.push(t);
    });
    setTasks((ts) => [...ts, ...added]);
    return added;
  };
  const addTask = (spec) => {
    const [t] = addTasks([spec]);
    if (t.fits) setAnchor(keyOf(dayOfAbs(t.segments[0].start)));
    return t;
  };
  // To-dos -> calendar: each becomes a reality-checked task linked back to its to-do.
  const scheduleTodos = (list) => {
    const added = addTasks(list.map(todoSpec));
    const byTodo = Object.fromEntries(added.map((t) => [t.todoId, t.id]));
    setTodos((ts) => ts.map((td) => (td.id in byTodo ? { ...td, taskId: byTodo[td.id] } : td)));
    const first = added.filter((t) => t.fits).sort((a, b) => a.segments[0].start - b.segments[0].start)[0];
    if (first && list.length === 1) setAnchor(keyOf(dayOfAbs(first.segments[0].start)));
  };
  /* ----- Routing to-dos / brain dump / AI suggestions into the rest of the app ----- */
  const examName = (it) => (it.class_name && !normName(it.title).includes(normName(it.class_name)) ? `${it.class_name} ${it.title}` : it.title);
  // Exams you already have, by name ("MA 261 midterm" matches "MA261 Midterm 2"-style names either way)
  const findExam = (list, name) => {
    const n = normName(name);
    return n ? list.find((e) => normName(e.name) === n) || list.find((e) => normName(e.name).includes(n) || n.includes(normName(e.name))) : null;
  };
  const toEvents = (it, lastDay) => {
    const at = absFromLocal(it.when);
    if (at == null) return [];
    const d0 = dayOfAbs(at), start = clamp(at - d0 * DAY_MIN, 0, DAY_MIN - 5);
    const end = /^\d{2}:\d{2}$/.test(it.end_time || "") && toMin(it.end_time) > start ? toMin(it.end_time) : start + 60;
    const repeat = it.repeat === "daily" || it.repeat === "weekdays" ? it.repeat : "none";
    // Repeating blocks run until the date given, else through the last exam (at least two weeks), max 60 days.
    const until = repeat === "none" ? d0
      : Math.min(d0 + 60, isDateKey(it.repeat_until) ? dayNum(it.repeat_until) : Math.max(d0 + 13, lastDay ?? 0));
    const seriesId = repeat === "none" ? undefined : newId(), out = [];
    for (let d = d0; d <= until; d++) {
      const wd = weekday(keyOf(d));
      if (repeat === "weekdays" && (wd === 0 || wd === 6)) continue;
      out.push({ id: newId(), title: it.title, date: keyOf(d), start, end: Math.min(end, DAY_MIN), color: 2, seriesId });
    }
    return out;
  };
  /* Turn on / update Cram mode right here (the same thing Apply does in Cram mode): exams become fixed events,
     study sessions get planned, homework is re-planned around them. */
  const applyCram = (nextCram, nextEvents, what, baseTasks = tasks) => {
    const P = cramPlan({ cram: nextCram, events: nextEvents, tasks: baseTasks, settings, nowAbs });
    const before = studyByDay(baseTasks), after = studyByDay(P.nextTasks);
    setEvents(P.nextEvents);
    setTasks(P.nextTasks);
    setCram({ ...nextCram, active: true, hwCapByDay: P.alloc.hwCapByDay, appliedSig: P.sig });
    const moved = [...new Set([...Object.keys(before), ...Object.keys(after)].map(Number))].sort((a, b) => a - b)
      .map((d) => ({ d, delta: (after[d] || 0) - (before[d] || 0) })).filter((x) => Math.abs(x.delta) >= 15);
    const missing = P.alloc.lost - P.alloc.recovered;
    setCramMsg({ at: Date.now(), what, missing, link: !cram.active,
      note: !cram.active ? `Cram mode is on: ${fmtDur(Object.values(after).reduce((a, b) => a + b, 0))} of study planned across ${Object.keys(after).length} days.` : "",
      moved: moved.map(({ d, delta }) => `${d === todayN ? "today" : fmtDate(keyOf(d), { weekday: "short" })} ${delta > 0 ? "+" : "−"}${fmtDur(Math.abs(delta))}`) });
  };
  /* Bring in items from the brain dump, quick add or an AI suggestion, each to the feature that handles it:
     to-dos -> to-do list, exams -> Cram mode, "study for X" -> folded into X's Cram plan, events -> calendar.
     opts.planStudy: also plan study time now (turns Cram mode on). opts.removeTodoId: a to-do this replaces. */
  const importItems = (items, opts = {}) => {
    const exams = (cram.exams || []).map((e) => ({ ...e })); // copies: cooked levels may change below
    const newTodos = [], newEvents = [], folded = [];
    let examsAdded = 0;
    // Exams first, so "study for X" items can find X.
    items.filter((it) => it.kind === "exam" && absFromLocal(it.when) != null).forEach((it) => {
      const name = examName(it), cls = classForExam(grades.classes, name), gs = cls && gradeSummary(cls);
      const cooked = Math.max(it.cooked || 3, gs ? gs.cooked : 1); // the more cooked signal wins
      const same = findExam(exams, name);
      if (same && same.when === it.when) { same.cooked = Math.max(same.cooked, cooked); return; }
      exams.push({ id: newId(), name, when: it.when, length: it.minutes > 0 ? it.minutes : 90, cooked, days: null, color: exams.length % COLORS.length });
      examsAdded++;
    });
    items.filter((it) => it.kind === "study").forEach((it) => {
      const ex = findExam(exams, it.exam_title) || findExam(exams, examName(it));
      if (ex) { if ((it.cooked || 3) > ex.cooked) ex.cooked = it.cooked; folded.push(ex.name); }
      else newTodos.push(it); // no exam to attach it to: keep it as a to-do so nothing is lost
    });
    items.filter((it) => it.kind === "todo").forEach((it) => newTodos.push(it));
    const lastDay = exams.map((e) => absFromLocal(e.when)).filter((x) => x != null).map(dayOfAbs).reduce((a, b) => Math.max(a, b), todayN);
    items.filter((it) => it.kind === "event").forEach((it) => newEvents.push(...toEvents(it, lastDay)));

    const removed = opts.removeTodoId ? todos.find((t) => t.id === opts.removeTodoId) : null;
    const removedTask = removed && taskFor(removed, tasks);
    const baseTasks = removedTask ? tasks.filter((t) => t.id !== removedTask.id) : tasks;
    setTodos((ts) => [...ts.filter((t) => t.id !== opts.removeTodoId), ...newTodos.map((it) => ({
      id: newId(), done: false, taskId: null, title: it.title, cls: it.class_name || "", due: absFromLocal(it.when),
      minutes: it.minutes > 0 ? it.minutes : null, dread: it.dread || 3, note: it.note || "" }))]);

    const nextCram = { ...cram, exams };
    const nextEvents = newEvents.length ? [...events, ...newEvents] : events;
    const examsChanged = JSON.stringify(exams) !== JSON.stringify(cram.exams || []);
    const parts = [examsAdded && `${examsAdded} exam${examsAdded === 1 ? "" : "s"}`, newEvents.length && `${newEvents.length} event block${newEvents.length === 1 ? "" : "s"}`,
      newTodos.length && `${newTodos.length} to-do${newTodos.length === 1 ? "" : "s"}`].filter(Boolean);
    const what = `Added ${parts.join(", ") || "it"}${folded.length ? ` (study folded into ${[...new Set(folded)].join(", ")})` : ""}`;
    if ((cram.active && (examsChanged || newEvents.length || removedTask)) || (opts.planStudy && exams.length)) {
      applyCram(nextCram, nextEvents, what, baseTasks);
    } else {
      if (removedTask) setTasks(baseTasks);
      if (newEvents.length || examsChanged) setEvents(withExamEvents(nextEvents, exams, nowAbs));
      if (examsChanged) {
        setCram(nextCram);
        setCramMsg({ at: Date.now(), what, missing: 0, moved: [], note: "They're on your calendar and in Cram mode; study isn't planned yet.",
          action: { label: "Plan study now", run: (c, ev) => applyCram(c, ev, "Planned your study time") } });
      } else if (parts.length) setCramMsg({ at: Date.now(), what, missing: 0, moved: [], note: " " });
    }
    return { examsAdded, folded: folded.length, events: newEvents.length, todos: newTodos.length };
  };
  const setCooked = (id, cooked) => {
    const nextCram = { ...cram, exams: (cram.exams || []).map((e) => (e.id === id ? { ...e, cooked } : e)) };
    const ex = nextCram.exams.find((e) => e.id === id);
    if (cram.active) applyCram(nextCram, events, `${ex ? ex.name : "Exam"} set to ${cooked}/5`);
    else setCram(nextCram);
  };
  /* What the AI coach sees: open to-dos, the next 7 days (fixed events, planned work, free time), exams, grades. */
  const snapshot = () => {
    const live = (td) => tasks.find((t) => t.id === td.taskId);
    const busy = [...fixedBusy, ...tasks.flatMap((t) => (t.fits ? t.segments : [])).filter((s) => s.kind !== "break").map((s) => [s.start, s.end])];
    const hhmm = (m) => toHHMM(clamp(m, 0, DAY_MIN - 1));
    return {
      todos: todos.filter((t) => !t.done).map((t) => {
        const lt = live(t);
        return { id: t.id, title: t.title, class: t.cls || "", due: t.due != null ? localFromAbs(t.due) : "", minutes_estimate: t.minutes || 30,
          dread: t.dread || 3, on_calendar: lt && lt.fits ? localFromAbs(lt.segments[0].start) : "not planned" };
      }),
      done_count: todos.filter((t) => t.done).length,
      next_7_days: Array.from({ length: 7 }, (_, i) => {
        const d = todayN + i, a = Math.max(d * DAY_MIN + DAY_START, nowAbs), b = d * DAY_MIN + windDown;
        return {
          date: `${keyOf(d)} (${fmtDate(keyOf(d), { weekday: "short" })})`,
          fixed_events: events.filter((e) => e.date === keyOf(d)).map((e) => `${hhmm(e.start)}-${hhmm(e.end)} ${e.title}`),
          planned_work: tasks.filter((t) => t.fits && t.segments.some((s) => dayOfAbs(s.start) === d && s.kind !== "break"))
            .map((t) => `${t.study ? "study: " : ""}${t.title} (${fmtDur(t.segments.filter((s) => dayOfAbs(s.start) === d && s.kind !== "break").reduce((x, s) => x + s.end - s.start, 0))})`),
          free_minutes_before_wind_down: usableMinutes(busy, a, b),
        };
      }),
      cram_mode: {
        plan_status: !cram.active ? "off" : cramPlan({ cram, events, tasks, settings, nowAbs }).sig === cram.appliedSig ? "on, up to date" : "on, out of date",
        exams: (cram.exams || []).map((e) => ({ id: e.id, name: e.name, when: e.when, cooked_1_to_5: e.cooked,
          study_planned: fmtDur(tasks.filter((t) => t.study && t.examId === e.id && t.fits).reduce((x, t) => x + t.total, 0)) })),
      },
      grades: grades.classes.map((c) => {
        const g = gradeSummary(c);
        return g && { class: c.name, target: c.target, average_so_far: g.current == null ? null : Math.round(g.current),
          needed_on_rest_for_target: Math.round(g.targetNeed), share_of_grade_left: Math.round(g.pending), verdict: g.verdict };
      }).filter(Boolean),
      settings: { wind_down: settings.windDown, max_task_hours_per_day: settings.dailyCapH },
    };
  };
  // Re-plan every unfinished flexible task from scratch around the fixed events.
  const optimize = () => {
    const doneSegs = tasks.filter(isDone).flatMap((t) => t.segments);
    const doneHw = tasks.filter((t) => isDone(t) && !t.study).flatMap((t) => t.segments);
    const plan = planAll(tasks.filter((t) => !isDone(t)), [...fixedBusy, ...doneSegs.map((s) => [s.start, s.end])], windows,
      { dailyCap, capLeft: capLeftFrom(doneHw, hwCap), cram: cramOpt });
    setTasks((ts) => ts.map((t) => (plan[t.id] ? { ...t, ...plan[t.id] } : t)));
  };

  /* While Cram mode is on, a change to your fixed events re-runs the Cram plan (same as hitting Apply there):
     busy days lose study time, lighter days pick it up, homework is re-planned around it. */
  const replanCram = (nextEvents, what) => applyCram(cram, nextEvents, what);
  const changeEvents = (next, what) => (cram.active ? replanCram(next, what) : setEvents(next));
  const dayName = (date) => (date === now.today ? "today" : fmtDate(date, { weekday: "short", month: "short", day: "numeric" }));
  const addEvent = (ev) => changeEvents([...events, ev], `Added ${ev.title} (${dayName(ev.date)})`);
  const deleteEvent = (id) => {
    const ev = events.find((e) => e.id === id);
    if (!ev) return;
    if (ev.cramExamId) {
      return setCramMsg({ at: Date.now(), what: `${ev.title} comes from Cram mode`, note: "Remove or move the exam there.", moved: [], missing: 0 });
    }
    changeEvents(events.filter((e) => e.id !== id), `Removed ${ev.title} (${dayName(ev.date)})`);
  };
  useEffect(() => {
    if (!cramMsg) return;
    const t = setTimeout(() => setCramMsg(null), 12000);
    return () => clearTimeout(t);
  }, [cramMsg]);

  /* ----- Calendar navigation ----- */
  const dates = view === "day" ? [anchor] : view === "week" ? Array.from({ length: 7 }, (_, i) => addDays(weekStart(anchor), i)) : [];
  const step = (dir) => setAnchor((a) => (view === "day" ? addDays(a, dir) : view === "week" ? addDays(a, 7 * dir) : addMonths(a, dir)));
  const openDay = (d) => { setAnchor(d); updateSettings({ view: "day" }); };

  /* ----- "Right now" tunnel vision: only the current block, a live countdown, and what's next ----- */
  const focus = !!settings.focusMode;
  const setFocus = (on) => { updateSettings({ focusMode: on }); window.scrollTo(0, 0); };
  useEffect(() => {
    document.body.classList.toggle("tunnel", focus); // hides the feature rail too
    const onOpen = (e) => { if (e.detail === "focus") setFocus(true); };
    window.addEventListener("rc:open", onOpen);
    return () => window.removeEventListener("rc:open", onOpen);
  }, [focus]);
  // Finished early: cut the task at "now" (time already spent stays on the calendar), free the rest, tick off its to-do.
  const finishNow = (t) => {
    const n = Math.floor(preciseNow());
    setTasks((ts) => ts.flatMap((x) => {
      if (x.id !== t.id) return [x];
      const segs = x.segments.filter((s) => s.start < n).map((s) => (s.end > n ? { ...s, end: n } : s)).filter((s) => s.end > s.start);
      while (segs.length && segs[segs.length - 1].kind === "break") segs.pop();
      return segs.length ? [{ ...x, segments: segs, doneEarly: true }] : [];
    }));
    if (t.todoId) setTodos((ts) => ts.map((td) => (td.id === t.todoId ? { ...td, done: true } : td)));
  };
  const title = view === "day"
    ? fmtDate(anchor, { weekday: "long", month: "long", day: "numeric", year: "numeric" })
    : view === "week"
      ? `${fmtDate(dates[0], { month: "short", day: "numeric" })} – ${fmtDate(dates[6], { month: "short", day: "numeric", year: "numeric" })}`
      : fmtDate(anchor, { month: "long", year: "numeric" });

  /* ----- Zoom: buttons, slider, and ctrl/⌘ + scroll or trackpad pinch, anchored so the spot you're looking at stays put ----- */
  const scrollRef = useRef(null), bodyRef = useRef(null), anchorRef = useRef(null), hourPxRef = useRef(hourPx);
  hourPxRef.current = hourPx;
  const zoomTo = (next, offsetY) => {
    next = clamp(Math.round(next), ZOOM_MIN, ZOOM_MAX);
    const el = scrollRef.current, body = bodyRef.current;
    if (el && body) {
      const oy = offsetY ?? el.clientHeight / 2;
      anchorRef.current = { min: (el.scrollTop + oy - body.offsetTop) / (hourPxRef.current / 60), oy };
    }
    updateSettings({ hourPx: next });
  };
  const zoomToRef = useRef(zoomTo); zoomToRef.current = zoomTo;
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return; // plain scrolling still scrolls
      e.preventDefault();
      const factor = Math.exp(-clamp(e.deltaY, -40, 40) * 0.01);
      zoomToRef.current(hourPxRef.current * factor, e.clientY - el.getBoundingClientRect().top);
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [view]);
  useLayoutEffect(() => {
    const a = anchorRef.current, el = scrollRef.current, body = bodyRef.current;
    if (!a || !el || !body) return;
    el.scrollTop = a.min * (hourPx / 60) + body.offsetTop - a.oy;
    anchorRef.current = null;
  }, [hourPx]);
  // Jump to "now" (or the top of the day) when the view or range changes.
  const rangeKey = view + ":" + (dates[0] || anchor);
  useLayoutEffect(() => {
    const el = scrollRef.current, body = bodyRef.current;
    if (!el || !body) return;
    el.scrollTop = dates.includes(now.today) ? Math.max(0, (now.min - DAY_START - 60) * (hourPx / 60)) : 0;
  }, [rangeKey]);

  useEffect(() => {
    if (!confirmClear) return;
    const t = setTimeout(() => setConfirmClear(false), 3000);
    return () => clearTimeout(t);
  }, [confirmClear]);

  const todayLabel = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <h1>Reality<span>Check</span></h1>
          <p>How long will this <em>actually</em> take me, and what's left of my week?</p>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <button className={"btn rn-toggle" + (focus ? " on" : "")} type="button" aria-pressed={focus} onClick={() => setFocus(!focus)}
            title="Hide everything except what you should be doing right now">{focus ? "◉ Right now: on" : "◎ Right now"}</button>
          {!focus && <a className="btn ghost grades-link" href="grades.html">Grade check</a>}
          {!focus && <a className="btn cram-link" href="cram.html">Cram mode{cram.active ? " · on" : ""} →</a>}
          <div className="date-pill">{todayLabel}</div>
        </div>
      </header>

      {focus ? (
        <RightNow tasks={tasks} events={events} windDown={windDown} todayN={todayN} onDone={finishNow} onExit={() => setFocus(false)} />
      ) : (
      <div className="layout">
        <aside className="stack">
          <DayStats events={events} tasks={tasks} date={view === "day" ? anchor : now.today} now={now} />
          <Pomodoro tasks={tasks} nowAbs={nowAbs} />
          <AddEventForm onAdd={addEvent} draft={draft} defaultDate={view === "day" ? anchor : now.today} />
          <TaskEstimator onAdd={addTask} todayN={todayN} lookahead={lookahead} />
          <TaskList tasks={tasks} cram={cram} absEvents={absEvents} nowAbs={nowAbs} todayN={todayN}
            settings={{ ...settings, lookahead: settings.lookahead, dailyCapH: settings.dailyCapH }} onSettings={updateSettings}
            onOptimize={cram.active ? () => replanCram(events, "Re-planned with Cram mode") : optimize} onRemove={(id) => setTasks((ts) => ts.filter((t) => t.id !== id))} onJump={openDay} />
        </aside>

        <div className="stack" style={{ minWidth: 0 }}>
        <section className="card tl-card" id="f-calendar">
          <div className="tl-head">
            <div className="cal-nav">
              <button className="btn ghost small" onClick={() => setAnchor(now.today)}>Today</button>
              <button className="icon-btn" aria-label="Previous" onClick={() => step(-1)}>‹</button>
              <button className="icon-btn" aria-label="Next" onClick={() => step(1)}>›</button>
              <h2 className="cal-title">{title}</h2>
            </div>
            <div className="cal-tools">
              <div className="seg-ctrl" role="group" aria-label="View">
                {["day", "week", "month"].map((v) => (
                  <button key={v} type="button" aria-pressed={view === v} onClick={() => updateSettings({ view: v })}>
                    {v[0].toUpperCase() + v.slice(1)}
                  </button>
                ))}
              </div>
              <input className="jump" type="date" aria-label="Jump to date" value={anchor}
                onChange={(e) => isDateKey(e.target.value) && setAnchor(e.target.value)} />
            </div>
          </div>
          <div className="tl-sub">
            <div className="legend">
              <span><i style={{ background: COLORS[0].edge }} />fixed event</span>
              <span><i style={{ background: "repeating-linear-gradient(135deg, #4a72c4 0 2px, #e6eefb 2px 4px)" }} />planned task</span>
              <span><i style={{ background: "var(--accent)" }} />now / drop-dead</span>
            </div>
            {view !== "month" && (
              <div className="zoom" title="Tip: hold Ctrl/⌘ and scroll, or pinch on a trackpad">
                <span>Zoom</span>
                <button className="icon-btn" aria-label="Zoom out" disabled={hourPx <= ZOOM_MIN} onClick={() => zoomTo(hourPx / 1.25)}>−</button>
                <input type="range" min={ZOOM_MIN} max={ZOOM_MAX} value={hourPx} aria-label="Zoom" onChange={(e) => zoomTo(Number(e.target.value))} />
                <button className="icon-btn" aria-label="Zoom in" disabled={hourPx >= ZOOM_MAX} onClick={() => zoomTo(hourPx * 1.25)}>+</button>
                <button className="linkbtn" type="button" onClick={() => zoomTo(ZOOM_DEFAULT)}>reset</button>
              </div>
            )}
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn ghost small" onClick={() => changeEvents([...events.filter((e) => e.date !== now.today), ...sampleFor(now.today)], "Loaded the sample day")}>Load sample day</button>
              <button className="btn ghost small" onClick={() => (confirmClear ? (setEvents([]), setTasks([]), setConfirmClear(false)) : setConfirmClear(true))}>
                {confirmClear ? "Click again to clear everything" : "Clear all"}
              </button>
            </div>
          </div>
          {view === "month" ? (
            <MonthGrid anchor={anchor} events={events} tasks={tasks} today={now.today} onOpenDay={openDay} />
          ) : (
            <TimeGrid dates={dates} now={now} hourPx={hourPx} windDown={windDown} events={events} tasks={tasks} nowAbs={nowAbs}
              scrollRef={scrollRef} bodyRef={bodyRef}
              onDelete={deleteEvent}
              onOpenDay={openDay}
              onPickSlot={(date, m) => setDraft({ date, m, at: Date.now() /* new object so clicking the same slot re-fills */ })}
              expanded={!!settings.calExpanded} />
          )}
          {view !== "month" && (
            <button className="expand-bar" type="button" aria-expanded={!!settings.calExpanded}
              onClick={() => updateSettings({ calExpanded: !settings.calExpanded })}>
              {settings.calExpanded ? "▴ Collapse calendar" : "▾ Expand calendar (show the whole day)"}
            </button>
          )}
        </section>
        <TodoPanel todos={todos} setTodos={setTodos} tasks={tasks} nowAbs={nowAbs} todayN={todayN}
          onSchedule={scheduleTodos} onUnschedule={(id) => setTasks((ts) => ts.filter((t) => t.id !== id))} onJump={openDay}
          onImport={importItems} onSetCooked={setCooked} onApplyCram={() => applyCram(cram, events, cram.active ? "Updated Cram mode" : "Turned on Cram mode")}
          cram={cram} snapshot={snapshot} />
        </div>
      </div>
      )}
      {cramMsg && (
        <div className="toast" role="status">
          <div>
            <b>{cramMsg.what}.</b>{" "}
            {cramMsg.note || (cramMsg.moved.length ? `Cram plan updated: ${cramMsg.moved.join(", ")}.` : "Cram plan checked: study time didn't need to move.")}
            {cramMsg.link && <> <a href="cram.html">Open Cram mode →</a></>}
            {cramMsg.action && <> <button className="toast-btn" type="button" onClick={() => { cramMsg.action.run(cram, events); }}>{cramMsg.action.label}</button></>}
            {cramMsg.missing > 0 && <span className="warn"> {fmtDur(cramMsg.missing)} of study no longer fits. <a href="cram.html">Fix it in Cram mode →</a></span>}
          </div>
          <button className="x" aria-label="Dismiss" onClick={() => setCramMsg(null)}>×</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

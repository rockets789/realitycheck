  /* Month */

  .month-inner { min-width: 560px; }
  .month-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 6px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(104px, auto); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }

<div id="root"></div>

<!-- Shared estimation + scheduling + cram engine (also used by cram.html) -->
<script src="engine.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useMemo, useRef } = React;

/* ---------- Config (DAY_START, DAY_END, COLORS, storage keys + date/time helpers live in engine.js) ---------- */
const ZOOM_MIN = 32, ZOOM_MAX = 200, ZOOM_DEFAULT = 64;  // pixels per hour
const SAMPLE_DAY = [
  { title: "CS 251 Lecture", start: 10 * 60 + 30, end: 11 * 60 + 45, color: 0 },
  { title: "Lunch with Priya", start: 12 * 60 + 30, end: 13 * 60 + 30, color: 3 },
  { title: "Team standup", start: 15 * 60, end: 15 * 60 + 30, color: 1 },
  { title: "Gym", start: 18 * 60, end: 19 * 60, color: 2 },
];

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
// Cram study blocks use their exam's color instead of the default task blue.
const studyStyle = (s) => {
  if (s.color == null || s.kind === "break") return null;
  const c = COLORS[s.color] || COLORS[0];
  return { borderColor: c.edge, background: `repeating-linear-gradient(135deg, ${c.bg} 0 6px, #fffdf8 6px 12px)` };
};
const KIND_LABEL = { setup: "Setup", deep: "Deep work", break: "Break", buffer: "Buffer" };

/* ---------- Storage ---------- */
function useStoredState(key, fallback, migrate) {
  const [value, setValue] = useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      if (Array.isArray(fallback)) { if (Array.isArray(v)) return migrate ? migrate(v) : v; }
      else if (v && typeof v === "object") return { ...fallback, ...v };
    } catch (e) {}
    return fallback;
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }, [key, value]);
  // Another tab (e.g. Cram mode) changed it: pick up the new value.
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== key || e.newValue == null) return;
      try { const v = JSON.parse(e.newValue); setValue(Array.isArray(fallback) ? (migrate ? migrate(v) : v) : { ...fallback, ...v }); } catch (err) {}
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [key]);
  return [value, setValue];
}

const sampleFor = (date) => SAMPLE_DAY.map((e) => ({ ...e, id: newId(), date }));

function useNow() {
  const get = () => { const d = new Date(); return { today: dateKey(d), min: d.getHours() * 60 + d.getMinutes() }; };
  const [now, setNow] = useState(get);
  useEffect(() => { const t = setInterval(() => setNow(get()), 30000); return () => clearInterval(t); }, []);
  return now;
}

/* ---------- Layout: put overlapping events side by side ---------- */
function layoutLanes(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || b.end - a.end);
  const out = [];
  let cluster = [], lanes = [], clusterEnd = -1;
  const flush = () => {
    cluster.forEach((c) => (c.laneCount = lanes.length));
    out.push(...cluster);
    cluster = []; lanes = []; clusterEnd = -1;
  };
  for (const ev of sorted) {
    if (cluster.length && ev.start >= clusterEnd) flush();
    let lane = lanes.findIndex((end) => end <= ev.start);
    if (lane === -1) { lane = lanes.length; lanes.push(ev.end); } else lanes[lane] = ev.end;
    cluster.push({ ...ev, lane });
    clusterEnd = Math.max(clusterEnd, ev.end);
  }
  if (cluster.length) flush();
  return out;
}

const clashWith = (t, absEvents) => absEvents.find((e) => (t.segments || []).some((s) => s.kind !== "break" && overlaps(s, e)));

/* Minutes inside [from, DAY_END] covered by at least one event */
function bookedMinutes(events, from) {
  const ranges = events
    .map((e) => [Math.max(e.start, from), Math.min(e.end, DAY_END)])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);
  let total = 0, curS = null, curE = null;
  for (const [s, e] of ranges) {
    if (curE === null || s > curE) { if (curE !== null) total += curE - curS; curS = s; curE = e; }
    else curE = Math.max(curE, e);
  }
  if (curE !== null) total += curE - curS;
  return total;
}

/* Task segments that fall on a given day, in that day's local minutes */
function segmentsOnDay(tasks, n) {
  const out = [];
  tasks.forEach((t) => {
    if (!t.fits) return;
    t.segments.forEach((s, i) => {
      if (dayOfAbs(s.start) !== n) return;
      out.push({ ...s, ls: s.start - n * DAY_MIN, le: s.end - n * DAY_MIN, taskId: t.id, title: t.title, i, color: t.study ? t.color : null,
        sessionStart: i === 0 || t.segments[i - 1].end !== s.start });
    });
  });
  return out;
}

/* ---------- Components ---------- */
function AddEventForm({ onAdd, draft, defaultDate }) {
  const [title, setTitle] = useState("");
  const [date, setDate] = useState(defaultDate);
  const [start, setStart] = useState("14:00");
  const [end, setEnd] = useState("15:00");
  const [color, setColor] = useState(0);
  const [error, setError] = useState("");

  useEffect(() => setDate(defaultDate), [defaultDate]);
  // When the user clicks an empty spot on the calendar, prefill the form
  useEffect(() => {
    if (draft == null) return;
    setDate(draft.date);
    setStart(toHHMM(draft.m));
    setEnd(toHHMM(Math.min(draft.m + 60, DAY_END)));
    document.getElementById("ev-title")?.focus();
  }, [draft]);

  const submit = (e) => {
    e.preventDefault();
    const s = toMin(start), en = toMin(end);
    if (!title.trim()) return setError("Give the event a name.");
    if (!isDateKey(date)) return setError("Pick a date.");
    if (en <= s) return setError("End time has to be after the start time.");
    if (en <= DAY_START || s >= DAY_END) return setError("The calendar runs 9:00 AM – 11:00 PM.");
    onAdd({ id: newId(), title: title.trim(), date, start: s, end: en, color });
    setTitle(""); setError("");
  };

  return (
    <form className="card" onSubmit={submit}>
      <h2>Fixed events</h2>
      <p className="sub">Things already on your calendar: classes, meals, shifts. Any day, as far ahead as you like. Tip: click an empty spot on the calendar.</p>
      <div className="stack" style={{ gap: 12 }}>
        <label className="field">What
          <input id="ev-title" type="text" placeholder="e.g. Office hours" value={title} onChange={(e) => setTitle(e.target.value)} />
        </label>
        <label className="field">Date
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>
        <div className="row">
          <label className="field">Starts<input type="time" value={start} step="300" onChange={(e) => setStart(e.target.value)} /></label>
          <label className="field">Ends<input type="time" value={end} step="300" onChange={(e) => setEnd(e.target.value)} /></label>
        </div>
        <div className="swatches" role="group" aria-label="Color">
          {COLORS.map((c, i) => (
            <button key={i} type="button" className="swatch" aria-pressed={color === i} aria-label={`Color ${i + 1}`}
              style={{ background: c.edge }} onClick={() => setColor(i)} />
          ))}
        </div>
        {error && <p className="error">{error}</p>}
        <button className="btn" type="submit">Add to calendar</button>
      </div>
    </form>
  );
}

function Slider({ name, value, onChange, low, high }) {
  return (
    <div className="slider">
      <span className="name">{name}</span>
      <span className="val">{value}/5</span>
      <input type="range" min="1" max="5" step="1" value={value} onChange={(e) => onChange(Number(e.target.value))} aria-label={name} />
      <div className="ends"><span>{low}</span><span>{high}</span></div>
    </div>
  );
}

const PHASE_COLORS = { setup: "#c9932b", deep: "#4a72c4", buffer: "#cfc6b6" };

function RealityResult({ guess, result, onAdd, added }) {
  const max = Math.max(...result.phases.map((p) => p.minutes));
  const extra = result.total - guess;
  return (
    <div className="result" aria-live="polite">
      <p className="headline">
        You said <b>{fmtDur(guess)}</b> → Reality: <b className="reality">{fmtDur(result.total)}</b>
      </p>
      <p className="extra">
        {extra > 0 ? `+${fmtDur(extra)} you weren't counting (${Math.round((result.total / guess - 1) * 100)}% more).` : "Your guess holds up."}
      </p>
      <div className="phase-stack" aria-hidden="true">
        {result.phases.map((p) => <div key={p.key} style={{ flex: p.minutes, background: PHASE_COLORS[p.key] }} />)}
      </div>
      {result.phases.map((p) => (
        <div className="phase-row" key={p.key}>
          <div className="top"><span>{p.label}</span><span className="mono">{fmtDur(p.minutes)}</span></div>
          <div className="bar">
            {p.parts ? (
              <>
                <i style={{ width: `${(p.parts.guess / max) * 100}%`, background: PHASE_COLORS.deep }} title="Your guess" />
                <i style={{ width: `${(p.parts.fatigue / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.6 }} title="Fatigue" />
                <i style={{ width: `${(p.parts.distraction / max) * 100}%`, background: PHASE_COLORS.deep, opacity: 0.35 }} title="Distraction tax" />
              </>
            ) : (
              <i style={{ width: `${(p.minutes / max) * 100}%`, background: PHASE_COLORS[p.key] }} />
            )}
          </div>
          <p>{p.why}</p>
        </div>
      ))}
      <button className="btn" type="button" style={{ width: "100%" }} disabled={!!added} onClick={onAdd}>
        Add the real {fmtDur(result.total)} to my calendar
      </button>
      {added && <p className={"added" + (added.fits ? "" : " warn")}>{added.text}</p>}
    </div>
  );
}

function TaskEstimator({ onAdd, todayN, lookahead }) {
  const [task, setTask] = useState({ name: "", guess: 60, energy: 3, distraction: 3, dread: 3, deadline: "" });
  const [checked, setChecked] = useState(false);
  const [added, setAdded] = useState(null);
  useEffect(() => setAdded(null), [task]); // editing the task clears the "added" note
  const set = (k) => (v) => setTask((t) => ({ ...t, [k]: v }));
  const guessOk = Number.isFinite(task.guess) && task.guess > 0 && task.guess <= 24 * 60;
  // After the first check the card stays live: moving a slider updates the estimate.
  const result = useMemo(() => (checked && guessOk ? estimate(task) : null),
    [checked, guessOk, task.guess, task.energy, task.distraction, task.dread]);

  const add = () => {
    const [setup, deep, buffer] = result.phases.map((p) => p.minutes);
    const t = onAdd({
      title: task.name.trim() || "Untitled task", guess: task.guess, energy: task.energy,
      distraction: task.distraction, dread: task.dread, deadline: absFromLocal(task.deadline),
      total: result.total, setup, deep, buffer,
    });
    const n = countSessions(t.segments);
    setAdded(t.fits
      ? { fits: true, text: `Added: ${fmtWhen(t.segments[0].start, todayN)} – ${fmtWhen(t.segments[t.segments.length - 1].end, todayN)}${n > 1 ? ` across ${n} sessions` : ""}.` }
      : { fits: false, text: `No room in the next ${lookahead} days. It's listed under Flexible tasks.` });
  };

  return (
    <div className="card">
      <h2>Reality check a task</h2>
      <p className="sub">Your guess, then the honest version.</p>
      <div className="stack" style={{ gap: 14 }}>
        <label className="field">Task
          <input type="text" placeholder="e.g. Finish stats problem set" value={task.name} onChange={(e) => set("name")(e.target.value)} />
        </label>
        <label className="field">Your guess (min)
          <input type="number" min="5" step="5" value={task.guess} onChange={(e) => set("guess")(Number(e.target.value))} />
        </label>
        <label className="field">Deadline (optional, any day)
          <input type="datetime-local" value={task.deadline} onChange={(e) => set("deadline")(e.target.value)} />
        </label>
        <Slider name="Current energy" value={task.energy} onChange={set("energy")} low="running on fumes" high="fully charged" />
        <Slider name="Distraction level" value={task.distraction} onChange={set("distraction")} low="phone in another room" high="group chat is popping" />
        <Slider name="Task dread / friction" value={task.dread} onChange={set("dread")} low="kind of fun" high="I'd rather do laundry" />
        {!guessOk && <p className="error">Enter a guess between 1 and 1440 minutes.</p>}
        <button className="btn" type="button" disabled={!guessOk} onClick={() => setChecked(true)}>
          How long will this actually take? →
        </button>
        {result && <RealityResult guess={task.guess} result={result} added={added} onAdd={add} />}
      </div>
    </div>
  );
}

function TaskList({ tasks: allTasks, cram, absEvents, nowAbs, todayN, settings, onSettings, onOptimize, onRemove, onJump }) {
  const tasks = allTasks.filter((t) => !t.study);
  const study = allTasks.filter((t) => t.study);
  const unfit = tasks.filter((t) => !t.fits);
  const clashing = tasks.filter((t) => t.fits && clashWith(t, absEvents));
  return (
    <div className="card">
      <h2>Flexible tasks</h2>
      <p className="sub">Reality-checked tasks the planner can move around your fixed events, across days.</p>
      <div className="stack" style={{ gap: 12 }}>
        {cram.active && (
          <p className="cram-note">
            <b>Cram mode is on.</b> {study.filter((t) => t.fits).length} study sessions for {(cram.exams || []).length} exams
            {cram.effort < 1 ? `, homework trimmed to ${Math.round(cram.effort * 100)}%` : ""}
            {study.some((t) => !t.fits) ? `, ${study.filter((t) => !t.fits).length} sessions didn't fit` : ""}. <a href="cram.html">Adjust in Cram mode →</a>
          </p>
        )}
        {tasks.length === 0 && <p className="empty">Nothing yet. Run a reality check, then add it to your calendar.</p>}
        {unfit.length > 0 && (
          <p className="banner">No room in the next {settings.lookahead} days for {unfit.map((t) => t.title).join(", ")}. Look further ahead, raise the daily max, or move wind-down later.</p>
        )}
        {clashing.length > 0 && (
          <p className="banner">A fixed event now clashes with {clashing.map((t) => t.title).join(", ")}. Optimize to re-plan.</p>
        )}
        {tasks.length > 0 && (
          <ul className="task-list">
            {tasks.map((t) => {
              const st = deadlineStatus(t, nowAbs);
              const segs = t.segments || [];
              const n = countSessions(segs);
              const done = t.fits && segs[segs.length - 1].end <= nowAbs;
              return (
                <li key={t.id} className={"task-item" + (t.fits ? "" : " unfit") + (done ? " done" : "")}>
                  <div className="top">
                    <button type="button" className="ti-title" disabled={!t.fits} title={t.fits ? "Show on calendar" : undefined}
                      onClick={() => onJump(keyOf(dayOfAbs(segs[0].start)))}>{t.title}</button>
                    <span className="mono">{fmtDur(t.total)}</span>
                    <button className="x" aria-label={`Remove ${t.title}`} onClick={() => onRemove(t.id)}>×</button>
                  </div>
                  <div className="meta">
                    {t.fits
                      ? `${done ? "Done · " : ""}${fmtWhen(segs[0].start, todayN)} – ${fmtWhen(segs[segs.length - 1].end, todayN)}${n > 1 ? ` · ${n} sessions` : ""}`
                      : "Doesn't fit yet"}
                    {` · you guessed ${fmtDur(t.guess)}`}
                  </div>
                  {st && !done && (
                    <div className={"meta" + (st.passed || st.late ? " warn" : "")}>
                      Due {fmtWhen(t.deadline, todayN)} · {st.passed ? `drop-dead start (${fmtWhen(st.dropDead, todayN)}) has passed` : `start by ${fmtWhen(st.dropDead, todayN)}`}
                      {st.late ? ` · finishes ${fmtDur(st.late)} late` : ""}
                    </div>
                  )}
                </li>
              );
            })}
          </ul>
        )}
        <div className="row">
          <label className="field">Wind down at
            <input type="time" value={settings.windDown} onChange={(e) => onSettings({ windDown: e.target.value })} />
          </label>
          <label className="field">Max task time / day (h)
            <input type="number" min="0" max="14" step="0.5" value={settings.dailyCapH}
              onChange={(e) => onSettings({ dailyCapH: e.target.value === "" ? "" : Number(e.target.value) })} />
          </label>
        </div>
        <div className="row">
          <label className="field">Look ahead (days)
            <input type="number" min="1" max="60" value={settings.lookahead}
              onChange={(e) => onSettings({ lookahead: e.target.value === "" ? "" : Number(e.target.value) })} />
          </label>
          <label className="field">Plan from
            <input type="datetime-local" value={settings.planFrom} onChange={(e) => onSettings({ planFrom: e.target.value })} />
          </label>
        </div>
        {settings.planFrom
          ? <button className="linkbtn" type="button" onClick={() => onSettings({ planFrom: "" })}>Plan from now instead</button>
          : <p className="note" style={{ margin: 0 }}>Leave "Plan from" empty to plan from right now. Max 0 = no daily limit.</p>}
        <button className="btn" type="button" disabled={allTasks.length === 0} onClick={onOptimize}>Optimize my schedule</button>
        <p className="note" style={{ margin: 0 }}>
          Earliest deadline first, then the task you're dreading most. 10 min of breathing room around everything,
          deep work in sessions of 50 min or less with 10 min breaks, a daily cap on task time, nothing after wind-down.
          Finished tasks stay put.
        </p>
      </div>
    </div>
  );
}

function DayStats({ events, tasks, date, now }) {
  const isToday = date === now.today;
  const from = isToday ? clamp(now.min, DAY_START, DAY_END) : date < now.today ? DAY_END : DAY_START;
  const dayEvents = events.filter((e) => e.date === date);
  // Planned task time counts as booked; breaks between sessions are still yours.
  const taskBlocks = segmentsOnDay(tasks, dayNum(date)).filter((s) => s.kind !== "break").map((s) => ({ start: s.ls, end: s.le }));
  const booked = bookedMinutes([...dayEvents, ...taskBlocks], from);
  const free = Math.max(DAY_END - from - booked, 0);
  return (
    <div className="card">
      <p className="stats-day">{isToday ? "Today" : fmtDate(date, { weekday: "long", month: "short", day: "numeric" })}</p>
      <div className="stats">
        <div className="stat"><b>{dayEvents.length}</b><span>events</span></div>
        <div className="stat"><b>{fmtDur(booked)}</b><span>{isToday ? "booked from now" : "booked"}</span></div>
        <div className="stat life"><b>{fmtDur(free)}</b><span>still yours</span></div>
      </div>
    </div>
  );
}

function DayColumn({ date, isToday, isPast, now, pxPerMin, windDown, events, segs, deadlines, onDelete, onPickSlot }) {
  const y = (m) => (clamp(m, DAY_START, DAY_END) - DAY_START) * pxPerMin;
  const laid = useMemo(() => layoutLanes(events), [events]);
  const conflicts = useMemo(() => {
    const ids = new Set();
    events.forEach((a, i) => events.slice(i + 1).forEach((b) => { if (overlaps(a, b)) { ids.add(a.id); ids.add(b.id); } }));
    return ids;
  }, [events]);
  const hourPx = pxPerMin * 60;

  return (
    <div className={"col" + (isToday ? " today" : "")} style={{ backgroundSize: `100% ${hourPx}px, 100% ${hourPx / 2}px` }}
      onClick={(e) => {
        if (e.target !== e.currentTarget) return; // only empty space, not events
        const m = DAY_START + Math.floor(e.nativeEvent.offsetY / pxPerMin / 30) * 30;
        if (m < DAY_END) onPickSlot(date, m);
      }}>
      {(isPast || (isToday && now.min > DAY_START)) && (
        <div className="past-shade" style={{ height: isPast ? "100%" : y(now.min) }} />
      )}

      {laid.map((ev) => {
        const top = y(ev.start), bottom = y(ev.end);
        if (bottom - top <= 0) return null;
        const c = COLORS[ev.color] || COLORS[0];
        const widthPct = 100 / ev.laneCount;
        const short = bottom - top < 40;
        return (
          <div key={ev.id} className={"event" + (conflicts.has(ev.id) ? " conflict" : "")}
            title={`${ev.title} · ${fmt(ev.start)} – ${fmt(ev.end)}`}
            style={{
              top: top + 1, height: bottom - top - 2,
              left: `calc(${widthPct * ev.lane}% + 2px)`, width: `calc(${widthPct}% - 4px)`,
              background: c.bg, borderLeftColor: c.edge,
            }}>
            <div className="t">
              {ev.title}
              {conflicts.has(ev.id) && <span className="conflict-badge">overlap</span>}
            </div>
            {!short && <div className="time">{fmt(ev.start)} – {fmt(ev.end)}</div>}
            <button className="del" aria-label={`Delete ${ev.title}`} onClick={() => onDelete(ev.id)}>×</button>
          </div>
        );
      })}

      {windDown < DAY_END && (
        <div className="winddown" style={{ top: y(windDown) }}><span>wind-down</span></div>
      )}

      {segs.map((s) => {
        const top = y(s.ls), h = y(s.le) - top;
        if (h <= 0) return null;
        const clash = s.kind !== "break" && events.some((e) => overlaps({ start: s.ls, end: s.le }, e));
        return (
          <div key={s.taskId + ":" + s.i} className={`tseg ${s.kind}` + (clash ? " conflict" : "")}
            style={{ top: top + 1, height: Math.max(h - 2, 3), ...studyStyle(s) }}
            title={`${s.title} · ${KIND_LABEL[s.kind]} · ${fmt(s.ls)} – ${fmt(s.le)}`}>
            {h >= 13 && (
              <span className="tseg-label">
                {s.sessionStart && <b>{s.title} · </b>}
                {KIND_LABEL[s.kind]}{h >= 24 ? ` ${fmtDur(s.le - s.ls)}` : ""}
              </span>
            )}
          </div>
        );
      })}

      {deadlines.map((d) => (
        <div key={"dd" + d.id} className="deadline-line" style={{ top: y(d.m) }}>
          <span><b>{d.passed ? "passed: " : ""}start {d.title} by {fmt(d.m)}</b></span>
        </div>
      ))}

      {isToday && now.min >= DAY_START && now.min <= DAY_END && (
        <div className="now-line" style={{ top: y(now.min) }}><span>now · {fmt(now.min)}</span></div>
      )}
    </div>
  );
}

function TimeGrid({ dates, now, hourPx, windDown, events, tasks, nowAbs, scrollRef, bodyRef, onDelete, onPickSlot, onOpenDay }) {
  const pxPerMin = hourPx / 60;
  const height = (DAY_END - DAY_START) * pxPerMin;
  const multi = dates.length > 1;
  const byDate = useMemo(() => {
    const m = {};
    events.forEach((e) => { (m[e.date] = m[e.date] || []).push(e); });
    return m;
  }, [events]);
  const hours = [];
  for (let m = DAY_START; m <= DAY_END; m += 60) hours.push(m);
  const cols = `56px repeat(${dates.length}, minmax(0, 1fr))`;
  const empty = !dates.some((d) => (byDate[d] || []).length) && !dates.some((d) => segmentsOnDay(tasks, dayNum(d)).length);

  return (
    <div className={"tl-scroll" + (multi ? " compact" : "")} ref={scrollRef}>
      <div style={{ minWidth: multi ? 56 + dates.length * 96 : undefined, position: "relative" }}>
        <div className="day-heads" style={{ gridTemplateColumns: cols }}>
          <div />
          {dates.map((d) => (
            <button key={d} type="button" className={"day-head" + (d === now.today ? " today" : "")}
              onClick={() => onOpenDay(d)} title={multi ? "Open this day" : undefined}>
              {fmtDate(d, { weekday: "short" })}<b>{Number(d.slice(8))}</b>
            </button>
          ))}
        </div>
        <div className="grid-body" ref={bodyRef} style={{ gridTemplateColumns: cols, height }}>
          <div className="gutter">
            {hours.map((m) => (
              <span key={m} className="hour-label" style={{ top: (m - DAY_START) * pxPerMin - 8 }}>{fmt(m).replace(":00", "")}</span>
            ))}
          </div>
          {dates.map((d) => {
            const n = dayNum(d);
            const deadlines = tasks.map((t) => {
              const st = deadlineStatus(t, nowAbs);
              if (!st || dayOfAbs(st.dropDead) !== n) return null;
              const m = st.dropDead - n * DAY_MIN;
              return m >= DAY_START && m <= DAY_END ? { id: t.id, title: t.title, m, passed: st.passed } : null;
            }).filter(Boolean);
            return (
              <DayColumn key={d} date={d} isToday={d === now.today} isPast={d < now.today} now={now}
                pxPerMin={pxPerMin} windDown={windDown} events={byDate[d] || []} segs={segmentsOnDay(tasks, n)}
                deadlines={deadlines} onDelete={onDelete} onPickSlot={onPickSlot} />
            );
          })}
        </div>
        {empty && <div className="empty-hint" style={{ top: 90 }}>Nothing planned{multi ? " this week" : " this day"}. Add a fixed event, or click a time slot.</div>}
      </div>
    </div>
  );
}

function MonthGrid({ anchor, events, tasks, today, onOpenDay }) {
  const first = monthStart(anchor);
  const start = weekStart(first);
  const daysInMonth = dayNum(addMonths(first, 1)) - dayNum(first);
  const cells = Math.ceil((weekday(first) + daysInMonth) / 7) * 7;
  const byDate = useMemo(() => {
    const m = {};
    events.forEach((e) => { (m[e.date] = m[e.date] || []).push({ kind: "event", start: e.start, title: e.title, color: e.color, id: e.id }); });
    tasks.forEach((t) => {
      if (!t.fits) return;
      const perDay = {};
      t.segments.forEach((s) => {
        if (s.kind === "break") return;
        const d = keyOf(dayOfAbs(s.start));
        perDay[d] = perDay[d] || { start: s.start - dayOfAbs(s.start) * DAY_MIN, min: 0, color: t.study ? t.color : null };
        perDay[d].min += s.end - s.start;
      });
      Object.entries(perDay).forEach(([d, v]) => { (m[d] = m[d] || []).push({ kind: "task", start: v.start, title: t.title, min: v.min, id: t.id, color: v.color }); });
    });
    Object.values(m).forEach((list) => list.sort((a, b) => a.start - b.start));
    return m;
  }, [events, tasks]);

  return (
    <div className="month">
      <div className="month-inner">
        <div className="month-dow">{[0, 1, 2, 3, 4, 5, 6].map((i) => <div key={i}>{fmtDate(addDays(start, i), { weekday: "short" })}</div>)}</div>
        <div className="month-grid">
          {Array.from({ length: cells }, (_, i) => {
            const d = addDays(start, i);
            const items = byDate[d] || [];
            const inMonth = d.slice(0, 7) === first.slice(0, 7);
            return (
              <div key={d} role="button" tabIndex={0} className={"mcell" + (inMonth ? "" : " other") + (d === today ? " today" : "")}
                onClick={() => onOpenDay(d)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpenDay(d); } }}
                aria-label={`${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })}, ${items.length} items`}>
                <span className="num">{Number(d.slice(8))}</span>
                {items.slice(0, 3).map((it) => it.kind === "event" ? (
                  <div key={it.id} className="chip" style={{ background: (COLORS[it.color] || COLORS[0]).bg, borderLeftColor: (COLORS[it.color] || COLORS[0]).edge }}>
                    <span className="mono">{fmt(it.start).replace(":00", "").replace(" ", "").toLowerCase()}</span>{it.title}
                  </div>
                ) : (
                  <div key={it.id} className="chip task" style={it.color != null ? { borderColor: (COLORS[it.color] || COLORS[0]).edge, background: (COLORS[it.color] || COLORS[0]).bg } : null}><span className="mono">{fmtDur(it.min)}</span>{it.title}</div>
                ))}
                {items.length > 3 && <span className="more">+{items.length - 3} more</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [events, setEvents] = useStoredState(STORAGE_KEY, sampleFor(dateKey(new Date())), migrateEvents);
  const [tasks, setTasks] = useStoredState(TASKS_KEY, [], migrateTasks);
  const [settings, setSettings] = useStoredState(SETTINGS_KEY,
    { windDown: "21:00", planFrom: "", lookahead: 7, dailyCapH: 4, hourPx: ZOOM_DEFAULT, view: "week" });
  const [cram] = useStoredState(CRAM_KEY, { active: false, exams: [] });
  const [draft, setDraft] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const now = useNow();
  const [anchor, setAnchor] = useState(now.today);
  const updateSettings = (patch) => setSettings((s) => ({ ...s, ...patch }));

  const view = ["day", "week", "month"].includes(settings.view) ? settings.view : "week";
  const hourPx = clamp(Number(settings.hourPx) || ZOOM_DEFAULT, ZOOM_MIN, ZOOM_MAX);
  const todayN = dayNum(now.today);
  const nowAbs = todayN * DAY_MIN + now.min;
  const windDown = Math.min(timeOr(settings.windDown, 21 * 60), DAY_END);
  const lookahead = clamp(Math.round(Number(settings.lookahead) || 7), 1, 60);
  const dailyCap = Number(settings.dailyCapH) > 0 ? Number(settings.dailyCapH) * 60 : Infinity;
  const planFromAbs = absFromLocal(settings.planFrom) ?? Math.ceil(nowAbs / 5) * 5;

  const absEvents = useMemo(() => events.map(eventAbs), [events]);
  const fixedBusy = absEvents.map((e) => [e.start, e.end]);
  // Look far enough ahead to cover every study session Cram mode pinned to a day.
  const lastPinned = Math.max(0, ...tasks.filter((t) => t.latest != null).map((t) => dayOfAbs(t.latest - 1)));
  const windows = planningWindows(planFromAbs, Math.max(lookahead, lastPinned - dayOfAbs(planFromAbs) + 1), DAY_START, windDown);
  const cramOpt = cram.active ? { hwCapByDay: cram.hwCapByDay || {}, effort: Number(cram.effort) || 1 } : null;
  const hwCap = cramOpt ? (d) => (d in cramOpt.hwCapByDay ? cramOpt.hwCapByDay[d] : dailyCap) : dailyCap;
  const isDone = (t) => t.fits && t.segments.length && t.segments[t.segments.length - 1].end <= nowAbs;

  // Place one new task in the time left over, without moving anything already planned.
  const addTask = (spec) => {
    const segs = tasks.flatMap((t) => t.segments || []);
    const hwSegs = tasks.filter((t) => !t.study).flatMap((t) => t.segments || []);
    const p = placeTask(trimForCram(spec, cramOpt), [...fixedBusy, ...segs.map((s) => [s.start, s.end])], windows,
      { dailyCap: hwCap, capLeft: capLeftFrom(hwSegs, hwCap) });
    const t = { ...spec, id: newId(), ...p };
    setTasks((ts) => [...ts, t]);
    if (t.fits) setAnchor(keyOf(dayOfAbs(t.segments[0].start)));
    return t;
  };
  // Re-plan every unfinished flexible task from scratch around the fixed events.
  const optimize = () => {
    const doneSegs = tasks.filter(isDone).flatMap((t) => t.segments);
    const doneHw = tasks.filter((t) => isDone(t) && !t.study).flatMap((t) => t.segments);
    const plan = planAll(tasks.filter((t) => !isDone(t)), [...fixedBusy, ...doneSegs.map((s) => [s.start, s.end])], windows,
      { dailyCap, capLeft: capLeftFrom(doneHw, hwCap), cram: cramOpt });
    setTasks((ts) => ts.map((t) => (plan[t.id] ? { ...t, ...plan[t.id] } : t)));
  };

  /* ----- Calendar navigation ----- */
  const dates = view === "day" ? [anchor] : view === "week" ? Array.from({ length: 7 }, (_, i) => addDays(weekStart(anchor), i)) : [];
  const step = (dir) => setAnchor((a) => (view === "day" ? addDays(a, dir) : view === "week" ? addDays(a, 7 * dir) : addMonths(a, dir)));
  const openDay = (d) => { setAnchor(d); updateSettings({ view: "day" }); };
  const title = view === "day"
    ? fmtDate(anchor, { weekday: "long", month: "long", day: "numeric", year: "numeric" })
    : view === "week"
      ? `${fmtDate(dates[0], { month: "short", day: "numeric" })} – ${fmtDate(dates[6], { month: "short", day: "numeric", year: "numeric" })}`
      : fmtDate(anchor, { month: "long", year: "numeric" });

  /* ----- Zoom: buttons, slider, and ctrl/⌘ + scroll or trackpad pinch, anchored so the spot you're looking at stays put ----- */
  const scrollRef = useRef(null), bodyRef = useRef(null), anchorRef = useRef(null), hourPxRef = useRef(hourPx);
  hourPxRef.current = hourPx;
  const zoomTo = (next, offsetY) => {
    next = clamp(Math.round(next), ZOOM_MIN, ZOOM_MAX);
    const el = scrollRef.current, body = bodyRef.current;
    if (el && body) {
      const oy = offsetY ?? el.clientHeight / 2;
      anchorRef.current = { min: (el.scrollTop + oy - body.offsetTop) / (hourPxRef.current / 60), oy };
    }
    updateSettings({ hourPx: next });
  };
  const zoomToRef = useRef(zoomTo); zoomToRef.current = zoomTo;
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return; // plain scrolling still scrolls
      e.preventDefault();
      const factor = Math.exp(-clamp(e.deltaY, -40, 40) * 0.01);
      zoomToRef.current(hourPxRef.current * factor, e.clientY - el.getBoundingClientRect().top);
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [view]);
  useLayoutEffect(() => {
    const a = anchorRef.current, el = scrollRef.current, body = bodyRef.current;
    if (!a || !el || !body) return;
    el.scrollTop = a.min * (hourPx / 60) + body.offsetTop - a.oy;
    anchorRef.current = null;
  }, [hourPx]);
  // Jump to "now" (or the top of the day) when the view or range changes.
  const rangeKey = view + ":" + (dates[0] || anchor);
  useLayoutEffect(() => {
    const el = scrollRef.current, body = bodyRef.current;
    if (!el || !body) return;
    el.scrollTop = dates.includes(now.today) ? Math.max(0, (now.min - DAY_START - 60) * (hourPx / 60)) : 0;
  }, [rangeKey]);

  useEffect(() => {
    if (!confirmClear) return;
    const t = setTimeout(() => setConfirmClear(false), 3000);
    return () => clearTimeout(t);
  }, [confirmClear]);

  const todayLabel = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <h1>Reality<span>Check</span></h1>
          <p>How long will this <em>actually</em> take me, and what's left of my week?</p>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <a className="btn cram-link" href="cram.html">Cram mode{cram.active ? " · on" : ""} →</a>
          <div className="date-pill">{todayLabel}</div>
        </div>
      </header>

      <div className="layout">
        <aside className="stack">
          <DayStats events={events} tasks={tasks} date={view === "day" ? anchor : now.today} now={now} />
          <AddEventForm onAdd={(ev) => setEvents((es) => [...es, ev])} draft={draft} defaultDate={view === "day" ? anchor : now.today} />
          <TaskEstimator onAdd={addTask} todayN={todayN} lookahead={lookahead} />
          <TaskList tasks={tasks} cram={cram} absEvents={absEvents} nowAbs={nowAbs} todayN={todayN}
            settings={{ ...settings, lookahead: settings.lookahead, dailyCapH: settings.dailyCapH }} onSettings={updateSettings}
            onOptimize={optimize} onRemove={(id) => setTasks((ts) => ts.filter((t) => t.id !== id))} onJump={openDay} />
        </aside>

        <section className="card tl-card">
          <div className="tl-head">
            <div className="cal-nav">
              <button className="btn ghost small" onClick={() => setAnchor(now.today)}>Today</button>
              <button className="icon-btn" aria-label="Previous" onClick={() => step(-1)}>‹</button>
              <button className="icon-btn" aria-label="Next" onClick={() => step(1)}>›</button>
              <h2 className="cal-title">{title}</h2>
            </div>
            <div className="cal-tools">
              <div className="seg-ctrl" role="group" aria-label="View">
                {["day", "week", "month"].map((v) => (
                  <button key={v} type="button" aria-pressed={view === v} onClick={() => updateSettings({ view: v })}>
                    {v[0].toUpperCase() + v.slice(1)}
                  </button>
                ))}
              </div>
              <input className="jump" type="date" aria-label="Jump to date" value={anchor}
                onChange={(e) => isDateKey(e.target.value) && setAnchor(e.target.value)} />
            </div>
          </div>
          <div className="tl-sub">
            <div className="legend">
              <span><i style={{ background: COLORS[0].edge }} />fixed event</span>
              <span><i style={{ background: "repeating-linear-gradient(135deg, #4a72c4 0 2px, #e6eefb 2px 4px)" }} />planned task</span>
              <span><i style={{ background: "var(--accent)" }} />now / drop-dead</span>
            </div>
            {view !== "month" && (
              <div className="zoom" title="Tip: hold Ctrl/⌘ and scroll, or pinch on a trackpad">
                <span>Zoom</span>
                <button className="icon-btn" aria-label="Zoom out" disabled={hourPx <= ZOOM_MIN} onClick={() => zoomTo(hourPx / 1.25)}>−</button>
                <input type="range" min={ZOOM_MIN} max={ZOOM_MAX} value={hourPx} aria-label="Zoom" onChange={(e) => zoomTo(Number(e.target.value))} />
                <button className="icon-btn" aria-label="Zoom in" disabled={hourPx >= ZOOM_MAX} onClick={() => zoomTo(hourPx * 1.25)}>+</button>
                <button className="linkbtn" type="button" onClick={() => zoomTo(ZOOM_DEFAULT)}>reset</button>
              </div>
            )}
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn ghost small" onClick={() => setEvents((es) => [...es.filter((e) => e.date !== now.today), ...sampleFor(now.today)])}>Load sample day</button>
              <button className="btn ghost small" onClick={() => (confirmClear ? (setEvents([]), setTasks([]), setConfirmClear(false)) : setConfirmClear(true))}>
                {confirmClear ? "Click again to clear everything" : "Clear all"}
              </button>
            </div>
          </div>
          {view === "month" ? (
            <MonthGrid anchor={anchor} events={events} tasks={tasks} today={now.today} onOpenDay={openDay} />
          ) : (
            <TimeGrid dates={dates} now={now} hourPx={hourPx} windDown={windDown} events={events} tasks={tasks} nowAbs={nowAbs}
              scrollRef={scrollRef} bodyRef={bodyRef}
              onDelete={(id) => setEvents((es) => es.filter((e) => e.id !== id))}
              onOpenDay={openDay}
              onPickSlot={(date, m) => setDraft({ date, m, at: Date.now() /* new object so clicking the same slot re-fills */ })} />
          )}
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

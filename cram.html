<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cram Mode — RealityCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --paper: #f6f2ea; --card: #fffdf8; --ink: #1f1d1a; --muted: #6f6a61; --line: #e4ddd0; --line-strong: #cfc6b6;
    --accent: #e0603a; --accent-soft: #fbe3d9; --sage: #5d8a6a; --sage-soft: #e3eee5; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "DM Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: "DM Mono", ui-monospace, monospace; }
  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; margin: 0; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .back { color: var(--ink); font-weight: 600; text-decoration: none; border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 12px; background: var(--card); }
  .layout { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card h2 { font-family: "Fraunces", serif; font-size: 19px; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
  input[type=text], input[type=number], input[type=datetime-local] {
    background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0;
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
  .swatches { display: flex; gap: 6px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
  .btn.hot { background: var(--accent); border-color: var(--accent); }
  .error { color: var(--accent); font-size: 13px; margin: 0; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }
  .linkbtn { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; }
  .x { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }

  .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .slider .name { font-size: 13px; font-weight: 500; }
  .slider .val { font-family: "DM Mono", monospace; font-size: 13px; background: var(--paper); border-radius: 6px; padding: 1px 7px; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
  .slider .ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -2px; }

  .exam { border: 1px solid var(--line); border-left: 5px solid; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
  .exam-top { display: flex; gap: 8px; align-items: center; }
  .exam-top input { font-weight: 600; }
  .cooked { font-weight: 600; }
  .days-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .days-row input { width: 70px; padding: 5px 8px; }
  .tag { font-family: "DM Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }

  /* Plan preview */
  .totals { display: flex; flex-direction: column; gap: 10px; }
  .total-row .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .total-row .top b { font-weight: 600; }
  .total-row .meta { font-size: 12px; color: var(--muted); }
  .track { height: 10px; border-radius: 5px; background: var(--paper); overflow: hidden; margin: 5px 0 3px; }
  .track i { display: block; height: 100%; border-radius: 5px; }
  .days { display: flex; flex-direction: column; gap: 8px; }
  .day-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; }
  .day-label { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .day-label b { display: block; color: var(--ink); font-size: 13px; }
  .day-bar { position: relative; height: 26px; border-radius: 7px; background: var(--paper); display: flex; overflow: hidden; }
  .day-bar i { display: block; height: 100%; border-right: 2px solid var(--card); }
  .day-bar i.hw { background: repeating-linear-gradient(135deg, #d9d2c4 0 5px, #ece6da 5px 10px); }
  .day-meta { grid-column: 2; font-size: 11.5px; color: var(--muted); margin-top: -4px; }
  .day-meta .exam-flag { color: var(--accent); font-weight: 600; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .hw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hw-list li { background: var(--paper); border-radius: 10px; padding: 8px 11px; font-size: 13px; }
  .hw-list li b { font-weight: 600; }
  .hw-list .warn { color: var(--accent); font-weight: 500; }
  .banner { background: var(--accent-soft); color: #8a3a22; border-radius: 10px; padding: 9px 11px; font-size: 13px; margin: 0; }
  .banner.ok { background: var(--sage-soft); color: #2f5a3b; }
  .empty { font-size: 14px; color: var(--muted); margin: 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Shared estimation + scheduling + cram engine (same file the calendar uses) -->
<script src="engine.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const CRAM_DEFAULT = { active: false, exams: [], dailyHours: 6, hwShare: 0.25, effort: 0.8, hwCapByDay: {}, appliedSig: null };
const SETTINGS_DEFAULT = { windDown: "21:00", planFrom: "", lookahead: 7, dailyCapH: 4 };

/* Same storage hook as the calendar, so both pages read and write the same data (and stay in sync across tabs). */
function useStoredState(key, fallback, migrate) {
  const [value, setValue] = useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      if (Array.isArray(fallback)) { if (Array.isArray(v)) return migrate ? migrate(v) : v; }
      else if (v && typeof v === "object") return { ...fallback, ...v };
    } catch (e) {}
    return fallback;
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }, [key, value]);
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== key || e.newValue == null) return;
      try { const v = JSON.parse(e.newValue); setValue(Array.isArray(fallback) ? (migrate ? migrate(v) : v) : { ...fallback, ...v }); } catch (err) {}
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [key]);
  return [value, setValue];
}

function useNow() {
  const get = () => { const d = new Date(); return { today: dateKey(d), min: d.getHours() * 60 + d.getMinutes() }; };
  const [now, setNow] = useState(get);
  useEffect(() => { const t = setInterval(() => setNow(get()), 30000); return () => clearInterval(t); }, []);
  return now;
}

function Slider({ name, value, display, onChange, min, max, step, low, high }) {
  return (
    <div className="slider">
      <span className="name">{name}</span>
      <span className="val">{display}</span>
      <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} aria-label={name} />
      <div className="ends"><span>{low}</span><span>{high}</span></div>
    </div>
  );
}

function ExamCard({ exam, nowAbs, onChange, onRemove }) {
  const c = COLORS[exam.color] || COLORS[0];
  const at = absFromLocal(exam.when);
  const autoDays = exam.days == null;
  const days = autoDays ? suggestedDays(exam.cooked) : exam.days;
  const set = (patch) => onChange({ ...exam, ...patch });
  return (
    <div className="exam" style={{ borderLeftColor: c.edge }}>
      <div className="exam-top">
        <input type="text" placeholder="Class, e.g. MA 261" value={exam.name} aria-label="Exam name" onChange={(e) => set({ name: e.target.value })} />
        <button className="x" aria-label={`Remove ${exam.name || "exam"}`} onClick={onRemove}>×</button>
      </div>
      <div className="row3">
        <label className="field">Exam starts
          <input type="datetime-local" value={exam.when} onChange={(e) => set({ when: e.target.value })} />
        </label>
        <label className="field">Length (min)
          <input type="number" min="15" max="300" step="15" value={exam.length}
            onChange={(e) => set({ length: e.target.value === "" ? "" : Number(e.target.value) })} />
        </label>
      </div>
      {!exam.name.trim() && <p className="error">Give it a name.</p>}
      {exam.name.trim() && (at == null ? <p className="error">Set the exam date and time.</p>
        : at <= nowAbs ? <p className="error">That's already happened. Pick a future time.</p> : null)}
      <Slider name="How cooked are you?" value={exam.cooked} min={1} max={5} step={1}
        display={<span className="cooked">{exam.cooked}/5 · {COOKED_LABELS[exam.cooked - 1]}</span>}
        onChange={(v) => set({ cooked: v })} low="easy A" high="pray for a curve" />
      <div className="days-row">
        Study over the last
        <input type="number" min="1" max="21" value={days} aria-label="Study days"
          onChange={(e) => set({ days: e.target.value === "" ? null : clamp(Math.round(Number(e.target.value)), 1, 21) })} />
        days
        {autoDays ? <span className="tag">auto</span> : <button className="linkbtn" onClick={() => set({ days: null })}>back to auto ({suggestedDays(exam.cooked)})</button>}
      </div>
      <div className="swatches" role="group" aria-label="Color">
        {COLORS.map((col, i) => (
          <button key={i} type="button" className="swatch" aria-pressed={exam.color === i} aria-label={`Color ${i + 1}`}
            style={{ background: col.edge }} onClick={() => set({ color: i })} />
        ))}
      </div>
    </div>
  );
}

function App() {
  const [events, setEvents] = useStoredState(STORAGE_KEY, [], migrateEvents);
  const [tasks, setTasks] = useStoredState(TASKS_KEY, [], migrateTasks);
  const [settings] = useStoredState(SETTINGS_KEY, SETTINGS_DEFAULT);
  const [cram, setCram] = useStoredState(CRAM_KEY, CRAM_DEFAULT);
  const [justApplied, setJustApplied] = useState(false);
  const now = useNow();
  const update = (patch) => { setCram((c) => ({ ...c, ...patch })); setJustApplied(false); };

  /* ----- Inputs ----- */
  const todayN = dayNum(now.today);
  const nowAbs = todayN * DAY_MIN + now.min;
  const fromAbs = absFromLocal(settings.planFrom) ?? Math.ceil(nowAbs / 5) * 5;
  const windDown = Math.min(timeOr(settings.windDown, 21 * 60), DAY_END);
  const dailyCap = Number(settings.dailyCapH) > 0 ? Number(settings.dailyCapH) * 60 : Infinity;
  const lookahead = clamp(Math.round(Number(settings.lookahead) || 7), 1, 60);
  const dailyHours = clamp(Number(cram.dailyHours) || 6, 1, 14);
  const hwShare = clamp(Number(cram.hwShare) || 0, 0, 0.8);
  const effort = clamp(Number(cram.effort) || 1, 0.5, 1);

  const exams = cram.exams.map((e) => ({ ...e, at: absFromLocal(e.when), days: e.days == null ? suggestedDays(e.cooked) : e.days }));
  const valid = exams.filter((e) => e.name.trim() && e.at != null && e.at > nowAbs);

  /* ----- Plan (a dry run: nothing is saved until you hit Apply) ----- */
  const alloc = cramAllocate(valid, { fromAbs, dayStart: DAY_START, windDown, dailyMin: dailyHours * 60, hwShare });
  const study = cramStudyTasks(valid, alloc);
  const examEvents = valid.map((e) => {
    const d = dayOfAbs(e.at), start = e.at - d * DAY_MIN;
    return { id: "exam:" + e.id, cramExamId: e.id, title: `${e.name.trim()} exam`, date: keyOf(d), start,
      end: Math.min(start + (Number(e.length) || 90), DAY_MIN), color: e.color };
  });
  const otherEvents = events.filter((e) => !e.cramExamId);
  const isDone = (t) => t.fits && t.segments.length && t.segments[t.segments.length - 1].end <= nowAbs;
  const hwTasks = tasks.filter((t) => !t.study);
  const doneHw = hwTasks.filter(isDone), todoHw = hwTasks.filter((t) => !isDone(t));
  const doneSegs = doneHw.flatMap((t) => t.segments);
  const lastDay = Math.max(dayOfAbs(fromAbs), ...valid.map((e) => dayOfAbs(e.at)));
  const windows = planningWindows(fromAbs, Math.max(lookahead, lastDay - dayOfAbs(fromAbs) + 1), DAY_START, windDown);

  const runPlan = (withCram) => {
    const fixed = [...otherEvents, ...examEvents].map(eventAbs).map((e) => [e.start, e.end]);
    const cramOpt = withCram ? { hwCapByDay: alloc.hwCapByDay, effort } : null;
    const hwCap = withCram ? (d) => (d in alloc.hwCapByDay ? alloc.hwCapByDay[d] : dailyCap) : dailyCap;
    return planAll(withCram ? [...todoHw, ...study] : todoHw, [...fixed, ...doneSegs.map((s) => [s.start, s.end])], windows,
      { dailyCap, capLeft: capLeftFrom(doneSegs, hwCap), cram: cramOpt });
  };
  const plan = runPlan(true);

  const placedStudy = study.map((t) => ({ ...t, ...plan[t.id] }));
  const studyMinOn = (examId, day) => placedStudy.filter((t) => t.examId === examId && t.fits)
    .reduce((s, t) => s + t.segments.filter((g) => g.kind !== "break" && dayOfAbs(g.start) === day).reduce((a, g) => a + g.end - g.start, 0), 0);
  const hwMinOn = (day) => todoHw.reduce((s, t) => s + ((plan[t.id] && plan[t.id].segments) || [])
    .filter((g) => g.kind !== "break" && dayOfAbs(g.start) === day).reduce((a, g) => a + g.end - g.start, 0), 0);
  const examTotals = valid.map((e) => {
    const mine = placedStudy.filter((t) => t.examId === e.id);
    const placed = mine.filter((t) => t.fits).reduce((s, t) => s + t.total, 0);
    const wanted = mine.reduce((s, t) => s + t.total, 0);
    return { e, placed, missing: wanted - placed, firstDay: mine.length ? dayOfAbs(mine[0].earliest) : null };
  });
  const grand = examTotals.reduce((s, x) => s + x.placed, 0) || 1;
  const maxBudget = Math.max(60, ...alloc.days.map((d) => d.budget));

  const sig = JSON.stringify({ exams: cram.exams, dailyHours, hwShare, effort });
  const dirty = cram.active && cram.appliedSig !== sig;

  /* ----- Write to the calendar ----- */
  const apply = () => {
    setEvents([...otherEvents, ...examEvents]);
    setTasks([
      ...hwTasks.map((t) => (plan[t.id] ? { ...t, ...plan[t.id] } : t)),
      ...placedStudy,
    ]);
    setCram((c) => ({ ...c, active: true, hwCapByDay: alloc.hwCapByDay, appliedSig: sig }));
    setJustApplied(true);
  };
  const turnOff = () => {
    const normal = runPlan(false);
    setTasks(hwTasks.map((t) => (normal[t.id] ? { ...t, ...normal[t.id] } : t)));
    setCram((c) => ({ ...c, active: false, hwCapByDay: {}, appliedSig: null }));
    setJustApplied(false);
  };
  const addExam = () => update({
    exams: [...cram.exams, { id: newId(), name: "", when: "", length: 90, cooked: 3, days: null, color: cram.exams.length % COLORS.length }],
  });

  return (
    <div className="app">
      <header className="top">
        <div className="brand">
          <h1>Cram <span>Mode</span></h1>
          <p>Exams this week? Tell it how cooked you are. It shifts time from homework to studying, and toward the exams that need it most.</p>
        </div>
        <a className="back" href="index.html">← Back to calendar</a>
      </header>

      <div className="layout">
        <aside className="stack">
          <div className="card">
            <h2>Your exams</h2>
            <p className="sub">The more cooked you are, the bigger the share of each day's study time and the earlier you start. Two equally cooked exams split time evenly; the next exam up gets a boost.</p>
            <div className="stack" style={{ gap: 12 }}>
              {cram.exams.length === 0 && <p className="empty">No exams yet.</p>}
              {cram.exams.map((e, i) => (
                <ExamCard key={e.id} exam={e} nowAbs={nowAbs}
                  onChange={(next) => update({ exams: cram.exams.map((x) => (x.id === e.id ? next : x)) })}
                  onRemove={() => update({ exams: cram.exams.filter((x) => x.id !== e.id) })} />
              ))}
              <button className="btn ghost" type="button" onClick={addExam}>+ Add an exam</button>
            </div>
          </div>

          <div className="card">
            <h2>Cram settings</h2>
            <p className="sub">How much time you'll give on cram days, and how much of it homework still gets.</p>
            <div className="stack" style={{ gap: 14 }}>
              <Slider name="Work time per cram day" value={dailyHours} min={1} max={14} step={0.5}
                display={fmtDur(dailyHours * 60)} onChange={(v) => update({ dailyHours: v })} low="1h" high="14h (good luck)" />
              <Slider name="Homework's share" value={Math.round(hwShare * 100)} min={0} max={80} step={5}
                display={`${Math.round(hwShare * 100)}% · ${fmtDur(Math.round((dailyHours * 60 * hwShare) / 5) * 5)}/day`}
                onChange={(v) => update({ hwShare: v / 100 })} low="exams only" high="mostly homework" />
              <Slider name="Homework effort" value={Math.round(effort * 100)} min={50} max={100} step={5}
                display={effort < 1 ? `${Math.round(effort * 100)}% · minimum viable` : "100% · full effort"}
                onChange={(v) => update({ effort: v / 100 })} low="just get it submitted" high="full effort" />
              <p className="note">
                Uses your calendar's wind-down ({fmt(windDown)}) and fixed events. Days with no exam coming up keep
                your normal limit ({dailyCap === Infinity ? "none" : fmtDur(dailyCap)} a day).
              </p>
            </div>
          </div>
        </aside>

        <section className="stack">
          <div className="card">
            <h2>The plan</h2>
            {valid.length === 0 ? (
              <p className="empty">Add an exam with a name and a future date to see the plan.</p>
            ) : (
              <div className="stack">
                <div className="totals">
                  {examTotals.map(({ e, placed, missing, firstDay }) => {
                    const c = COLORS[e.color] || COLORS[0];
                    return (
                      <div className="total-row" key={e.id}>
                        <div className="top">
                          <b>{e.name}</b>
                          <span className="mono">{fmtDur(placed)} · {Math.round((placed / grand) * 100)}%</span>
                        </div>
                        <div className="track"><i style={{ width: `${(placed / grand) * 100}%`, background: c.edge }} /></div>
                        <div className="meta">
                          {COOKED_LABELS[e.cooked - 1]} · exam {fmtWhen(e.at, todayN)}
                          {firstDay != null ? ` · studying from ${fmtDate(keyOf(firstDay), { weekday: "short", month: "short", day: "numeric" })}` : ""}
                          {missing > 0 && <span style={{ color: "var(--accent)", fontWeight: 600 }}> · {fmtDur(missing)} didn't fit around your events</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="legend">
                  {valid.map((e) => <span key={e.id}><i style={{ background: (COLORS[e.color] || COLORS[0]).edge }} />{e.name}</span>)}
                  <span><i style={{ background: "repeating-linear-gradient(135deg, #d9d2c4 0 3px, #ece6da 3px 6px)" }} />homework</span>
                  <span>bar = {fmtDur(dailyHours * 60)} day</span>
                </div>
                <div className="days">
                  {alloc.days.map(({ day, budget }) => {
                    const hw = hwMinOn(day);
                    const examsToday = valid.filter((e) => dayOfAbs(e.at) === day);
                    const studyTotal = valid.reduce((s, e) => s + studyMinOn(e.id, day), 0);
                    return (
                      <div key={day} className="day-row">
                        <div className="day-label">
                          <b>{day === todayN ? "Today" : fmtDate(keyOf(day), { weekday: "short" })}</b>
                          {fmtDate(keyOf(day), { month: "short", day: "numeric" })}
                        </div>
                        <div className="day-bar" title={`${fmtDur(studyTotal)} study · ${fmtDur(hw)} homework`}>
                          {valid.map((e) => {
                            const m = studyMinOn(e.id, day);
                            return m > 0 ? <i key={e.id} style={{ width: `${(m / maxBudget) * 100}%`, background: (COLORS[e.color] || COLORS[0]).edge }} title={`${e.name}: ${fmtDur(m)}`} /> : null;
                          })}
                          {hw > 0 && <i className="hw" style={{ width: `${(hw / maxBudget) * 100}%` }} title={`Homework: ${fmtDur(hw)}`} />}
                        </div>
                        <div className="day-meta">
                          {fmtDur(studyTotal)} study · {fmtDur(hw)} homework
                          {examsToday.map((e) => <span key={e.id} className="exam-flag"> · {e.name} exam {fmt(e.at - day * DAY_MIN)}</span>)}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <p className="note">
                  Each day's study time is split by how cooked you are (fully cooked counts 8× an "I'll be fine" exam),
                  with a boost as each exam gets close. Sessions go around your fixed events in 50-minute blocks with breaks,
                  and stop 30 minutes before each exam.
                </p>
              </div>
            )}
          </div>

          {valid.length > 0 && (
            <div className="card">
              <h2>What happens to homework</h2>
              <p className="sub">
                On cram days homework gets {Math.round(hwShare * 100)}% of the time
                {effort < 1 ? ` and is trimmed to ${Math.round(effort * 100)}% effort (just get it done)` : ""}. Deadlines still win: it's scheduled earliest-due first.
              </p>
              {todoHw.length === 0 ? <p className="empty">No homework on your calendar. Add some from the calendar's reality check.</p> : (
                <ul className="hw-list">
                  {todoHw.map((t) => {
                    const p = plan[t.id] || { fits: false, segments: [] };
                    const st = deadlineStatus({ ...t, ...p }, nowAbs);
                    const trimmed = effort < 1 ? trimForCram(t, { effort }) : t;
                    const minutes = trimmed.setup + trimmed.deep + trimmed.buffer;
                    return (
                      <li key={t.id}>
                        <b>{t.title}</b> · {effort < 1 ? <>{fmtDur(t.total)} → <b>{fmtDur(minutes)}</b></> : fmtDur(t.total)}
                        <div className={p.fits ? "" : "warn"}>
                          {p.fits ? `${fmtWhen(p.segments[0].start, todayN)} – ${fmtWhen(p.segments[p.segments.length - 1].end, todayN)}` : "Doesn't fit in this plan"}
                          {st && st.late ? <span className="warn"> · finishes {fmtDur(st.late)} after it's due</span> : ""}
                          {st && !st.late && p.fits ? ` · due ${fmtWhen(t.deadline, todayN)}, on time` : ""}
                          {p.overCramCap ? " · gets extra time beyond the homework share so it isn't late" : ""}
                        </div>
                      </li>
                    );
                  })}
                </ul>
              )}
            </div>
          )}

          <div className="card">
            <div className="stack" style={{ gap: 12 }}>
              {justApplied && !dirty && <p className="banner ok">On your calendar: {study.filter((t) => plan[t.id] && plan[t.id].fits).length} study sessions and {examEvents.length} exams. <a href="index.html">See it →</a></p>}
              {dirty && <p className="banner">You've changed things since you applied. Apply again to update the calendar.</p>}
              <div className="actions">
                <button className="btn hot" type="button" disabled={valid.length === 0} onClick={apply}>
                  {cram.active ? "Update my calendar" : "Turn on Cram mode + put it on my calendar"}
                </button>
                {cram.active && <button className="btn ghost" type="button" onClick={turnOff}>Turn off Cram mode</button>}
              </div>
              <p className="note">
                Applying adds each exam as a fixed event, adds the study sessions (colored by exam) and re-plans your homework around them.
                Turning it off removes the study sessions and puts homework back on your normal schedule. Exams stay on the calendar.
              </p>
            </div>
          </div>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
